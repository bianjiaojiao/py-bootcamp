eq__<\/code> / <code>__hash__<\/code>）"}, {"type": "quote", "html": "<p>一句话：<strong>重写了 <code>__eq__<\/code>，Python 会自动把 <code>__hash__<\/code> 设为 <code>None<\/code><\/strong>——对象就再也放不进 <code>set<\/code> / <code>dict<\/code> 的 key 了。<\/p>"}, {"type": "h", "level": 2, "text": "1. __hash__ 的小坑（今天的重点）", "html": "1. <code>__hash__<\/code> 的小坑（今天的重点）"}, {"type": "quote", "html": "<p>只要你重写了 <code>__eq__<\/code>，Python 会<strong>自动把 <code>__hash__<\/code> 设为 None<\/strong>——也就是说，这个对象不能再放进 <code>set<\/code> / <code>dict<\/code> 的 key。<\/p>"}, {"type": "code", "lang": "python", "text": "class Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and (self.x, self.y) == (other.x, other.y)\n\n\n{Point(1, 2)}     # ❌ TypeError: unhashable type: 'Point'"}, {"type": "p", "html": "<strong>为什么 Python 要这么设计？<\/strong>"}, {"type": "ul", "items": ["<code>set<\/code> / <code>dict<\/code> 靠<strong>哈希值<\/strong>找元素，再用 <code>==<\/code> 确认", "如果两个对象 <code>__eq__<\/code> 相等但哈希值不同，<code>set<\/code> 里会出现&quot;看起来重复却删不掉&quot;的诡异 bug", "所以 Python 干脆要求：<strong>你要自定义&quot;相等&quot;，就必须自己保证&quot;哈希一致&quot;<\/strong>；不写就当不可哈希"]}, {"type": "h", "level": 2, "text": "2. 正确写法：手动补上 __hash__", "html": "2. 正确写法：手动补上 <code>__hash__<\/code>"}, {"type": "code", "lang": "python", "text": "class Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and (self.x, self.y) == (other.x, other.y)\n\n    def __hash__(self):\n        # 用「参与 __eq__ 比较的那些字段」组成元组来算哈希\n        return hash((self.x, self.y))\n\n\np1, p2 = Point(1, 2), Point(1, 2)\nprint(p1 == p2)          # True\nprint(len({p1, p2}))     # 1  ← 去重成功\nprint({p1: \"点A\"}[p2])   # 点A ← 能当 dict 的 key"}, {"type": "p", "html": "<strong>核心原则<\/strong>：<code>__eq__<\/code> 用哪些字段比较，<code>__hash__<\/code> 就用哪些字段算哈希。"}, {"type": "h", "level": 2, "text": "3. 什么是\"可哈希\"", "html": "3. 什么是&quot;可哈希&quot;"}, {"type": "table", "rows": [["类型", "可哈希？"], ["<code>int<\/code> / <code>float<\/code> / <code>str<\/code> / <code>bool<\/code> / <code>None<\/code>", "✅"], ["<code>tuple<\/code>（元素都可哈希时）", "✅"], ["<code>frozenset<\/code>", "✅"], ["<code>list<\/code> / <code>dict<\/code> / <code>set<\/code>", "❌ 可变的都不行"], ["自定义类", "默认按 <code>id()<\/code> 哈希；<strong>重写 <code>__eq__<\/code> 后就变 None<\/strong>"]]}, {"type": "code", "lang": "python", "text": "{1, \"a\", (1, 2)}      # ✅ 都可以\n{[1, 2]}              # ❌ TypeError: unhashable type: 'list'"}, {"type": "h", "level": 2, "text": "4. 常用特殊方法速查", "html": "4. 常用特殊方法速查"}, {"type": "table", "rows": [["方法", "触发时机"], ["<code>__init__<\/code>", "创建实例"], ["<code>__eq__<\/code>", "<code>==<\/code>"], ["<code>__hash__<\/code>", "<code>hash()<\/code>、放进 <code>set<\/code> / <code>dict<\/code> 的 key"], ["<code>__str__<\/code>", "<code>print()<\/code> / <code>str()<\/code>"], ["<code>__repr__<\/code>", "调试时直接输入对象"], ["<code>__len__<\/code>", "<code>len()<\/code>"], ["<code>__add__<\/code>", "<code>+<\/code>"], ["<code>__iter__<\/code> / <code>__next__<\/code>", "迭代（配合 <code>for<\/code>）"]]}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["重写 <code>__eq__<\/code> 而忘了 <code>__hash__<\/code> → 对象<strong>不可哈希<\/strong>，放进 <code>set<\/code> 直接报 <code>TypeError<\/code>", "<code>__eq__<\/code> 和 <code>__hash__<\/code> 必须<strong>用同一组字段<\/strong>，否则会出&quot;查不到 / 删不掉&quot;的怪问题", "可变对象（<code>list<\/code>/<code>dict<\/code>/<code>set<\/code>）<strong>天然不可哈希<\/strong>，不能当 <code>dict<\/code> 的 key", "重写 <code>__eq__<\/code> 时先判断 <code>isinstance(other, 类名)<\/code>，避免和别的类型比较时崩掉", "想打印好看要写 <code>__str__<\/code>，调试方便要写 <code>__repr__<\/code>（两者别混）"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["字典（key 必须可哈希）→ <a href=\"#topic-04\" data-go=\"topic-04\">04-字典<\/a>", "集合（去重靠哈希）→ <a href=\"#topic-05\" data-go=\"topic-05\">05-集合<\/a>", "面向对象（待建专题）", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-18/A.md\">source/2026-10-18/A.md<\/span>（图 image33）"]}]}, {"id": "topic-14", "title": "Enum 枚举", "chapter": "第 5 章 进阶", "keywords": ["Enum", "枚举", "IntEnum", "name", "value", "魔法值", "状态机", "常量"], "search": "--- title: Enum 枚举 category: 进阶 keywords: [Enum, 枚举, IntEnum, name, value, 魔法值, 状态机, 常量] dates: [2026-10-19] ---  # Enum 枚举  > 一句话：当「这个变量只能取固定的几个值」时，用 Enum 给它上防伪标签 + 防盗锁 + 说明书，杜绝拼写错误和魔法值。  ## 1. 为什么需要枚举  python # ❌ 魔法值：拼错了不报错，运行时才发现 STATUS_PENDING = 0 STATUS_RUNNING = 1  status = 2          # 2 是什么？看代码的人不知道 if status == 3:     # 写错了也不报错，逻辑静默出错     ...   python # ✅ 用 Enum：拼错立刻 AttributeError from enum import Enum  class Status(Enum):     PENDING = 0     RUNNING = 1     DONE = 2  status = Status.PENDING if status == Status.RUNING:      # ❌ AttributeError，拼错当场暴露     ...   > 用你自己的话说：普通类是个「装变量的盒子」，Enum 相当于给这个盒子上了 > 防伪标签、防盗锁、说明书（name/value），并且杜绝了任何拼写错误和恶意篡改。  ## 2. 基本用法：name 与 value  python from enum import Enum  class Color(Enum):     RED = 1     GREEN = 2     BLUE = 3  print(Color.RED.name)      # RED print(Color.RED.value)     # 1 print(Color.RED)           # Color.RED  # 按值反查成员 print(Color(1))            # Color.RED print(Color[\"RED\"])        # Color.RED  # 遍历 for c in Color:     print(c.name, c.value)     # RED 1 / GREEN 2 / BLUE 3   成员之间判等是安全的：  python Color.RED is Color.RED        # True Color.RED == Color.RED        # True Color.RED == 1                # False ← 和原始值不相等，这是优点   ## 3. ⚠️ 普通 Enum 不能比较大小  > 普通 Enum 不支持大小比较——成员之间没有「天然顺序」。  python Color.RED < Color.GREEN       # ❌ TypeError: '<' not supported   需要排序/比较时，改用 IntEnum：  python from enum import IntEnum  class Priority(IntEnum):     LOW = 1     NORMAL = 2     HIGH = 3  Priority.LOW < Priority.HIGH          # True sorted([Priority.HIGH, Priority.LOW]) # [Priority.LOW, Priority.HIGH] Priority.HIGH == 3                    # True ← IntEnum 和整数等价   > 另外还有 IntFlag（可做位运算，适合权限组合）、StrEnum（值为字符串）。  ## 4. 什么时候用枚举（速查）  > 当你写下任何一段「这个变量只能取下面这几个值」的代码时，就应该考虑 Enum。  | 场景 | 例子 | | --- | --- | | 状态机的状态 | Pending / Running / Done / Failed | | 类别 / 类型 | 颜色、性别、文件类型 | | 优先级 / 等级 | 用 IntEnum，可以排序和比较 |  替代这种散落的魔法值：  python # ❌ Before STATUS_PENDING = 0 STATUS_RUNNING = 1 STATUS_DONE = 2  # ✅ After class Status(Enum):     PENDING = 0     RUNNING = 1     DONE = 2   让代码更安全、更清晰。  ## 5. 实用小技巧  python # 给成员加说明文字 class Status(Enum):     PENDING = (\"pending\", \"等待中\")     RUNNING = (\"running\", \"运行中\")      def __init__(self, code, label):         self.code = code         self.label = label  print(Status.PENDING.label)    # 等待中   python # 强制值唯一（值重复会报错） from enum import Enum, unique  @unique class Color(Enum):     RED = 1     BLUE = 1        # ❌ ValueError: duplicate values found   ## ⚠️ 易错点速记  1. 普通 Enum 不能比较大小，要排序用 IntEnum 2. Color.RED == 1 是 False（Enum 成员不等于它的原始值）—— 这是特性不是 bug 3. 拼写错误会立刻 AttributeError，这正是你要的保护 4. 值重复默认会被当作别名吞掉；要禁止重复用 @unique 5. IntFlag 才能做位运算（|、&），普通 Enum 不行 6. 需要「人话描述」时，用 __init__ 挂额外属性，别把说明塞进 value  ## 🔗 关联  - 类与对象 → 15-类属性与实例属性 - 字典与常量组织 → 04-字典 - 原始截图 → source/2026-10-19/A.md（图 image34、image35）", "blocks": [{"type": "h", "level": 1, "text": "Enum 枚举", "html": "Enum 枚举"}, {"type": "quote", "html": "<p>一句话：当「这个变量只能取固定的几个值」时，用 <code>Enum<\/code> 给它上<strong>防伪标签 + 防盗锁 + 说明书<\/strong>，杜绝拼写错误和魔法值。<\/p>"}, {"type": "h", "level": 2, "text": "1. 为什么需要枚举", "html": "1. 为什么需要枚举"}, {"type": "code", "lang": "python", "text": "# ❌ 魔法值：拼错了不报错，运行时才发现\nSTATUS_PENDING = 0\nSTATUS_RUNNING = 1\n\nstatus = 2          # 2 是什么？看代码的人不知道\nif status == 3:     # 写错了也不报错，逻辑静默出错\n    ..."}, {"type": "code", "lang": "python", "text": "# ✅ 用 Enum：拼错立刻 AttributeError\nfrom enum import Enum\n\nclass Status(Enum):\n    PENDING = 0\n    RUNNING = 1\n    DONE = 2\n\nstatus = Status.PENDING\nif status == Status.RUNING:      # ❌ AttributeError，拼错当场暴露\n    ..."}, {"type": "quote", "html": "<p>用你自己的话说：普通类是个「装变量的盒子」，<code>Enum<\/code> 相当于给这个盒子上了<\/p><p><strong>防伪标签、防盗锁、说明书（<code>name<\/code>/<code>value<\/code>）<\/strong>，并且杜绝了任何拼写错误和恶意篡改。<\/p>"}, {"type": "h", "level": 2, "text": "2. 基本用法：name 与 value", "html": "2. 基本用法：name 与 value"}, {"type": "code", "lang": "python", "text": "from enum import Enum\n\nclass Color(Enum):\n    RED = 1\n    GREEN = 2\n    BLUE = 3\n\nprint(Color.RED.name)      # RED\nprint(Color.RED.value)     # 1\nprint(Color.RED)           # Color.RED\n\n# 按值反查成员\nprint(Color(1))            # Color.RED\nprint(Color[\"RED\"])        # Color.RED\n\n# 遍历\nfor c in Color:\n    print(c.name, c.value)     # RED 1 / GREEN 2 / BLUE 3"}, {"type": "p", "html": "成员之间<strong>判等<\/strong>是安全的："}, {"type": "code", "lang": "python", "text": "Color.RED is Color.RED        # True\nColor.RED == Color.RED        # True\nColor.RED == 1                # False ← 和原始值不相等，这是优点"}, {"type": "h", "level": 2, "text": "3. ⚠️ 普通 Enum 不能比较大小", "html": "3. ⚠️ 普通 Enum 不能比较大小"}, {"type": "quote", "html": "<p>普通 <code>Enum<\/code> <strong>不支持大小比较<\/strong>——成员之间没有「天然顺序」。<\/p>"}, {"type": "code", "lang": "python", "text": "Color.RED < Color.GREEN       # ❌ TypeError: '<' not supported"}, {"type": "p", "html": "需要<strong>排序/比较<\/strong>时，改用 <code>IntEnum<\/code>："}, {"type": "code", "lang": "python", "text": "from enum import IntEnum\n\nclass Priority(IntEnum):\n    LOW = 1\n    NORMAL = 2\n    HIGH = 3\n\nPriority.LOW < Priority.HIGH          # True\nsorted([Priority.HIGH, Priority.LOW]) # [Priority.LOW, Priority.HIGH]\nPriority.HIGH == 3                    # True ← IntEnum 和整数等价"}, {"type": "quote", "html": "<p>另外还有 <code>IntFlag<\/code>（可做位运算，适合权限组合）、<code>StrEnum<\/code>（值为字符串）。<\/p>"}, {"type": "h", "level": 2, "text": "4. 什么时候用枚举（速查）", "html": "4. 什么时候用枚举（速查）"}, {"type": "quote", "html": "<p>当你写下任何一段「<strong>这个变量只能取下面这几个值<\/strong>」的代码时，就应该考虑 <code>Enum<\/code>。<\/p>"}, {"type": "table", "rows": [["场景", "例子"], ["状态机的状态", "<code>Pending<\/code> / <code>Running<\/code> / <code>Done<\/code> / <code>Failed<\/code>"], ["类别 / 类型", "颜色、性别、文件类型"], ["优先级 / 等级", "用 <code>IntEnum<\/code>，可以排序和比较"]]}, {"type": "p", "html": "<strong>替代这种散落的魔法值<\/strong>："}, {"type": "code", "lang": "python", "text": "# ❌ Before\nSTATUS_PENDING = 0\nSTATUS_RUNNING = 1\nSTATUS_DONE = 2\n\n# ✅ After\nclass Status(Enum):\n    PENDING = 0\n    RUNNING = 1\n    DONE = 2"}, {"type": "p", "html": "让代码更安全、更清晰。"}, {"type": "h", "level": 2, "text": "5. 实用小技巧", "html": "5. 实用小技巧"}, {"type": "code", "lang": "python", "text": "# 给成员加说明文字\nclass Status(Enum):\n    PENDING = (\"pending\", \"等待中\")\n    RUNNING = (\"running\", \"运行中\")\n\n    def __init__(self, code, label):\n        self.code = code\n        self.label = label\n\nprint(Status.PENDING.label)    # 等待中"}, {"type": "code", "lang": "python", "text": "# 强制值唯一（值重复会报错）\nfrom enum import Enum, unique\n\n@unique\nclass Color(Enum):\n    RED = 1\n    BLUE = 1        # ❌ ValueError: duplicate values found"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["普通 <code>Enum<\/code> <strong>不能比较大小<\/strong>，要排序用 <code>IntEnum<\/code>", "<code>Color.RED == 1<\/code> 是 <code>False<\/code>（Enum 成员不等于它的原始值）—— 这是特性不是 bug", "拼写错误会立刻 <code>AttributeError<\/code>，这正是你要的保护", "值重复默认会被当作<strong>别名<\/strong>吞掉；要禁止重复用 <code>@unique<\/code>", "<code>IntFlag<\/code> 才能做位运算（<code>|<\/code>、<code>&amp;<\/code>），普通 <code>Enum<\/code> 不行", "需要「人话描述」时，用 <code>__init__<\/code> 挂额外属性，别把说明塞进 value"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["类与对象 → <a href=\"#topic-15\" data-go=\"topic-15\">15-类属性与实例属性<\/a>", "字典与常量组织 → <a href=\"#topic-04\" data-go=\"topic-04\">04-字典<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-19/A.md\">source/2026-10-19/A.md<\/span>（图 image34、image35）"]}]}, {"id": "topic-15", "title": "类属性与实例属性", "chapter": "第 5 章 进阶", "keywords": ["类属性", "实例属性", "self", "class attribute", "instance attribute", "共享", "可变类属性"], "search": "--- title: 类属性与实例属性 category: 进阶 keywords: [类属性, 实例属性, self, class attribute, instance attribute, 共享, 可变类属性] dates: [2026-10-19] ---  # 类属性与实例属性  > 一句话：写在类体 / type() 字典里的是类属性（所有人共享）；写在 __init__ 的 self.xxx 里的是实例属性（各存各的）。  ## 1. 两种属性写在哪  python class Dog:     species = \"犬科\"          # ← 类属性：直接写在 class 下      def __init__(self, name, hp):         self.name = name      # ← 实例属性：写在 __init__ 里         self.hp = hp   d1 = Dog(\"旺财\", 100) d2 = Dog(\"大黄\", 80)  print(d1.species, d2.species)   # 犬科 犬科  ← 共享同一份 print(d1.name, d2.name)         # 旺财 大黄  ← 各自一份   | 写法 | 名称 | 归属 | | --- | --- | --- | | class 下直接赋值 / type() 第三个参数（属性字典） | 类属性 | 所有实例共享 | | __init__ 里 self.xxx = ... | 实例属性 | 每个实例各存各的 |  > 用你自己的话说： > - 类属性「所有人共享，改一处，全遭殃」——适合存常量，比如圆周率 > - 实例属性「各存各的，互不干扰」——适合存每个人的名字、年龄、血量  ## 2. 查找顺序：先找实例，再找类  python class Dog:     species = \"犬科\"  d = Dog() print(d.species)        # 犬科（实例上没有 → 去类里找） d.species = \"猫科\"       # ← 这是在【实例上】新建了一个属性 print(d.species)        # 猫科（实例自己的） print(Dog.species)      # 犬科（类属性没变）   > ⚠️ d.species = \"猫科\" 没有修改类属性，只是在实例上「遮蔽」了它。  ## 3. 修改类属性：必须通过类名  python class Dog:     species = \"犬科\"  d1, d2 = Dog(), Dog()  Dog.species = \"猫科\"     # ✅ 通过类名改 → 对所有实例生效 print(d1.species, d2.species)    # 猫科 猫科   ## 4. ⚠️ 最坑的地方：可变的类属性  python class Dog:     tricks = []          # ❌ 可变对象做类属性      def add_trick(self, t):         self.tricks.append(t)   a, b = Dog(), Dog() a.add_trick(\"坐下\") print(b.tricks)          # ['坐下']  ← b 也被污染了！   原因：self.tricks.append(...) 是原地修改，改的是共享的那一个列表。  ✅ 正确写法——放到 __init__ 里：  python class Dog:     def __init__(self):         self.tricks = []      # ✅ 每个实例各自一份      def add_trick(self, t):         self.tricks.append(t)   a, b = Dog(), Dog() a.add_trick(\"坐下\") print(b.tricks)          # []  ← 互不干扰   > 这和 11-函数进阶 里「可变默认参数陷阱」是同一个坑：可变对象被共享了。  ## 5. 常见用途对照  | 想存什么 | 放哪 | 例子 | | --- | --- | --- | | 所有实例共用的常量 | 类属性 | PI = 3.14159、species = \"犬科\" | | 计数器（统计创建了多少实例） | 类属性 | Dog.count += 1 | | 每个对象自己的数据 | 实例属性 | self.name、self.hp | | 每个对象自己的可变容器 | 实例属性（在 __init__ 建） | self.tricks = [] |  统计实例个数：  python class Dog:     count = 0                 # 类属性做计数器      def __init__(self, name):         self.name = name         Dog.count += 1        # 注意：用类名 +=，别用 self.count +=  Dog(\"旺财\"); Dog(\"大黄\") print(Dog.count)              # 2   ## ⚠️ 易错点速记  1. self.xxx = ... 写在方法里 → 实例属性；直接写在 class 下 → 类属性 2. d.attr = v 只是在实例上遮蔽，不会改类属性；改类属性要用 类名.attr = v 3. 可变对象（list/dict/set）不要做类属性，会被所有实例共享 → 放到 __init__ 4. 类属性计数器要写 Dog.count += 1，不要写 self.count += 1（后者会建出实例属性） 5. 查找顺序：实例属性 → 类属性 → 父类，所以「看起来能读到」不代表「改的是同一个」  ## 🔗 关联  - 可变默认参数（同一个坑）→ 11-函数进阶 - 元类与 type → 16-元类与type - 原始截图 → source/2026-10-19/A.md（手写要点 5、6）", "blocks": [{"type": "h", "level": 1, "text": "类属性与实例属性", "html": "类属性与实例属性"}, {"type": "quote", "html": "<p>一句话：写在<strong>类体 / <code>type()<\/code> 字典<\/strong>里的是<strong>类属性<\/strong>（所有人共享）；写在 <strong><code>__init__<\/code> 的 <code>self.xxx<\/code><\/strong> 里的是<strong>实例属性<\/strong>（各存各的）。<\/p>"}, {"type": "h", "level": 2, "text": "1. 两种属性写在哪", "html": "1. 两种属性写在哪"}, {"type": "code", "lang": "python", "text": "class Dog:\n    species = \"犬科\"          # ← 类属性：直接写在 class 下\n\n    def __init__(self, name, hp):\n        self.name = name      # ← 实例属性：写在 __init__ 里\n        self.hp = hp\n\n\nd1 = Dog(\"旺财\", 100)\nd2 = Dog(\"大黄\", 80)\n\nprint(d1.species, d2.species)   # 犬科 犬科  ← 共享同一份\nprint(d1.name, d2.name)         # 旺财 大黄  ← 各自一份"}, {"type": "table", "rows": [["写法", "名称", "归属"], ["<code>class<\/code> 下直接赋值 / <code>type()<\/code> 第三个参数（属性字典）", "类属性", "<strong>所有实例共享<\/strong>"], ["<code>__init__<\/code> 里 <code>self.xxx = ...<\/code>", "实例属性", "<strong>每个实例各存各的<\/strong>"]]}, {"type": "quote", "html": "<p>用你自己的话说：<\/p><p>- 类属性「所有人共享，<strong>改一处，全遭殃<\/strong>」——适合存常量，比如圆周率<\/p><p>- 实例属性「各存各的，<strong>互不干扰<\/strong>」——适合存每个人的名字、年龄、血量<\/p>"}, {"type": "h", "level": 2, "text": "2. 查找顺序：先找实例，再找类", "html": "2. 查找顺序：先找实例，再找类"}, {"type": "code", "lang": "python", "text": "class Dog:\n    species = \"犬科\"\n\nd = Dog()\nprint(d.species)        # 犬科（实例上没有 → 去类里找）\nd.species = \"猫科\"       # ← 这是在【实例上】新建了一个属性\nprint(d.species)        # 猫科（实例自己的）\nprint(Dog.species)      # 犬科（类属性没变）"}, {"type": "quote", "html": "
