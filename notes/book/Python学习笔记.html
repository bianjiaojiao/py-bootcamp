\"); Dog(\"大黄\")\nprint(Dog.count)              # 2"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<code>self.xxx = ...<\/code> 写在方法里 → <strong>实例属性<\/strong>；直接写在 class 下 → <strong>类属性<\/strong>", "<code>d.attr = v<\/code> 只是在实例上遮蔽，<strong>不会改类属性<\/strong>；改类属性要用 <code>类名.attr = v<\/code>", "<strong>可变对象（list/dict/set）不要做类属性<\/strong>，会被所有实例共享 → 放到 <code>__init__<\/code>", "类属性计数器要写 <code>Dog.count += 1<\/code>，不要写 <code>self.count += 1<\/code>（后者会建出实例属性）", "查找顺序：实例属性 → 类属性 → 父类，所以「看起来能读到」不代表「改的是同一个」"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["可变默认参数（同一个坑）→ <a href=\"#topic-11\" data-go=\"topic-11\">11-函数进阶<\/a>", "元类与 type → <a href=\"#topic-16\" data-go=\"topic-16\">16-元类与type<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-19/A.md\">source/2026-10-19/A.md<\/span>（手写要点 5、6）"]}]}, {"id": "topic-16", "title": "元类与 type", "chapter": "第 5 章 进阶", "keywords": ["元类", "metaclass", "type", "一切类都源自type", "动态造类", "类也是对象", "__init_subclass__"], "search": "--- title: 元类与 type category: 进阶 keywords: [元类, metaclass, type, 一切类都源自type, 动态造类, 类也是对象, __init_subclass__] dates: [2026-10-19] ---  # 元类与 type  > 一句话：一切对象都源自类，一切类都源自 type——类本身也是对象，它的\"类\"就是 type；元类就是\"造类的类\"。  ## 1. 一切东西都是对象  > 一切对象都源自类，一切类都源自 type。  python class Dog:     pass  d = Dog()  type(d)          # <class '__main__.Dog'>   ← 实例的类型是 Dog type(Dog)        # <class 'type'>           ← 类的类型是 type！ type(type)       # <class 'type'>           ← type 自己也是 type   > type() 一个对象时返回它的类型。所以所有 class 的类型都是 type。  ## 2. type() 的第二种用法：传三个参数造类  既然 type 是创建类的元类，那能不能直接调用 type 来造一个类？答案是能。  type() 还有第二种用法——传三个参数：  python type(类名, 父类元组, 属性字典)   | 参数 | 说明 | | --- | --- | | 类名 | 字符串，例如 'Hello' | | 父类元组 | 单父类要写成单元组：(object,)，多继承就多个 | | 属性字典 | {'方法名': 函数, '属性名': 值} |  ### 等价写法对照  python # 写法一：class 语句（最常用） class Hello:     def __init__(self, name):         self.name = name      def greet(self):         print(f\"Hello, {self.name}\")   # 写法二：type() 动态造类（与上面完全等价） def __init__(self, name):     self.name = name  def greet(self):     print(f\"Hello, {self.name}\")  Hello2 = type(\"Hello2\", (object,), {     \"__init__\": __init__,     \"greet\": greet,     \"version\": 1,          # 类属性也一起放进来 })  h = Hello2(\"小明\") h.greet()                  # Hello, 小明   > 注意：type() 的第三个参数就是类属性的字典——所以你笔记里写的 > 「写在 type() 的字典里，或直接写在 class 下的：是类属性」说的就是同一件事。  ## 3. 什么是元类  元类 = 创建类的类。class 语句在底层其实是一次元类调用：  python class Dog:                 # 大致相当于：     pass                   # Dog = type(\"Dog\", (object,), {})   自定义元类，就是继承 type、在\"造类\"时插一脚：  python class CheckNames(type):     def __new__(mcs, name, bases, namespace):         # 造类之前可以做检查：所有属性名必须小写         for key in namespace:             if key.startswith(\"__\"):                 continue             if key != key.lower():                 raise TypeError(f\"属性名必须小写：{key}\")         return super().__new__(mcs, name, bases, namespace)   class Good(metaclass=CheckNames):     speed = 10              # ✅  class Bad(metaclass=CheckNames):     Speed = 10              # ❌ TypeError: 属性名必须小写：Speed   > 用你自己的话说：元类的创立是一个中转站——你建立一个类时，需要经过它， > 并按它的要求被迫修改。  ## 4. 元类的实际用途  | 用途 | 说明 | | --- | --- | | 强制命名 / 结构规范 | 上面的 CheckNames，团队代码规范自动检查 | | 自动注册 | ORM、插件系统：定义类时自动登记到注册表 | | 单例模式 | 控制\"这个类只能有一个实例\" | | 自动加方法 | 给所有子类统一注入日志、序列化等方法 |  自动注册示例（最实用的一种）：  python REGISTRY = {}  class Register(type):     def __new__(mcs, name, bases, namespace):         cls = super().__new__(mcs, name, bases, namespace)         if bases:                     # 跳过基类本身             REGISTRY[name] = cls         return cls   class Base(metaclass=Register):     pass  class EmailSender(Base):     # 定义即注册     pass  print(REGISTRY)              # {'EmailSender': <class 'EmailSender'>}   ## 5. 大多数情况：别用元类，用 __init_subclass__  元类难懂、难调试。90% 的场景用下面这个更简单的钩子就够：  python class Base:     def __init_subclass__(cls, **kwargs):         super().__init_subclass__(**kwargs)         REGISTRY[cls.__name__] = cls      # 子类定义时自动执行   class EmailSender(Base):     # 定义即注册，不需要元类     pass   > 经验法则：能用 __init_subclass__ / 类装饰器解决的，就不要上元类。  ## ⚠️ 易错点速记  1. type(Dog) 是 type，不是 Dog——类也是对象 2. type() 单参数查类型；三参数才是造类 3. type() 的父类元组必须写成元组：单父类是 (object,)，末尾逗号不能省 4. 元类里 __new__ 的第一参数是 mcs（元类自己），不是 self 5. metaclass= 会影响所有子类，别在别人的继承链上乱挂 6. 先考虑 __init_subclass__ / 类装饰器，最后才考虑元类  ## 🔗 关联  - 类属性与实例属性 → 15-类属性与实例属性 - 特殊方法与哈希 → 13-特殊方法与哈希 - 原始截图 → source/2026-10-19/A.md（图 image36、手写要点 3、4、7）", "blocks": [{"type": "h", "level": 1, "text": "元类与 type", "html": "元类与 type"}, {"type": "quote", "html": "<p>一句话：<strong>一切对象都源自类，一切类都源自 <code>type<\/code><\/strong>——类本身也是对象，它的&quot;类&quot;就是 <code>type<\/code>；元类就是&quot;造类的类&quot;。<\/p>"}, {"type": "h", "level": 2, "text": "1. 一切东西都是对象", "html": "1. 一切东西都是对象"}, {"type": "quote", "html": "<p>一切对象都源自类，一切类都源自 <code>type<\/code>。<\/p>"}, {"type": "code", "lang": "python", "text": "class Dog:\n    pass\n\nd = Dog()\n\ntype(d)          # <class '__main__.Dog'>   ← 实例的类型是 Dog\ntype(Dog)        # <class 'type'>           ← 类的类型是 type！\ntype(type)       # <class 'type'>           ← type 自己也是 type"}, {"type": "quote", "html": "<p><code>type()<\/code> 一个对象时返回它的类型。所以<strong>所有 class 的类型都是 <code>type<\/code><\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "2. type() 的第二种用法：传三个参数造类", "html": "2. <code>type()<\/code> 的第二种用法：传三个参数造类"}, {"type": "p", "html": "既然 <code>type<\/code> 是创建类的元类，那能不能<strong>直接调用 <code>type<\/code> 来造一个类<\/strong>？答案是能。"}, {"type": "p", "html": "<code>type()<\/code> 还有第二种用法——传三个参数："}, {"type": "code", "lang": "python", "text": "type(类名, 父类元组, 属性字典)"}, {"type": "table", "rows": [["参数", "说明"], ["类名", "字符串，例如 <code>&#x27;Hello&#x27;<\/code>"], ["父类元组", "单父类要写成单元组：<code>(object,)<\/code>，多继承就多个"], ["属性字典", "<code>{&#x27;方法名&#x27;: 函数, &#x27;属性名&#x27;: 值}<\/code>"]]}, {"type": "h", "level": 3, "text": "等价写法对照", "html": "等价写法对照"}, {"type": "code", "lang": "python", "text": "# 写法一：class 语句（最常用）\nclass Hello:\n    def __init__(self, name):\n        self.name = name\n\n    def greet(self):\n        print(f\"Hello, {self.name}\")\n\n\n# 写法二：type() 动态造类（与上面完全等价）\ndef __init__(self, name):\n    self.name = name\n\ndef greet(self):\n    print(f\"Hello, {self.name}\")\n\nHello2 = type(\"Hello2\", (object,), {\n    \"__init__\": __init__,\n    \"greet\": greet,\n    \"version\": 1,          # 类属性也一起放进来\n})\n\nh = Hello2(\"小明\")\nh.greet()                  # Hello, 小明"}, {"type": "quote", "html": "<p>注意：<code>type()<\/code> 的第三个参数<strong>就是类属性的字典<\/strong>——所以你笔记里写的<\/p><p>「写在 <code>type()<\/code> 的字典里，或直接写在 <code>class<\/code> 下的：是类属性」说的就是同一件事。<\/p>"}, {"type": "h", "level": 2, "text": "3. 什么是元类", "html": "3. 什么是元类"}, {"type": "p", "html": "<strong>元类 = 创建类的类<\/strong>。<code>class<\/code> 语句在底层其实是一次元类调用："}, {"type": "code", "lang": "python", "text": "class Dog:                 # 大致相当于：\n    pass                   # Dog = type(\"Dog\", (object,), {})"}, {"type": "p", "html": "自定义元类，就是<strong>继承 <code>type<\/code><\/strong>、在&quot;造类&quot;时插一脚："}, {"type": "code", "lang": "python", "text": "class CheckNames(type):\n    def __new__(mcs, name, bases, namespace):\n        # 造类之前可以做检查：所有属性名必须小写\n        for key in namespace:\n            if key.startswith(\"__\"):\n                continue\n            if key != key.lower():\n                raise TypeError(f\"属性名必须小写：{key}\")\n        return super().__new__(mcs, name, bases, namespace)\n\n\nclass Good(metaclass=CheckNames):\n    speed = 10              # ✅\n\nclass Bad(metaclass=CheckNames):\n    Speed = 10              # ❌ TypeError: 属性名必须小写：Speed"}, {"type": "quote", "html": "<p>用你自己的话说：<strong>元类的创立是一个中转站<\/strong>——你建立一个类时，需要经过它，<\/p><p>并按它的要求被迫修改。<\/p>"}, {"type": "h", "level": 2, "text": "4. 元类的实际用途", "html": "4. 元类的实际用途"}, {"type": "table", "rows": [["用途", "说明"], ["强制命名 / 结构规范", "上面的 <code>CheckNames<\/code>，团队代码规范自动检查"], ["自动注册", "ORM、插件系统：定义类时自动登记到注册表"], ["单例模式", "控制&quot;这个类只能有一个实例&quot;"], ["自动加方法", "给所有子类统一注入日志、序列化等方法"]]}, {"type": "p", "html": "<strong>自动注册<\/strong>示例（最实用的一种）："}, {"type": "code", "lang": "python", "text": "REGISTRY = {}\n\nclass Register(type):\n    def __new__(mcs, name, bases, namespace):\n        cls = super().__new__(mcs, name, bases, namespace)\n        if bases:                     # 跳过基类本身\n            REGISTRY[name] = cls\n        return cls\n\n\nclass Base(metaclass=Register):\n    pass\n\nclass EmailSender(Base):     # 定义即注册\n    pass\n\nprint(REGISTRY)              # {'EmailSender': <class 'EmailSender'>}"}, {"type": "h", "level": 2, "text": "5. 大多数情况：别用元类，用 __init_subclass__", "html": "5. 大多数情况：别用元类，用 <code>__init_subclass__<\/code>"}, {"type": "p", "html": "元类难懂、难调试。<strong>90% 的场景<\/strong>用下面这个更简单的钩子就够："}, {"type": "code", "lang": "python", "text": "class Base:\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        REGISTRY[cls.__name__] = cls      # 子类定义时自动执行\n\n\nclass EmailSender(Base):     # 定义即注册，不需要元类\n    pass"}, {"type": "quote", "html": "<p><strong>经验法则<\/strong>：能用 <code>__init_subclass__<\/code> / 类装饰器解决的，就不要上元类。<\/p>"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<code>type(Dog)<\/code> 是 <code>type<\/code>，不是 <code>Dog<\/code>——<strong>类也是对象<\/strong>", "<code>type()<\/code> 单参数查类型；<strong>三参数才是造类<\/strong>", "<code>type()<\/code> 的父类元组必须写成元组：单父类是 <code>(object,)<\/code>，<strong>末尾逗号不能省<\/strong>", "元类里 <code>__new__<\/code> 的第一参数是 <code>mcs<\/code>（元类自己），不是 <code>self<\/code>", "<code>metaclass=<\/code> 会影响<strong>所有子类<\/strong>，别在别人的继承链上乱挂", "先考虑 <code>__init_subclass__<\/code> / 类装饰器，最后才考虑元类"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["类属性与实例属性 → <a href=\"#topic-15\" data-go=\"topic-15\">15-类属性与实例属性<\/a>", "特殊方法与哈希 → <a href=\"#topic-13\" data-go=\"topic-13\">13-特殊方法与哈希<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-19/A.md\">source/2026-10-19/A.md<\/span>（图 image36、手写要点 3、4、7）"]}]}, {"id": "topic-17", "title": "线程与进程", "chapter": "第 5 章 进阶", "keywords": ["线程", "进程", "threading", "Thread", "multiprocessing", "GIL", "Lock", "RLock", "Condition", "Queue", "Event", "ThreadPoolExecutor", "并发", "并行"], "search": "--- title: 线程与进程 category: 进阶 keywords: [线程, 进程, threading, Thread, multiprocessing, GIL, Lock, RLock, Condition, Queue, Event, ThreadPoolExecutor, 并发, 并行] dates: [2026-10-19] ---  # 线程与进程  > 一句话：IO 密集用线程（或异步），CPU 密集用多进程——因为 CPython 有 GIL，多线程并不能让纯计算变快。  ## 1. 先分清：进程 vs 线程  | | 进程（Process） | 线程（Thread） | | --- | --- | --- | | 是什么 | 一个独立运行的程序实例 | 进程里的执行单元 | | 内存 | 各自独立，互不共享 | 共享同一进程内存 | | 开销 | 创建/切换贵 | 轻量、快 | | 通信 | 要队列/管道/共享内存 | 直接读写同一变量（但要加锁） | | 受 GIL 限制 | ❌ 不受 | ✅ 受 |  > GIL（全局解释器锁）：CPython 里同一时刻只允许一个线程执行 Python 字节码。 > 所以多线程不能让纯计算变快，只能让\"等 IO\"的时间重叠起来。  ## 2. 创建线程：threading.Thread  python import threading import time   def worker(name, count=1):     for i in range(count):         print(f\"{name}: {i}\")         time.sleep(0.5)   if __name__ == \"__main__\":     # args：以元组的方式给执行任务传递参数     t1 = threading.Thread(target=worker, args=(\"A\", 3), name=\"线程A\")     # kwargs：以字典方式给执行任务传递参数     t2 = threading.Thread(target=worker, kwargs={\"name\": \"B\", \"count\": 2}, name=\"线程B\")      t1.start()          # 启动（真正开始跑）     t2.start()     t1.join()           # 等 t1 结束     t2.join()     print(\"全部完成\")   参数速查  | 参数 | 说明 | | --- | --- | | target | 要执行的函数（不要加括号，是函数对象） | | args | 位置参数元组，单元素要写 (3,)，末尾逗号不能省 | | kwargs | 关键字参数字典，如 {\"count\": 2} | | name | 线程名（调试/日志用） | | daemon | True = 主线程结束就跟着被杀（后台线程） |  > ⚠️ target=worker() 会在创建时就执行，并把返回值当 target → 错。 > 正确写法是 target=worker。  ## 3. start / join / daemon  python t = threading.Thread(target=worker, daemon=True) t.start() # 主线程结束时，daemon 线程会被直接杀掉，不会等它跑完   python t.start() t.join(timeout=2)      # 最多等 2 秒；超时就不等了   ## 4. 线程安全：Lock  多个线程同时修改同一个变量会出问题（counter += 1 不是原子操作）：  python import threading  lock = threading.Lock() counter = 0   def add():     global counter     for _ in range(100_000):         with lock:          # 加锁，保护临界区             counter += 1   ts = [threading.Thread(target=add) for _ in range(4)] for t in ts: t.start() for t in ts: t.join() print(counter)              # 400000（不加锁通常小于这个数）   - Lock：普通锁，不可重入（同一线程重复 acquire 会死锁） - RLock：可重入锁，同一线程可以多次 acquire - with lock: 是标准写法（自动释放）  ## 5. Condition：等一个条件成立（生产者/消费者）  Condition = 锁 + 等待/通知机制。典型用途：没有数据就等，有数据就唤醒。  python import threading import time  cond = threading.Condition() items = []   def producer():     for i in range(5):         with cond:             items.append(i)             print(f\"生产 {i}，当前队列 {items}\")             cond.notify()           # 唤醒一个正在 wait 的线程         time.sleep(0.3)   def consumer():     for _ in range(5):         with cond:             while not items:        # 必须用 while，不能用 if（防虚假唤醒）                 cond.wait()         # 等待时会【自动释放锁】，被唤醒后重新拿锁             item = items.pop(0)             print(f\"消费 {item}\")   t1 = threading.Thread(target=producer) t2 = threading.Thread(target=consumer) t1.start(); t2.start() t1.join(); t2.join()   关键点  | 方法 | 作用 | | --- | --- | | cond.wait() | 释放锁并阻塞，直到被 notify 唤醒（醒来后重新拿锁） | | cond.notify() | 唤醒一个等待者 | | cond.notify_all() | 唤醒所有等待者 | | 用 with cond: | 进出自动 加锁/解锁 |  > ⚠️ 判断条件必须用 while 而不是 if——被唤醒后条件可能又被别的线程改回去了。  ## 6. Queue：最省心的线程间通信  不要自己用 list + 锁，直接用 queue.Queue（本身线程安全）：  python import queue import threading  q = queue.Queue(maxsize=10)     # 有界队列，满了 put 会阻塞   def producer():     for i in range(5):         q.put(i)   def consumer():     while True:         item = q.get()         print(\"处理\", item)         q.task_done()           # 告诉队列这项处理完了   t1 = threading.Thread(target=producer) t2 = threading.Thread(target=consumer, daemon=True) t1.start(); t2.start() q.join()                        # 等所有任务被 task_done   三种队列：Queue（FIFO）、LifoQueue（栈）、PriorityQueue（优先级）。  ## 7. 实战最常用：线程池 ThreadPoolExecutor  不用手动建线程，交给池子（爬虫、批量请求、批量文件处理都用它）：  python from concurrent.futures import ThreadPoolExecutor  def fetch(url):     # 模拟网络请求     return f\"{url} 的结果\"  urls = [f\"https://example.com/{i}\" for i in range(10)]  with ThreadPoolExecutor(max_workers=8) as pool:     results = list(pool.map(fetch, urls))     # 顺序与 urls 一致  print(results)   也可以用 submit + as_completed（谁先完成先处理）：  python from concurrent.futures import as_comp", "blocks": [{"type": "h", "level": 1, "text": "线程与进程", "html": "线程与进程"}, {"type": "quote", "html": "<p>一句话：<strong>IO 密集用线程（或异步），CPU 密集用多进程<\/strong>——因为 CPython 有 GIL，多线程并不能让纯计算变快。<\/p>"}, {"type": "h", "level": 2, "text": "1. 先分清：进程 vs 线程", "html": "1. 先分清：进程 vs 线程"}, {"type": "table", "rows": [["", "进程（Process）", "线程（Thread）"], ["是什么", "一个独立运行的程序实例", "进程里的执行单元"], ["内存", "各自独立，互不共享", "<strong>共享<\/strong>同一进程内存"], ["开销", "创建/切换贵", "轻量、快"], ["通信", "要队列/管道/共享内存", "直接读写同一变量（<strong>但要加锁<\/strong>）"], ["受 GIL 限制", "❌ 不受", "✅ 受"]]}, {"type": "quote", "html": "<p><strong>GIL（全局解释器锁）<\/strong>：CPython 里同一时刻只允许一个线程执行 Python 字节码。<\/p><p>所以多线程<strong>不能让纯计算变快<\/strong>，只能让&quot;等 IO&quot;的时间重叠起来。<\/p>"}, {"type": "h", "level": 2, "text": "2. 创建线程：threading.Thread", "html": "2. 创建线程：<code>threading.Thread<\/code>"}, {"type": "code", "lang": "python", "text": "import threading\nimport time\n\n\ndef worker(name, count=1):\n    for i in range(count):\n        print(f\"{name}: {i}\")\n        time.sleep(0.5)\n\n\nif __name__ == \"__main__\":\n    # args：以元组的方式给执行任务传递参数\n    t1 = threading.Thread(target=worker, args=(\"A\", 3), name=\"线程A\")\n    # kwargs：以字典方式给执行任务传递参数\n    t2 = threading.Thread(target=worker, kwargs={\"name\": \"B\", \"count\": 2}, name=\"线程B\")\n\n    t1.start()          # 启动（真正开始跑）\n    t2.start()\n    t1.join()           # 等 t1 结束\n    t2.join()\n    print(\"全部完成\")"}, {"type": "p", "html": "<strong>参数速查<\/strong>"}, {"type": "table", "rows": [["参数", "说明"], ["<code>target<\/code>", "要执行的函数（<strong>不要加括号<\/strong>，是函数对象）"], ["<code>args<\/code>", "位置参数元组，单元素要写 <code>(3,)<\/code>，<strong>末尾逗号不能省<\/strong>"], ["<code>kwargs<\/code>", "关键字参数字典，如 <code>{&quot;count&quot;: 2}<\/code>"], ["<code>name<\/code>", "线程名（调试/日志用）"], ["<code>daemon<\/code>", "<code>True<\/code> = 主线程结束就跟着被杀（后台线程）"]]}, {"type": "quote", "html": "<p>⚠️ <code>target=worker()<\/code> 会在创建时就执行，并把<strong>返回值<\/strong>当 target → 错。<\/p><p>正确写法是 <code>target=worker<\/code>。<\/p>"}, {"type": "h", "level": 2, "text": "3. start / join / daemon", "html": "3. <code>start<\/code> / <code>join<\/code> / <code>daemon<\/code>"}, {"type": "code", "lang": "python", "text": "t = threading.Thread(target=worker, daemon=True)\nt.start()\n# 主线程结束时，daemon 线程会被直接杀掉，不会等它跑完"}, {"type": "code", "lang": "python", "text": "t.start()\nt.join(timeout=2)      # 最多等 2 秒；超时就不等了"}, {"type": "h", "level": 2, "text": "4. 线程安全：Lock", "html": "4. 线程安全：<code>Lock<\/code>"}, {"type": "p", "html": "多个线程<strong>同时修改<\/strong>同一个变量会出问题（<code>counter += 1<\/code> 不是原子操作）："}, {"type": "code", "lang": "python", "text": "import threading\n\nlock = threading.Lock()\ncounter = 0\n\n\ndef add():\n    global counter\n    for _ in range(100_000):\n        with lock:          # 加锁，保护临界区\n            counter += 1\n\n\nts = [threading.Thread(target=add) for _ in range(4)]\nfor t in ts: t.start()\nfor t in ts: t.join()\nprint(counter)              # 400000（不加锁通常小于这个数）"}, {"type": "ul", "items": ["<code>Lock<\/code>：普通锁，<strong>不可重入<\/strong>（同一线程重复 acquire 会死锁）", "<code>RLock<\/code>：可重入锁，同一线程可以多次 acquire", "<code>with lock:<\/code> 是标准写法（自动释放）"]}, {"type": "h", "level": 2, "text": "5. Condition：等一个条件成立（生产者/消费者）", "html": "5. <code>Condition<\/code>：等一个条件成立（生产者/消费者）"}, {"type": "p", "html": "<code>Condition<\/code> = 锁 + 等待/通知机制。典型用途：<strong>没有数据就等，有数据就唤醒<\/strong>。"}, {"type": "code", "lang": "python", "text": "import threading\nimport time\n\ncond = threading.Condition()\nitems = []\n\n\ndef producer():\n    for i in range(5):\n        with cond:\n            items.append(i)\n            print(f\"生产 {i}，当前队列 {items}\")\n            cond.notify()           # 唤醒一个正在 wait 的线程\n        time.sleep(0.3)\n\n\ndef consumer():\n    for _ in range(5):\n        with cond:\n            while not items:        # 必须用 while，不能用 if（防虚假唤醒）\n                cond.wait()         # 等待时会【自动释放锁】，被唤醒后重新拿锁\n            item = items.pop(0)\n            print(f\"消费 {item}\")\n\n\nt1 = threading.Thread(target=producer)\nt2 = threading.Thread(target=consumer)\nt1.start(); t2.start()\nt1.join(); t2.join()"}, {"type": "p", "html": "<strong>关键点<\/strong>"}, {"type": "table", "rows": [["方法", "作用"], ["<code>cond.wait()<\/code>", "释放锁并阻塞，直到被 <code>notify<\/code> 唤醒（醒来后重新拿锁）"], ["<code>cond.notify()<\/code>", "唤醒<strong>一个<\/strong>等待者"], ["<code>cond.notify_all()<\/code>", "唤醒<strong>所有<\/strong>等待者"], ["用 <code>with cond:<\/code>", "进出自动 加锁/解锁"]]}, {"type": "quote", "html": "<p>⚠️ 判断条件必须用 <code>while<\/code> 而不是 <code>if<\/code>——被唤醒后条件可能又被别的线程改回去了。<\/p>"}, {"type": "h", "level": 2, "text": "6. Queue：最省心的线程间通信", "html": "6. <code>Queue<\/code>：最省心的线程间通信"}, {"type": "p", "html": "不要自己用 list + 锁，直接用 <code>queue.Queue<\/code>（<strong>本身线程安全<\/strong>）："}, {"type": "code", "lang": "python", "text": "import queue\nimport threading\n\nq = queue.Queue(maxsize=10)     # 有界队列，满了 put 会阻塞\n\n\ndef producer():\n    for i in range(5):\n        q.put(i)\n\n\ndef consumer():\n    while True:\n        item = q.get()\n        print(\"处理\", item)\n        q.task_done()           # 告诉队列这项处理完了\n\n\nt1 = threading.Thread(target=producer)\nt2 = threading.Thread(target=consumer, daemon=True)\nt1.start(); t2.start()\nq.join()                        # 等所有任务被 task_done"}, {"type": "p", "html": "三种队列：<code>Queue<\/code>（FIFO）、<code>LifoQueue<\/code>（栈）、<code>PriorityQueue<\/code>（优先级）。"}, {"type": "h", "level": 2, "text": "7. 实战最常用：线程池 ThreadPoolExecutor", "html": "7. 实战最常用：线程池 <code>ThreadPoolExecutor<\/code>"}, {"type": "p", "html": "<strong>不用手动建线程<\/strong>，交给池子（爬虫、批量请求、批量文件处理都用它）："}, {"type": "code", "lang": "python", "text": "from concurrent.futures import ThreadPoolExecutor\n\ndef fetch(url):\n    # 模拟网络请求\n    return f\"{url} 的结果\"\n\nurls = [f\"https://example.com/{i}\" for i in range(10)]\n\nwith ThreadPoolExecutor(max_workers=8) as pool:\n    results = list(pool.map(fetch, urls))     # 顺序与 urls 一致\n\nprint(results)"}, {"type": "p", "html": "也可以用 <code>submit<\/code> + <code>as_completed<\/code>（谁先完成先处理）："}, {"type": "code", "lang": "python", "text": "from concurrent.futures import as_completed\n\nwith ThreadPoolExecutor(max_workers=8) as pool:\n    futures = [pool.submit(fetch, u) for u in urls]\n    for f in as_completed(futures):\n        print(f.result())"}, {"type": "h", "level": 2, "text": "8. 多进程：绕开 GIL 跑满 CPU", "html": "8. 多进程：绕开 GIL 跑满 CPU"}, {"type": "code", "lang": "python", "text": "from multiprocessing import Pool\n\n\ndef cpu_heavy(n):\n    return sum(i * i for i in range(n))\n\n\nif __name__ == \"__main__\":       # Windows 上必须放在 __main__ 里！\n    with Pool() as p:\n        print(p.map(cpu_heavy, [10**6] * 4))"}, {"type": "quote", "html": "<p>⚠️ Windows 用的是 <code>spawn<\/code> 方式，<strong>多进程代码必须写在 <code>if __name__ == &quot;__main__&quot;:<\/code> 下面<\/strong>，否则会无限递归。<\/p>"}, {"type": "h", "level": 2, "text": "9. threading.Event：线程间发信号（优雅退出）", "html": "9. <code>threading.Event<\/code>：线程间发信号（优雅退出）"}, {"type": "p", "html": "线程<strong>不能强制 kill<\/strong>，用 Event 通知它自己退出："}, {"type": "code", "lang": "python", "text": "import threading, time\n\nstop_event = threading.Event()\n\n\ndef loop_task():\n    while not stop_event.is_set():\n        print(\"工作中...\")\n        time.sleep(0.5)\n    print(\"收到停止信号，退出\")\n\n\nt = threading.Thread(target=loop_task)\nt.start()\ntime.sleep(2)\nstop_event.set()          # 发信号\nt.join()"}, {"type": "h", "level": 2, "text": "10. 怎么选：一张决策表", "html": "10. 怎么选：一张决策表"}, {"type": "table", "rows": [["场景", "选什么", "原因"], ["网络请求、读写文件、数据库（<strong>IO 密集<\/strong>）", "多线程 / 线程池 / asyncio", "等 IO 时切换，能重叠等待"], ["大量数学计算、图像处理（<strong>CPU 密集<\/strong>）", "多进程", "绕开 GIL，真正并行"], ["需要共享大量数据、逻辑简单", "多线程 + Lock/Queue", "共享内存方便"], ["任务数量固定、要拿结果", "<code>ThreadPoolExecutor<\/code> / <code>Pool<\/code>", "池化，省去手写线程管理"], ["超多并发连接（几千）", "<code>asyncio<\/code>", "协程比线程轻得多"]]}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<code>target=worker()<\/code> 错！<strong>不加括号<\/strong>，传函数对象", "<code>args=(3,)<\/code> 单元素元组，<strong>逗号不能省<\/strong>，否则是整数", "共享变量 += 要加 <code>Lock<\/code>，否则结果偏小", "<code>Condition.wait()<\/code> 外面必须用 <strong><code>while<\/code><\/strong> 判断条件，不能用 <code>if<\/code>", "Windows 多进程代码必须放在 <code>if __name__ == &quot;__main__&quot;:<\/code> 下", "线程不能强杀，用 <code>Event<\/code> 通知退出", "线程间通信优先用 <code>queue.Queue<\/code>，别自己拿 list 加锁", "纯计算任务用多线程<strong>不会变快<\/strong>（GIL），要用多进程"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["生成器 / 迭代（流式处理大文件）→ <a href=\"#topic-08\" data-go=\"topic-08\">08-生成器<\/a>", "异常处理（线程里的异常不会自动冒到主线程）→ 待建专题", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-19/A.md\">source/2026-10-19/A.md<\/span>（图 image37、手写要点 8~10）"]}]}, {"id": "topic-18", "title": "闭包", "chapter": "第 5 章 进阶", "keywords": ["闭包", "closure", "嵌套函数", "自由变量", "nonlocal", "装饰器", "带记忆的函数"], "search": "--- title: 闭包 category: 进阶 keywords: [闭包, closure, 嵌套函数, 自由变量, nonlocal, 装饰器, 带记忆的函数] dates: [2026-10-20] ---  # 闭包  > 一句话：闭包就是函数里套函数，内层函数\"记住\"了外层函数的变量——是函数的一种妙用，不是什么新知识。  ## 1. 什么是闭包  闭包要同时满足三个条件：  1. 有嵌套函数（函数里面再定义函数） 2. 内部函数引用了外层函数的变量 3. 外层函数把内部函数返回出来  python def make_counter():     count = 0                    # 外层函数的局部变量      def counter():               # 内部函数（嵌套）         nonlocal count           # 声明要修改外层的 count         count += 1         return count      return counter               # 返回内部函数本身（不加括号！）   c1 = make_counter()              # c1 就是那个内部函数 print(c1())                      # 1 print(c1())                      # 2 print(c1())                      # 3   关键：make_counter() 早就返回了，按理说 count 这个局部变量应该被销毁——但它没有被销毁，因为内部函数还\"抓\"着它。这个被记住的 count 就叫自由变量。  > 用你自己的话说：闭包其实就是一种函数的妙用——一个函数\"打包带走\"了它定义时环境里的变量。  ## 2. 闭包的作用：带记忆的函数  不同计数器实例各记各的：  python c1 = make_counter() c2 = make_counter() print(c1(), c1())      # 1 2 print(c2())            # 1   ← c2 是独立的，互不影响   用这个特性可以做：计数器、累加器、缓存、配置开关等\"有状态\"的小函数。  ## 3. nonlocal：修改外层变量必须声明  python def outer():     x = 0     def inner():         # x += 1          # ❌ 直接写会报错：引用前未定义         nonlocal x        # ✅ 先声明 x 是外层的变量         x += 1         return x     return inner   > nonlocal 声明写在内部函数里，但声明的是外层函数里定义的变量（所以它出现在内部嵌套函数\"外面\"的那个作用域）。 > 如果只是读外层变量，不用 nonlocal；只有赋值/修改才需要。  ## 4. 闭包与装饰器的关系（重点）  装饰器就是闭包的典型应用。比如一个计时装饰器 insert_time：  python import time  def insert_time(func):                  # 外层函数：接收被装饰的函数     def wrapper(*args, **kwargs):       # 内部函数（闭包）：抓住 func         start = time.time()         result = func(*args, **kwargs)         end = time.time()         print(f\"耗时 {end - start:.4f} 秒\")         return result     return wrapper                       # 返回闭包   @insert_time def test():     time.sleep(0.5)     print(\"test 运行\")   test()   理解这个执行流程（这就是你笔记里\"除了第一次调用\"那半句的意思）：  1. Python 执行到 @insert_time 时，会调用一次 insert_time(test)——这是第一次调用 2. 它返回内部的 wrapper 闭包，并用它替换掉原来的 test 3. 之后你每次 test()，其实调用的都是这个 wrapper（闭包）——所以「其余调用都是在调用 insert_time 返回的那个内部函数」  > ⚠️ 装饰器 @insert_time 写在被装饰函数定义的外面（上方）；真正\"干活\"的 wrapper 是嵌套在 insert_time 里面的函数。  ## 5. 常见坑  ### 坑 1：参数名不能重复  python def outer(x):     def inner(x):        # ❌ 内层参数 x 把外层的 x 挡住了（遮蔽）         return x     return inner   > 闭包里各个函数里的参数不能重复——内外层函数如果用了同名参数，内层会\"遮蔽\"外层，你就拿不到想抓的自由变量了。给它们取不同的名字。  ### 坑 2：返回函数忘了不加括号  python def outer():     def inner():         return 1     return inner       # ✅ 返回函数对象  # return inner() 是返回 1（int），不是闭包   ### 坑 3：循环里创建闭包的老陷阱（延迟绑定）  python funcs = [] for i in range(3):     funcs.append(lambda: i)      # 都引用同一个 i print([f() for f in funcs])      # [2, 2, 2]，不是 [0, 1, 2]   > 原因：闭包记住的是变量名，不是当时的值；循环结束后 i 已经是 2。 > 解决：用默认参数把值\"固定\"下来——lambda i=i: i。  ## ⚠️ 易错点速记  1. 闭包 = 嵌套函数 + 引用外层变量 + 外层返回内层，缺一不可 2. 读外层变量不用 nonlocal，修改才必须声明 3. return inner 不加括号；return inner() 就成普通返回了 4. 内外层函数参数名别重复，会遮蔽 5. 循环里用 lambda 造闭包，注意延迟绑定（用默认参数 i=i 固定） 6. 装饰器 = 闭包 + 函数作参数；@ 那一行只执行一次  ## 🔗 关联  - 装饰器（闭包最常用处）→ 待建专题 - 函数进阶（lambda、默认参数）→ 11-函数进阶 - 生成器（另一种\"记住状态\"的机制）→ 08-生成器 - 原始截图 → source/2026-10-20/A.md", "blocks": [{"type": "h", "level": 1, "text": "闭包", "html": "闭包"}, {"type": "quote", "html": "<p>一句话：闭包就是<strong>函数里套函数，内层函数&quot;记住&quot;了外层函数的变量<\/strong>——是函数的一种妙用，不是什么新知识。<\/p>"}, {"type": "h", "level": 2, "text": "1. 什么是闭包", "html": "1. 什么是闭包"}, {"type": "p", "html": "闭包要同时满足三个条件："}, {"type": "ol", "items": ["有<strong>嵌套函数<\/strong>（函数里面再定义函数）", "内部函数<strong>引用了外层函数的变量<\/strong>", "外层函数<strong>把内部函数返回<\/strong>出来"]}, {"type": "code", "lang": "python", "text": "def make_counter():\n    count = 0                    # 外层函数的局部变量\n\n    def counter():               # 内部函数（嵌套）\n        nonlocal count           # 声明要修改外层的 count\n        count += 1\n        return count\n\n    return counter               # 返回内部函数本身（不加括号！）\n\n\nc1 = make_counter()              # c1 就是那个内部函数\nprint(c1())                      # 1\nprint(c1())                      # 2\nprint(c1())                      # 3"}, {"type": "p", "html": "关键：<code>make_counter()<\/code> 早就返回了，按理说 <code>count<\/code> 这个局部变量应该被销毁——但它<strong>没有被销毁<\/strong>，因为内部函数还&quot;抓&quot;着它。这个被记住的 <code>count<\/code> 就叫<strong>自由变量<\/strong>。"}, {"type": "quote", "html": "<p>用你自己的话说：<strong>闭包其实就是一种函数的妙用<\/strong>——一个函数&quot;打包带走&quot;了它定义时环境里的变量。<\/p>"}, {"type": "h", "level": 2, "text": "2. 闭包的作用：带记忆的函数", "html": "2. 闭包的作用：带记忆的函数"}, {"type": "p", "html": "不同计数器实例各记各的："}, {"type": "code", "lang": "python", "text": "c1 = make_counter()\nc2 = make_counter()\nprint(c1(), c1())      # 1 2\nprint(c2())            # 1   ← c2 是独立的，互不影响"}, {"type": "p", "html": "用这个特性可以做：计数器、累加器、缓存、配置开关等&quot;有状态&quot;的小函数。"}, {"type": "h", "level": 2, "text": "3. nonlocal：修改外层变量必须声明", "html": "3. <code>nonlocal<\/code>：修改外层变量必须声明"}, {"type": "code", "lang": "python", "text": "def outer():\n    x = 0\n    def inner():\n        # x += 1          # ❌ 直接写会报错：引用前未定义\n        nonlocal x        # ✅ 先声明 x 是外层的变量\n        x += 1\n        return x\n    return inner"}, {"type": "quote", "html": "<p><code>nonlocal<\/code> 声明<strong>写在内部函数里<\/strong>，但声明的是<strong>外层函数里定义的变量<\/strong>（所以它出现在内部嵌套函数&quot;外面&quot;的那个作用域）。<\/p><p>如果只是<strong>读<\/strong>外层变量，不用 nonlocal；只有<strong>赋值/修改<\/strong>才需要。<\/p>"}, {"type": "h", "level": 2, "text": "4. 闭包与装饰器的关系（重点）", "html": "4. 闭包与装饰器的关系（重点）"}, {"type": "p", "html": "<strong>装饰器就是闭包的典型应用<\/strong>。比如一个计时装饰器 <code>insert_time<\/code>："}, {"type": "code", "lang": "python", "text": "import time\n\ndef insert_time(func):                  # 外层函数：接收被装饰的函数\n    def wrapper(*args, **kwargs):       # 内部函数（闭包）：抓住 func\n        start = time.time()\n        result = func(*args, **kwargs)\n        end = time.time()\n        print(f\"耗时 {end - start:.4f} 秒\")\n        return result\n    return wrapper                       # 返回闭包\n\n\n@insert_time\ndef test():\n    time.sleep(0.5)\n    print(\"test 运行\")\n\n\ntest()"}, {"type": "p", "html": "理解这个执行流程（这就是你笔记里&quot;除了第一次调用&quot;那半句的意思）："}, {"type": "ol", "items": ["Python 执行到 <code>@insert_time<\/code> 时，会<strong>调用一次<\/strong> <code>insert_time(test)<\/code>——这是<strong>第一次调用<\/strong>", "它返回内部的 <code>wrapper<\/code> 闭包，并用它<strong>替换<\/strong>掉原来的 <code>test<\/code>", "之后你每次 <code>test()<\/code>，其实调用的都是这个 <code>wrapper<\/code>（闭包）——所以「<strong>其余调用都是在调用 insert_time 返回的那个内部函数<\/strong>」"]}, {"type": "quote", "html": "<p>⚠️ 装饰器 <code>@insert_time<\/code> 写在被装饰函数定义的<strong>外面（上方）<\/strong>；真正&quot;干活&quot;的 <code>wrapper<\/code> 是嵌套在 <code>insert_time<\/code> <strong>里面<\/strong>的函数。<\/p>"}, {"type": "h", "level": 2, "text": "5. 常见坑", "html": "5. 常见坑"}, {"type": "h", "level": 3, "text": "坑 1：参数名不能重复", "html": "坑 1：参数名不能重复"}, {"type": "code", "lang": "python", "text": "def outer(x):\n    def inner(x):        # ❌ 内层参数 x 把外层的 x 挡住了（遮蔽）\n        return x\n    return inner"}, {"type": "quote", "html": "<p>闭包里<strong>各个函数里的参数不能重复<\/strong>——内外层函数如果用了同名参数，内层会&quot;遮蔽&quot;外层，你就拿不到想抓的自由变量了。给它们取不同的名字。<\/p>"}, {"type": "h", "level": 3, "text": "坑 2：返回函数忘了不加括号", "html": "坑 2：返回函数忘了不加括号"}, {"type": "code", "lang": "python", "text": "def outer():\n    def inner():\n        return 1\n    return inner       # ✅ 返回函数对象\n\n# return inner() 是返回 1（int），不是闭包"}, {"type": "h", "level": 3, "text": "坑 3：循环里创建闭包的老陷阱（延迟绑定）", "html": "坑 3：循环里创建闭包的老陷阱（延迟绑定）"}, {"type": "code", "lang": "python", "text": "funcs = []\nfor i in range(3):\n    funcs.append(lambda: i)      # 都引用同一个 i\nprint([f() for f in funcs])      # [2, 2, 2]，不是 [0, 1, 2]"}, {"type": "quote", "html": "<p>原因：闭包记住的是<strong>变量名<\/strong>，不是当时的值；循环结束后 <code>i<\/code> 已经是 2。<\/p><p>解决：用默认参数把值&quot;固定&quot;下来——<code>lambda i=i: i<\/code>。<\/p>"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["闭包 = 嵌套函数 + 引用外层变量 + 外层返回内层，缺一不可", "读外层变量不用 <code>nonlocal<\/code>，<strong>修改<\/strong>才必须声明", "<code>return inner<\/code> 不加括号；<code>return inner()<\/code> 就成普通返回了", "内外层函数<strong>参数名别重复<\/strong>，会遮蔽", "循环里用 lambda 造闭包，注意延迟绑定（用默认参数 <code>i=i<\/code> 固定）", "装饰器 = 闭包 + 函数作参数；<code>@<\/code> 那一行只执行一次"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["装饰器（闭包最常用处）→ 待建专题", "函数进阶（lambda、默认参数）→ <a href=\"#topic-11\" data-go=\"topic-11\">11-函数进阶<\/a>", "生成器（另一种&quot;记住状态&quot;的机制）→ <a href=\"#topic-08\" data-go=\"topic-08\">08-生成器<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-20/A.md\">source/2026-10-20/A.md<\/span>"]}]}, {"id": "topic-19", "title": "推导式", "chapter": "第 5 章 进阶", "keywords": ["推导式", "列表推导式", "字典推导式", "集合推导式", "comprehension", "if 过滤", "表达式"], "search": "--- title: 推导式 category: 进阶 keywords: [推导式, 列表推导式, 字典推导式, 集合推导式, comprehension, if 过滤, 表达式] dates: [2026-10-21] ---  # 推导式  > 一句话：一行代码把一个序列变成另一个序列——[表达式 for 变量 in 可迭代对象 if 条件]。  ## 1. 通用结构  python [表达式 for 变量 in 可迭代对象 if 条件]   三段分别是什么意思：  | 部分 | 含义 | | --- | --- | | 表达式 | 每个元素被收集前要做什么变换（不变换就直接写变量名） | | for … in | 遍历哪个序列 | | if | 可选过滤条件，不需要就省略 |  ## 2. 列表推导式  python # 普通写法 squares = [] for x in range(5):     squares.append(x * x)  # 推导式写法 squares = [x * x for x in range(5)] print(squares)          # [0, 1, 4, 9, 16]   带过滤条件：  python evens = [x for x in range(10) if x % 2 == 0] print(evens)            # [0, 2, 4, 6, 8]   带变换 + 过滤：  python # 取所有偶数，并各自平方 result = [x * x for x in range(10) if x % 2 == 0] print(result)           # [0, 4, 16, 36, 64]   ## 3. 字典推导式  > 结构：{键: 值 for 变量 in 可迭代对象}  python prices = {'apple': 5, 'banana': 3, 'cherry': 10}  # 所有价格翻倍 doubled = {k: v * 2 for k, v in prices.items()} print(doubled)          # {'apple': 10, 'banana': 6, 'cherry': 20}   带条件：  python expensive = {k: v for k, v in prices.items() if v > 4} print(expensive)        # {'apple': 5, 'cherry': 10}   键值互换（值不重复时）：  python flipped = {v: k for k, v in prices.items()}   > ⚠️ 字典推导式必须写 键: 值，只写一个值会变成集合推导式。  ## 4. 集合推导式  python words = ['apple', 'banana', 'apple', 'cherry'] initials = {w[0] for w in words}       # 自动去重 print(initials)      # {'a', 'b', 'c'}   ## 5. 生成器表达式（圆括号）  把 [] 换成 () 就是生成器——边算边给，不占内存：  python gen = (x * x for x in range(1000000))   # 立刻返回，不计算 print(next(gen))                         # 0  total = sum(x * x for x in range(100))   # 常用于 sum/max/min 等聚合   详见 08-生成器。  ## 6. 什么时候别用推导式  推导式只适合\"一行能说清\"的场景。如果逻辑超过一层，写成 for 循环更可读：  python # ❌ 能写但难读 result = [f(x) if x > 0 else g(x) for x in data if x is not None and check(x)]  # ✅ 清楚得多 result = [] for x in data:     if x is not None and check(x):         result.append(f(x) if x > 0 else g(x))   ## ⚠️ 易错点速记  1. 推导式里的 if 是过滤（决定要不要这个元素），不是 if/else 分支 2. 字典推导式漏写 键: 会变成集合推导式 3. 推导式里的变量不会泄漏到外面（Python 3） 4. 嵌套层数超过 2 层就别用推导式了，可读性掉太厉害 5. () 是生成器表达式，不是元组推导式（根本不存在元组推导式） 6. 推导式里别调用有副作用的函数（如 print/append），那不是它的用途  ## 🔗 关联  - 生成器表达式 → 08-生成器 - 字典解包 .items() → 04-字典 - 迭代器 → 12-迭代器与enumerate - 原始截图 → source/2026-10-21/A.md（图 image56、image57）", "blocks": [{"type": "h", "level": 1, "text": "推导式", "html": "推导式"}, {"type": "quote", "html": "<p>一句话：<strong>一行代码把一个序列变成另一个序列<\/strong>——<code>[表达式 for 变量 in 可迭代对象 if 条件]<\/code>。<\/p>"}, {"type": "h", "level": 2, "text": "1. 通用结构", "html": "1. 通用结构"}, {"type": "code", "lang": "python", "text": "[表达式 for 变量 in 可迭代对象 if 条件]"}, {"type": "p", "html": "三段分别是什么意思："}, {"type": "table", "rows": [["部分", "含义"], ["<strong>表达式<\/strong>", "每个元素被收集前要做什么变换（不变换就直接写变量名）"], ["<strong>for … in<\/strong>", "遍历哪个序列"], ["<strong>if<\/strong>", "可选过滤条件，不需要就省略"]]}, {"type": "h", "level": 2, "text": "2. 列表推导式", "html": "2. 列表推导式"}, {"type": "code", "lang": "python", "text": "# 普通写法\nsquares = []\nfor x in range(5):\n    squares.append(x * x)\n\n# 推导式写法\nsquares = [x * x for x in range(5)]\nprint(squares)          # [0, 1, 4, 9, 16]"}, {"type": "p", "html": "<strong>带过滤条件<\/strong>："}, {"type": "code", "lang": "python", "text": "evens = [x for x in range(10) if x % 2 == 0]\nprint(evens)            # [0, 2, 4, 6, 8]"}, {"type": "p", "html": "<strong>带变换 + 过滤<\/strong>："}, {"type": "code", "lang": "python", "text": "# 取所有偶数，并各自平方\nresult = [x * x for x in range(10) if x % 2 == 0]\nprint(result)           # [0, 4, 16, 36, 64]"}, {"type": "h", "level": 2, "text": "3. 字典推导式", "html": "3. 字典推导式"}, {"type": "quote", "html": "<p>结构：<code>{键: 值 for 变量 in 可迭代对象}<\/code><\/p>"}, {"type": "code", "lang": "python", "text": "prices = {'apple': 5, 'banana': 3, 'cherry': 10}\n\n# 所有价格翻倍\ndoubled = {k: v * 2 for k, v in prices.items()}\nprint(doubled)          # {'apple': 10, 'banana': 6, 'cherry': 20}"}, {"type": "p", "html": "<strong>带条件<\/strong>："}, {"type": "code", "lang": "python", "text": "expensive = {k: v for k, v in prices.items() if v > 4}\nprint(expensive)        # {'apple': 5, 'cherry': 10}"}, {"type": "p", "html": "<strong>键值互换<\/strong>（值不重复时）："}, {"type": "code", "lang": "python", "text": "flipped = {v: k for k, v in prices.items()}"}, {"type": "quote", "html": "<p>⚠️ 字典推导式必须写 <code>键: 值<\/code>，只写一个值会变成<strong>集合推导式<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "4. 集合推导式", "html": "4. 集合推导式"}, {"type": "code", "lang": "python", "text": "words = ['apple', 'banana', 'apple', 'cherry']\ninitials = {w[0] for w in words}       # 自动去重\nprint(initials)      # {'a', 'b', 'c'}"}, {"type": "h", "level": 2, "text": "5. 生成器表达式（圆括号）", "html": "5. 生成器表达式（圆括号）"}, {"type": "p", "html": "把 <code>[]<\/code> 换成 <code>()<\/code> 就是生成器——<strong>边算边给，不占内存<\/strong>："}, {"type": "code", "lang": "python", "text": "gen = (x * x for x in range(1000000))   # 立刻返回，不计算\nprint(next(gen))                         # 0\n\ntotal = sum(x * x for x in range(100))   # 常用于 sum/max/min 等聚合"}, {"type": "p", "html": "详见 <a href=\"#topic-08\" data-go=\"topic-08\">08-生成器<\/a>。"}, {"type": "h", "level": 2, "text": "6. 什么时候别用推导式", "html": "6. 什么时候别用推导式"}, {"type": "p", "html": "<strong>推导式只适合&quot;一行能说清&quot;的场景<\/strong>。如果逻辑超过一层，写成 for 循环更可读："}, {"type": "code", "lang": "python", "text": "# ❌ 能写但难读\nresult = [f(x) if x > 0 else g(x) for x in data if x is not None and check(x)]\n\n# ✅ 清楚得多\nresult = []\nfor x in data:\n    if x is not None and check(x):\n        result.append(f(x) if x > 0 else g(x))"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["推导式里的 <code>if<\/code> 是<strong>过滤<\/strong>（决定要不要这个元素），不是 if/else 分支", "字典推导式漏写 <code>键:<\/code> 会变成集合推导式", "推导式里的变量<strong>不会泄漏<\/strong>到外面（Python 3）", "嵌套层数超过 2 层就别用推导式了，可读性掉太厉害", "<code>()<\/code> 是生成器表达式，不是元组推导式（根本不存在元组推导式）", "推导式里别调用有副作用的函数（如 print/append），那不是它的用途"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["生成器表达式 → <a href=\"#topic-08\" data-go=\"topic-08\">08-生成器<\/a>", "字典解包 <code>.items()<\/code> → <a href=\"#topic-04\" data-go=\"topic-04\">04-字典<\/a>", "迭代器 → <a href=\"#topic-12\" data-go=\"topic-12\">12-迭代器与enumerate<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-21/A.md\">source/2026-10-21/A.md<\/span>（图 image56、image57）"]}]}, {"id": "topic-23", "title": "dataclass", "chapter": "第 5 章 进阶", "keywords": ["dataclass", "类", "字段声明", "frozen", "field", "init=False", "__post_init__", "校验", "不可变"], "search": "--- title: dataclass category: 进阶 keywords: [dataclass, 类, 字段声明, frozen, field, init=False, __post_init__, 校验, 不可变] dates: [2026-10-22] ---  # dataclass  > 一句话：@dataclass 自动帮你生成 __init__ / __repr__ / __eq__，写一个只有字段的类时几乎是必用。  ## 1. 最基础的用法  python from dataclasses import dataclass   @dataclass class Point:     x: int     y: int   p = Point(1, 2) print(p)            # Point(x=1, y=2)   ← __repr__ 自动生成 print(p == Point(1, 2))   # True         ← __eq__ 自动生成   不用手写 __init__，字段声明完就有构造函数。  ## 2. ⚠️ 类型注解是必须的（最关键的一点）  > 在 dataclass 里，name: str 是「字段声明」，name = '默认值' 是「类属性」，两者作用截然不同。  python @dataclass class Demo:     a: int          # 这是字段，会进 __init__     b: int = 10     # 这是有默认值的字段，也会进 __init__     c = 20          # 没有类型注解 → 被当成普通类属性，不会进 __init__   d = Demo(1)          # 只能传 a、b print(d)             # Demo(a=1, b=10) print(d.c)           # 20   | 写法 | 是什么 | 进 __init__ 吗 | | --- | --- | --- | | a: int | 字段声明 | ✅ | | b: int = 10 | 有默认值的字段 | ✅ | | c = 20 | 普通类属性 | ❌ |  > 这就是为什么 20-类型注解 要先学——dataclass 靠类型注解识别字段。  ## 3. 字段默认值的坑  python @dataclass class Bad:     tags: list = []      # ❌ ValueError: mutable default   和「函数可变默认参数」是同一个坑。解决办法：  python from dataclasses import dataclass, field  @dataclass class Good:     tags: list = field(default_factory=list)      # ✅ 每次新建一个列表     scores: dict = field(default_factory=dict)   ## 4. frozen=True：创建后不可变  适合「坐标点、枚举值、配置项」这种概念上就该只读的东西。  python @dataclass(frozen=True) class Point:     x: int     y: int   p = Point(1, 2) p.x = 100          # ❌ FrozenInstanceError: cannot assign to field 'x'   > 这个保护是运行时的——就算静态检查工具没拦住，运行时也会炸。 > 附带好处：frozen=True 的对象可哈希（能放进 set / 当 dict 的 key）， > 解决了 13-特殊方法与哈希 里\"重写 __eq__ 就不可哈希\"的麻烦。  | 写法 | 能不能改 | 可哈希 | | --- | --- | --- | | @dataclass | ✅ 能改 | ❌（默认 eq=True 时不可哈希） | | @dataclass(frozen=True) | ❌ 不能改 | ✅ |  ## 5. field(init=False)：派生字段  从其他字段算出来的值，不该让用户在构造时传。  python @dataclass class Order:     price: float     count: int     total: float = field(init=False)      # 不出现在 __init__ 参数里      def __post_init__(self):         self.total = self.price * self.count   o = Order(9.9, 3)      # 只传 price 和 count print(o.total)         # 29.7   > init=False 让 total 不出现在 __init__ 的参数里——用户构造时不需要也不该传它。  ## 6. __post_init__：构造后自动调用的钩子  > __post_init__ 是 dataclass 自动调用的，名字必须就是这个，连下划线数量都不能错（前后各两个）。  两种典型用途：  ### 用途 A：派生计算（推荐）  python def __post_init__(self):     self.total = self.price * self.count   ### 用途 B：字段校验（可用，但是权宜之计）  python @dataclass class Employee:     name: str     salary: int      def __post_init__(self):         if self.salary < 0:             raise ValueError(f'工资不能是负数，收到: {self.salary}')         if not self.name:             raise ValueError('姓名不能为空')   Employee('两点水', -100)     # ❌ ValueError: 工资不能是负数，收到: -100 Employee('两点水', 12000)    # ✅ Employee(name='两点水', salary=12000)   > ⚠️ 但 __post_init__ 里写校验只是「权宜之计」。它的活儿性质偏向「派生计算」， > 校验逻辑写多了会显得别扭。生产里如果数据来自外部（HTTP 请求、JSON 配置），更推荐用 Pydantic 专门做校验。  ## 7. dataclass / 普通类 / Pydantic 怎么选  | 场景 | 选什么 | | --- | --- | | 只是装数据的容器（内部使用） | dataclass | | 需要只读、可哈希 | dataclass(frozen=True) | | 有复杂校验、数据来自外部（API/JSON） | Pydantic（BaseModel） | | 有大量业务方法、状态会变 | 普通类 |  > 顺带：Agent 开发里的工具参数、结构化输出用的就是 Pydantic，和 dataclass 思路一脉相承。  ## ⚠️ 易错点速记  1. 没有类型注解的字段不会进 __init__（会变成类属性）——最容易踩 2. 可变默认值（list/dict/set）必须用 field(default_factory=...) 3. frozen=True 只是运行时保护，改不动是真改不动，但也别指望它是\"编译期检查\" 4. field(init=False) 的字段要在 __post_init__ 里赋值，否则读它是 AttributeError 5. __post_init__ 前后各两个下划线，写错就静默不执行 6. 校验别全塞 __post_init__，外部数据用 Pydantic 7. 默认 @dataclass 不可哈希（因为自动生成了 __eq__），需要时加 frozen=True  ## 🔗 关联  - 类型注解（dataclass 的基础）→ 20-类型注解 - 类属性与实例属性 → 15-类属性与实例属性 - 特殊方法与哈希 → 13-特殊方法与哈希 - 可变默认参数（同一个坑）→ 11-函数进阶 - 原始截图 → source/2026-10-22/A.md（图 image67~image70）", "blocks": [{"type": "h", "level": 1, "text": "dataclass", "html": "dataclass"}, {"type": "quote", "html": "<p>一句话：<code>@dataclass<\/code> 自动帮你生成 <code>__init__<\/code> / <code>__repr__<\/code> / <code>__eq__<\/code>，<strong>写一个只有字段的类时几乎是必用<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "1. 最基础的用法", "html": "1. 最基础的用法"}, {"type": "code", "lang": "python", "text": "from dataclasses import dataclass\n\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n\n\np = Point(1, 2)\nprint(p)            # Point(x=1, y=2)   ← __repr__ 自动生成\nprint(p == Point(1, 2))   # True         ← __eq__ 自动生成"}, {"type": "p", "html": "不用手写 <code>__init__<\/code>，字段声明完就有构造函数。"}, {"type": "h", "level": 2, "text": "2. ⚠️ 类型注解是必须的（最关键的一点）", "html": "2. ⚠️ 类型注解是必须的（最关键的一点）"}, {"type": "quote", "html": "<p>在 <code>dataclass<\/code> 里，<strong><code>name: str<\/code> 是「字段声明」，<code>name = &#x27;默认值&#x27;<\/code> 是「类属性」<\/strong>，两者作用截然不同。<\/p>"}, {"type": "code", "lang": "python", "text": "@dataclass\nclass Demo:\n    a: int          # 这是字段，会进 __init__\n    b: int = 10     # 这是有默认值的字段，也会进 __init__\n    c = 20          # 没有类型注解 → 被当成普通类属性，不会进 __init__\n\n\nd = Demo(1)          # 只能传 a、b\nprint(d)             # Demo(a=1, b=10)\nprint(d.c)           # 20"}, {"type": "table", "rows": [["写法", "是什么", "进 <code>__init__<\/code> 吗"], ["<code>a: int<\/code>", "字段声明", "✅"], ["<code>b: int = 10<\/code>", "有默认值的字段", "✅"], ["<code>c = 20<\/code>", "普通类属性", "❌"]]}, {"type": "quote", "html": "<p>这就是为什么 <a href=\"#topic-20\" data-go=\"topic-20\">20-类型注解<\/a> 要先学——<code>dataclass<\/code> <strong>靠类型注解识别字段<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "3. 字段默认值的坑", "html": "3. 字段默认值的坑"}, {"type": "code", "lang": "python", "text": "@dataclass\nclass Bad:\n    tags: list = []      # ❌ ValueError: mutable default"}, {"type": "p", "html": "和「函数可变默认参数」是同一个坑。解决办法："}, {"type": "code", "lang": "python", "text": "from dataclasses import dataclass, field\n\n@dataclass\nclass Good:\n    tags: list = field(default_factory=list)      # ✅ 每次新建一个列表\n    scores: dict = field(default_factory=dict)"}, {"type": "h", "level": 2, "text": "4. frozen=True：创建后不可变", "html": "4. <code>frozen=True<\/code>：创建后不可变"}, {"type": "p", "html": "适合「坐标点、枚举值、配置项」这种概念上就该只读的东西。"}, {"type": "code", "lang": "python", "text": "@dataclass(frozen=True)\nclass Point:\n    x: int\n    y: int\n\n\np = Point(1, 2)\np.x = 100          # ❌ FrozenInstanceError: cannot assign to field 'x'"}, {"type": "quote", "html": "<p>这个保护是<strong>运行时<\/strong>的——就算静态检查工具没拦住，运行时也会炸。<\/p><p>附带好处：<code>frozen=True<\/code> 的对象<strong>可哈希<\/strong>（能放进 <code>set<\/code> / 当 <code>dict<\/code> 的 key），<\/p><p>解决了 <a href=\"#topic-13\" data-go=\"topic-13\">13-特殊方法与哈希<\/a> 里&quot;重写 <code>__eq__<\/code> 就不可哈希&quot;的麻烦。<\/p>"}, {"type": "table", "rows": [["写法", "能不能改", "可哈希"], ["<code>@dataclass<\/code>", "✅ 能改", "❌（默认 <code>eq=True<\/code> 时不可哈希）"], ["<code>@dataclass(frozen=True)<\/code>", "❌ 不能改", "✅"]]}, {"type": "h", "level": 2, "text": "5. field(init=False)：派生字段", "html": "5. <code>field(init=False)<\/code>：派生字段"}, {"type": "p", "html": "从其他字段算出来的值，不该让用户在构造时传。"}, {"type": "code", "lang": "python", "text": "@dataclass\nclass Order:\n    price: float\n    count: int\n    total: float = field(init=False)      # 不出现在 __init__ 参数里\n\n    def __post_init__(self):\n        self.total = self.price * self.count\n\n\no = Order(9.9, 3)      # 只传 price 和 count\nprint(o.total)         # 29.7"}, {"type": "quote", "html": "<p><code>init=False<\/code> 让 <code>total<\/code> <strong>不出现在 <code>__init__<\/code> 的参数里<\/strong>——用户构造时不需要也不该传它。<\/p>"}, {"type": "h", "level": 2, "text": "6. __post_init__：构造后自动调用的钩子", "html": "6. <code>__post_init__<\/code>：构造后自动调用的钩子"}, {"type": "quote", "html": "<p><code>__post_init__<\/code> 是 <code>dataclass<\/code> <strong>自动调用<\/strong>的，名字必须就是这个，<strong>连下划线数量都不能错<\/strong>（前后各两个）。<\/p>"}, {"type": "p", "html": "两种典型用途："}, {"type": "h", "level": 3, "text": "用途 A：派生计算（推荐）", "html": "用途 A：派生计算（推荐）"}, {"type": "code", "lang": "python", "text": "def __post_init__(self):\n    self.total = self.price * self.count"}, {"type": "h", "level": 3, "text": "用途 B：字段校验（可用，但是权宜之计）", "html": "用途 B：字段校验（可用，但是权宜之计）"}, {"type": "code", "lang": "python", "text": "@dataclass\nclass Employee:\n    name: str\n    salary: int\n\n    def __post_init__(self):\n        if self.salary < 0:\n            raise ValueError(f'工资不能是负数，收到: {self.salary}')\n        if not self.name:\n            raise ValueError('姓名不能为空')\n\n\nEmployee('两点水', -100)     # ❌ ValueError: 工资不能是负数，收到: -100\nEmployee('两点水', 12000)    # ✅ Employee(name='两点水', salary=12000)"}, {"type": "quote", "html": "<p>⚠️ <strong>但 <code>__post_init__<\/code> 里写校验只是「权宜之计」<\/strong>。它的活儿性质偏向「派生计算」，<\/p><p>校验逻辑写多了会显得别扭。<strong>生产里如果数据来自外部（HTTP 请求、JSON 配置），更推荐用 Pydantic 专门做校验。<\/strong><\/p>"}, {"type": "h", "level": 2, "text": "7. dataclass / 普通类 / Pydantic 怎么选", "html": "7. dataclass / 普通类 / Pydantic 怎么选"}, {"type": "table", "rows": [["场景", "选什么"], ["只是装数据的容器（内部使用）", "<strong>dataclass<\/strong>"], ["需要只读、可哈希", "<code>dataclass(frozen=True)<\/code>"], ["有复杂校验、数据来自外部（API/JSON）", "<strong>Pydantic<\/strong>（<code>BaseModel<\/code>）"], ["有大量业务方法、状态会变", "普通类"]]}, {"type": "quote", "html": "<p>顺带：<strong>Agent 开发里的工具参数、结构化输出<\/strong>用的就是 Pydantic，和 dataclass 思路一脉相承。<\/p>"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<strong>没有类型注解的字段不会进 <code>__init__<\/code><\/strong>（会变成类属性）——最容易踩", "可变默认值（<code>list<\/code>/<code>dict<\/code>/<code>set<\/code>）必须用 <code>field(default_factory=...)<\/code>", "<code>frozen=True<\/code> 只是<strong>运行时<\/strong>保护，改不动是真改不动，但也别指望它是&quot;编译期检查&quot;", "<code>field(init=False)<\/code> 的字段要在 <code>__post_init__<\/code> 里赋值，否则读它是 AttributeError", "<code>__post_init__<\/code> 前后各两个下划线，写错就静默不执行", "校验别全塞 <code>__post_init__<\/code>，外部数据用 Pydantic", "默认 <code>@dataclass<\/code> 不可哈希（因为自动生成了 <code>__eq__<\/code>），需要时加 <code>frozen=True<\/code>"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["类型注解（dataclass 的基础）→ <a href=\"#topic-20\" data-go=\"topic-20\">20-类型注解<\/a>", "类属性与实例属性 → <a href=\"#topic-15\" data-go=\"topic-15\">15-类属性与实例属性<\/a>", "特殊方法与哈希 → <a href=\"#topic-13\" data-go=\"topic-13\">13-特殊方法与哈希<\/a>", "可变默认参数（同一个坑）→ <a href=\"#topic-11\" data-go=\"topic-11\">11-函数进阶<\/a>", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-22/A.md\">source/2026-10-22/A.md<\/span>（图 image67~image70）"]}]}, {"id": "topic-27", "title": "Annotated（类型标签）", "chapter": "第 5 章 进阶", "keywords": ["Annotated", "typing", "类型元数据", "get_type_hints", "reducer", "add_messages"], "search": "--- title: Annotated（类型标签） category: 进阶 keywords: [Annotated, typing, 类型元数据, get_type_hints, reducer, add_messages] dates: [2026-10-26] ---  # Annotated（给类型贴标签）  > 一句话：Annotated[类型, 标签] = 给一个类型额外附一条说明，运行时不改变任何行为。 > 它是读懂 LangGraph State 的钥匙。  ## 1. 是什么  普通类型注解只说明\"这是什么类型\"；Annotated 还能额外挂一条元数据（标签）。  python from typing import Annotated  # 普通注解 age: int  # 带标签的注解 age: Annotated[int, \"用户年龄，单位岁\"]   关键：那个标签不影响运行。Annotated[int, \"...\"] 在运行时就是 int。  ## 2. 语法  python from typing import Annotated, get_type_hints  # 可以起个别名，方便复用 UserText = Annotated[str, \"用户输入的文本\"]   def read(text: UserText) -> str:     return text   print(read(\"你好\"))          # 你好（运行和普通 str 没区别）   ## 3. 怎么把标签读出来  python hints = get_type_hints(read, include_extras=True) print(hints)                      # {'text': Annotated[str, '用户输入的文本'], 'return': <class 'str'>} print(hints[\"text\"].__metadata__) # ('用户输入的文本',)   | 参数 | 作用 | | --- | --- | | include_extras=True | 必须加，否则标签会被剥掉，只剩基础类型 | | .__metadata__ | 取出标签，是元组 |  ## 4. 标签可以是一个\"函数\"（重点）  python def merge(left, right):     return left + right   Messages = Annotated[list, merge]     # 标签是 merge 这个函数   这就是 LangGraph 里那一行的真相：  python messages: Annotated[list[AnyMessage], add_messages] #         └─ 类型：消息列表 ─┘  └─ 标签：合并方式 ─┘   翻译成人话：  > \"messages 这个字段是列表；有新数据来时，用 add_messages 的方式合并（追加），不要整个覆盖。\"  注意：这个位置没有括号（不是 add_messages()）。它不是在这里被调用，只是被\"贴上去当说明\"。真正调用它的是 LangGraph 内部。  ## 5. 这个\"标签函数\"叫什么：reducer（归约器）  | 写法 | 新数据来时 | | --- | --- | | messages: list | 覆盖（历史全丢） | | messages: Annotated[list, add_messages] | 追加（保留历史） |  > 这就是 Agent 能\"记得上一轮工具结果\"的原因。 > 少了 Annotated[..., add_messages]，就算加了 checkpointer 也会失忆。  ## 6. Annotated / 普通注解 / dataclass / TypedDict 的关系  | 写法 | 作用 | 运行时 | | --- | --- | --- | | x: int | 只说类型 | 不校验 | | x: Annotated[int, \"说明\"] | 类型 + 标签 | 不校验，标签可被读取 | | @dataclass | 生成真正的类（有 __init__） | 会执行 | | class X(TypedDict) | 声明字典的键 | 就是个普通 dict |  > 四者的共同点：都用\"类型注解\"描述结构。区别在于\"运行时管不管\"。  ## 7. 自定义 reducer（进阶）  python def keep_last(left, right):     \"\"\"只保留最新的那条。\"\"\"     return right   class State(TypedDict):     latest: Annotated[str, keep_last]   LangGraph 每次更新 latest 时，会用 keep_last(旧值, 新值) 算出结果。  ## ⚠️ 易错点速记  1. Annotated 不改变运行行为——它只是标签，别指望它做校验 2. 读标签必须 include_extras=True，否则标签丢了 3. .__metadata__ 是元组，取第一个用 [0] 4. LangGraph 里 add_messages 是标签不是调用——写 add_messages 不加括号 5. 忘了 Annotated[..., add_messages] → 消息被覆盖 → Agent 失忆 6. Annotated 从 typing 导入（Python 3.9+）  ## 🔗 关联  - 类型注解基础 → 20-类型注解 - dataclass → 23-dataclass - LangGraph 用法 → 26-LangGraph基础 - 关键词表 → agent-lab/basics/关键词表.md", "blocks": [{"type": "h", "level": 1, "text": "Annotated（给类型贴标签）", "html": "Annotated（给类型贴标签）"}, {"type": "quote", "html": "<p>一句话：<code>Annotated[类型, 标签]<\/code> = 给一个类型<strong>额外附一条说明<\/strong>，<strong>运行时不改变任何行为<\/strong>。<\/p><p>它是读懂 LangGraph <code>State<\/code> 的钥匙。<\/p>"}, {"type": "h", "level": 2, "text": "1. 是什么", "html": "1. 是什么"}, {"type": "p", "html": "普通类型注解只说明&quot;这是什么类型&quot;；<code>Annotated<\/code> 还能<strong>额外挂一条元数据<\/strong>（标签）。"}, {"type": "code", "lang": "python", "text": "from typing import Annotated\n\n# 普通注解\nage: int\n\n# 带标签的注解\nage: Annotated[int, \"用户年龄，单位岁\"]"}, {"type": "p", "html": "<strong>关键<\/strong>：那个标签<strong>不影响运行<\/strong>。<code>Annotated[int, &quot;...&quot;]<\/code> 在运行时就是 <code>int<\/code>。"}, {"type": "h", "level": 2, "text": "2. 语法", "html": "2. 语法"}, {"type": "code", "lang": "python", "text": "from typing import Annotated, get_type_hints\n\n# 可以起个别名，方便复用\nUserText = Annotated[str, \"用户输入的文本\"]\n\n\ndef read(text: UserText) -> str:\n    return text\n\n\nprint(read(\"你好\"))          # 你好（运行和普通 str 没区别）"}, {"type": "h", "level": 2, "text": "3. 怎么把标签读出来", "html": "3. 怎么把标签读出来"}, {"type": "code", "lang": "python", "text": "hints = get_type_hints(read, include_extras=True)\nprint(hints)                      # {'text': Annotated[str, '用户输入的文本'], 'return': <class 'str'>}\nprint(hints[\"text\"].__metadata__) # ('用户输入的文本',)"}, {"type": "table", "rows": [["参数", "作用"], ["<code>include_extras=True<\/code>", "<strong>必须加<\/strong>，否则标签会被剥掉，只剩基础类型"], ["<code>.__metadata__<\/code>", "取出标签，是<strong>元组<\/strong>"]]}, {"type": "h", "level": 2, "text": "4. 标签可以是一个\"函数\"（重点）", "html": "4. 标签可以是一个&quot;函数&quot;（重点）"}, {"type": "code", "lang": "python", "text": "def merge(left, right):\n    return left + right\n\n\nMessages = Annotated[list, merge]     # 标签是 merge 这个函数"}, {"type": "p", "html": "这就是 LangGraph 里那一行的真相："}, {"type": "code", "lang": "python", "text": "messages: Annotated[list[AnyMessage], add_messages]\n#         └─ 类型：消息列表 ─┘  └─ 标签：合并方式 ─┘"}, {"type": "p", "html": "翻译成人话："}, {"type": "quote", "html": "<p>&quot;<code>messages<\/code> 这个字段是列表；<strong>有新数据来时，用 <code>add_messages<\/code> 的方式合并<\/strong>（追加），不要整个覆盖。&quot;<\/p>"}, {"type": "p", "html": "<strong>注意<\/strong>：这个位置<strong>没有括号<\/strong>（不是 <code>add_messages()<\/code>）。它不是在这里被调用，只是被&quot;贴上去当说明&quot;。真正调用它的是 <strong>LangGraph 内部<\/strong>。"}, {"type": "h", "level": 2, "text": "5. 这个\"标签函数\"叫什么：reducer（归约器）", "html": "5. 这个&quot;标签函数&quot;叫什么：reducer（归约器）"}, {"type": "table", "rows": [["写法", "新数据来时"], ["<code>messages: list<\/code>", "<strong>覆盖<\/strong>（历史全丢）"], ["<code>messages: Annotated[list, add_messages]<\/code>", "<strong>追加<\/strong>（保留历史）"]]}, {"type": "quote", "html": "<p>这就是 Agent 能&quot;记得上一轮工具结果&quot;的原因。<\/p><p>少了 <code>Annotated[..., add_messages]<\/code>，就算加了 <code>checkpointer<\/code> 也会失忆。<\/p>"}, {"type": "h", "level": 2, "text": "6. Annotated / 普通注解 / dataclass / TypedDict 的关系", "html": "6. Annotated / 普通注解 / dataclass / TypedDict 的关系"}, {"type": "table", "rows": [["写法", "作用", "运行时"], ["<code>x: int<\/code>", "只说类型", "不校验"], ["<code>x: Annotated[int, &quot;说明&quot;]<\/code>", "类型 + 标签", "不校验，标签可被读取"], ["<code>@dataclass<\/code>", "生成真正的类（有 <code>__init__<\/code>）", "会执行"], ["<code>class X(TypedDict)<\/code>", "声明字典的键", "就是个普通 dict"]]}, {"type": "quote", "html": "<p>四者的共同点：<strong>都用&quot;类型注解&quot;描述结构<\/strong>。区别在于&quot;运行时管不管&quot;。<\/p>"}, {"type": "h", "level": 2, "text": "7. 自定义 reducer（进阶）", "html": "7. 自定义 reducer（进阶）"}, {"type": "code", "lang": "python", "text": "def keep_last(left, right):\n    \"\"\"只保留最新的那条。\"\"\"\n    return right\n\n\nclass State(TypedDict):\n    latest: Annotated[str, keep_last]"}, {"type": "p", "html": "LangGraph 每次更新 <code>latest<\/code> 时，会用 <code>keep_last(旧值, 新值)<\/code> 算出结果。"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<strong><code>Annotated<\/code> 不改变运行行为<\/strong>——它只是标签，别指望它做校验", "读标签必须 <code>include_extras=True<\/code>，否则标签丢了", "<code>.__metadata__<\/code> 是<strong>元组<\/strong>，取第一个用 <code>[0]<\/code>", "LangGraph 里 <code>add_messages<\/code> <strong>是标签不是调用<\/strong>——写 <code>add_messages<\/code> 不加括号", "忘了 <code>Annotated[..., add_messages]<\/code> → 消息被覆盖 → Agent 失忆", "<code>Annotated<\/code> 从 <code>typing<\/code> 导入（Python 3.9+）"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["类型注解基础 → <a href=\"#topic-20\" data-go=\"topic-20\">20-类型注解<\/a>", "dataclass → <a href=\"#topic-23\" data-go=\"topic-23\">23-dataclass<\/a>", "LangGraph 用法 → <a href=\"#topic-26\" data-go=\"topic-26\">26-LangGraph基础<\/a>", "关键词表 → <code>agent-lab/basics/关键词表.md<\/code>"]}]}, {"id": "topic-20", "title": "类型注解", "chapter": "第 6 章 工程", "keywords": ["类型注解", "type hints", "类型提示", "箭头", "->", "typing", "静态检查", "IDE 补全"], "search": "--- title: 类型注解 category: 工程 keywords: [类型注解, type hints, 类型提示, 箭头, ->, typing, 静态检查, IDE 补全] dates: [2026-10-21] ---  # 类型注解（Type Hints）  > 一句话：给函数和变量贴上\"类型标签\"，让 IDE 和人一眼看懂，但 Python 运行时不强制检查。  ## 1. 基本语法  > 记住口诀：参数加冒号，返回加箭头。  python def add(a: int, b: int) -> int:     return a + b   def greet(name: str) -> str:     return f\"你好，{name}\"   def log(message: str) -> None:      # 没有返回值就写 None     print(message)   | 位置 | 写法 | 含义 | | --- | --- | --- | | 参数 | name: str | 参数类型 | | 返回值 | -> int | 返回类型 | | 无返回 | -> None | 返回 None |  ## 2. 关键认知：注解只是\"标签\"，不强制  python def add(a: int, b: int) -> int:     return a + b  print(add(\"a\", \"b\"))     # ab —— 运行时不报错！注解没拦住   - Python 不会因为类型不对就报错 - 注解的用处是给 IDE / 类型检查器 / 读代码的人看的 - 想真检查，要用 mypy、pyright 这类静态检查工具  ## 3. 常用类型写法  python x: int = 1 price: float = 9.9 name: str = \"小明\" ok: bool = True  # 容器要写元素的类型 names: list[str] = [\"a\", \"b\"] ages: dict[str, int] = {\"小明\": 18} point: tuple[int, int] = (1, 2) ids: set[int] = {1, 2, 3}  # 可能为 None nickname: str | None = None     # Python 3.10+ 写法   > 旧写法 Optional[str]（from typing import Optional）等价于 str | None， > 新代码优先用 |。  ## 4. 为什么值得写  | 收益 | 说明 | | --- | --- | | IDE 补全 | 打 x. 时编辑器能提示该类型的方法 | | 少写文档 | 签名本身就是最准的文档 | | 早发现 bug | 配合 mypy 在运行前就发现类型错误 | | 团队协作 | 别人读你的函数不用猜参数是什么 |  ## 5. 什么时候可以偷懒  - 脚本/一次性的小代码：不写注解也行，写得清楚就好 - 公开函数 / 会被别人用的代码：强烈建议写 - 复杂结构：可以先用 dict/list 粗标注，别一开始就上 TypedDict  ## ⚠️ 易错点速记  1. 注解不强制！add(\"a\",\"b\") 照样能跑，别以为写了 int 就安全 2. 返回无值写 -> None，不要漏 3. list[str] 是 Python 3.9+ 写法，老版本要 List[str]（from typing import List） 4. str | None 是 3.10+ 写法，老版本用 Optional[str] 5. 注解写错不会报错，但会误导 IDE——改代码时记得同步改注解 6. 默认参数写了注解也别忘默认值：def f(x: int = 0) -> int:  ## 🔗 关联  - 函数进阶（默认参数、返回值）→ 11-函数进阶 - 工程化（pytest / ruff / mypy）→ 待建专题 - 原始截图 → source/2026-10-21/A.md（图 image59）", "blocks": [{"type": "h", "level": 1, "text": "类型注解（Type Hints）", "html": "类型注解（Type Hints）"}, {"type": "quote", "html": "<p>一句话：<strong>给函数和变量贴上&quot;类型标签&quot;<\/strong>，让 IDE 和人一眼看懂，但 Python 运行时<strong>不强制检查<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "1. 基本语法", "html": "1. 基本语法"}, {"type": "quote", "html": "<p>记住口诀：<strong>参数加冒号，返回加箭头。<\/strong><\/p>"}, {"type": "code", "lang": "python", "text": "def add(a: int, b: int) -> int:\n    return a + b\n\n\ndef greet(name: str) -> str:\n    return f\"你好，{name}\"\n\n\ndef log(message: str) -> None:      # 没有返回值就写 None\n    print(message)"}, {"type": "table", "rows": [["位置", "写法", "含义"], ["参数", "<code>name: str<\/code>", "参数类型"], ["返回值", "<code>-&gt; int<\/code>", "返回类型"], ["无返回", "<code>-&gt; None<\/code>", "返回 None"]]}, {"type": "h", "level": 2, "text": "2. 关键认知：注解只是\"标签\"，不强制", "html": "2. 关键认知：注解只是&quot;标签&quot;，不强制"}, {"type": "code", "lang": "python", "text": "def add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(\"a\", \"b\"))     # ab —— 运行时不报错！注解没拦住"}, {"type": "ul", "items": ["Python <strong>不会<\/strong>因为类型不对就报错", "注解的用处是给 <strong>IDE / 类型检查器 / 读代码的人<\/strong>看的", "想真检查，要用 <code>mypy<\/code>、<code>pyright<\/code> 这类静态检查工具"]}, {"type": "h", "level": 2, "text": "3. 常用类型写法", "html": "3. 常用类型写法"}, {"type": "code", "lang": "python", "text": "x: int = 1\nprice: float = 9.9\nname: str = \"小明\"\nok: bool = True\n\n# 容器要写元素的类型\nnames: list[str] = [\"a\", \"b\"]\nages: dict[str, int] = {\"小明\": 18}\npoint: tuple[int, int] = (1, 2)\nids: set[int] = {1, 2, 3}\n\n# 可能为 None\nnickname: str | None = None     # Python 3.10+ 写法"}, {"type": "quote", "html": "<p>旧写法 <code>Optional[str]<\/code>（<code>from typing import Optional<\/code>）等价于 <code>str | None<\/code>，<\/p><p>新代码优先用 <code>|<\/code>。<\/p>"}, {"type": "h", "level": 2, "text": "4. 为什么值得写", "html": "4. 为什么值得写"}, {"type": "table", "rows": [["收益", "说明"], ["<strong>IDE 补全<\/strong>", "打 <code>x.<\/code> 时编辑器能提示该类型的方法"], ["<strong>少写文档<\/strong>", "签名本身就是最准的文档"], ["<strong>早发现 bug<\/strong>", "配合 mypy 在运行前就发现类型错误"], ["<strong>团队协作<\/strong>", "别人读你的函数不用猜参数是什么"]]}, {"type": "h", "level": 2, "text": "5. 什么时候可以偷懒", "html": "5. 什么时候可以偷懒"}, {"type": "ul", "items": ["<strong>脚本/一次性的小代码<\/strong>：不写注解也行，写得清楚就好", "<strong>公开函数 / 会被别人用的代码<\/strong>：强烈建议写", "<strong>复杂结构<\/strong>：可以先用 <code>dict<\/code>/<code>list<\/code> 粗标注，别一开始就上 <code>TypedDict<\/code>"]}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["注解<strong>不强制<\/strong>！<code>add(&quot;a&quot;,&quot;b&quot;)<\/code> 照样能跑，别以为写了 <code>int<\/code> 就安全", "返回无值写 <code>-&gt; None<\/code>，不要漏", "<code>list[str]<\/code> 是 Python 3.9+ 写法，老版本要 <code>List[str]<\/code>（<code>from typing import List<\/code>）", "<code>str | None<\/code> 是 3.10+ 写法，老版本用 <code>Optional[str]<\/code>", "注解写错不会报错，但会误导 IDE——改代码时记得同步改注解", "默认参数写了注解也别忘默认值：<code>def f(x: int = 0) -&gt; int:<\/code>"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["函数进阶（默认参数、返回值）→ <a href=\"#topic-11\" data-go=\"topic-11\">11-函数进阶<\/a>", "工程化（pytest / ruff / mypy）→ 待建专题", "原始截图 → <span class=\"deadlink\" title=\"源文件：source/2026-10-21/A.md\">source/2026-10-21/A.md<\/span>（图 image59）"]}]}, {"id": "topic-21", "title": "pathlib 路径与文件操作", "chapter": "第 6 章 工程", "keywords": ["pathlib", "Path", "路径", "文件操作", "read_text", "write_text", "glob", "mkdir", "exists", "unlink"], "search": "--- title: pathlib 路径与文件操作 category: 工程 keywords: [pathlib, Path, 路径, 文件操作, read_text, write_text, glob, mkdir, exists, unlink] dates: [2026-10-21] ---  # pathlib 路径与文件操作  > 一句话：路径在 pathlib 里不是字符串，而是一个有属性、有方法的\"对象\"——用 Path 代替 os.path 的字符串拼接。  ## 1. 综合演示：路径拆解  python from pathlib import Path  p = Path('/Users/walter/projects/demo/main.py')  print('name  :', p.name)      # main.py print('stem  :', p.stem)      # main print('suffix:', p.suffix)    # .py print('parent:', p.parent)    # /Users/walter/projects/demo print('parts :', p.parts)     # ('/', 'Users', 'walter', 'projects', 'demo', 'main.py')   .parts 把整个路径切成元组，逐段处理特别方便。  ## 2. 判断状态（防报错必用）  python p = Path('/tmp') print(p.exists())     # 路径是否存在 print(p.is_dir())     # 是不是目录 print(p.is_file())    # 是不是文件   | 方法 | 作用 | 白话 | | --- | --- | --- | | .exists() | 判断路径是否存在 | 到底有没有这个东西（不管文件还是文件夹） | | .is_file() | 判断是不是文件 | 这是一个文件吗（.txt、.py） | | .is_dir() | 判断是不是目录 | 这是一个文件夹吗 |  ## 3. 读写文件（极简版）  python p = Path('demo.txt')  p.write_text('你好', encoding='utf-8')    # 一行写完；不存在会自动创建，存在会覆盖 content = p.read_text(encoding='utf-8')   # 一行读完全部，返回字符串   > ⚠️ 千万记得写 encoding='utf-8'，否则中文在 Windows 上容易乱码。  ## 4. 找文件（遍历目录）  | 方法 | 作用 | 白话 | | --- | --- | --- | | .iterdir() | 列出下一层 | 看看这个文件夹里都有啥（只找第一层，不往子文件夹钻） | | .glob('*.py') | 找匹配的文件 | 在当前文件夹里找所有 .py 文件 | | .rglob('*.py') | 递归找匹配的文件 | 在当前及所有子文件夹里，掘地三尺找 .py |  python for f in Path('.').glob('*.py'):     print(f.name)  for f in Path('.').rglob('*.py'):    # r = recursive 递归     print(f)   ## 5. 创建与删除  | 方法 | 作用 | 口语解释 | | --- | --- | --- | | .mkdir(parents=True, exist_ok=True) | 建文件夹 | parents=True：父文件夹不存在自动帮你建（类似 mkdir -p）；exist_ok=True：已经存在了不报错 | | .touch() | 建空文件 | 摸一下，建一个空文件；已存在就只更新修改时间 | | .unlink(missing_ok=True) | 删文件 | missing_ok=True：要删的文件本来就不存在，别报错 |  python Path('data/2026').mkdir(parents=True, exist_ok=True) Path('demo.txt').touch() Path('demo.txt').unlink(missing_ok=True)   ## 6. 附赠常用属性（无括号）  | 属性 | 作用 | 例子 | | --- | --- | --- | | .name | 文件名（含后缀） | demo.txt | | .stem | 文件名（无后缀） | demo | | .suffix | 文件后缀 | .txt | | .parent | 父目录 | 这个文件在哪个文件夹里 | | .absolute() | 绝对路径 | 从盘符/根目录开始的完整路径 |  python print(Path.home())       # 当前用户的家目录 print(Path.cwd())        # 当前工作目录 Path('a/b.txt').absolute()   # 变成绝对路径   ## 7. 🔑 老手实战口诀（背下来）  1. 读写文件一律带 encoding='utf-8' 2. 建文件夹一律带 parents=True, exist_ok=True 3. 删文件一律带 missing_ok=True 4. 只要带 ok=True 这类参数，就能让你免去 80% 的\"文件已存在\"或\"文件找不到\"的崩溃报错  ## ⚠️ 易错点速记  1. Path 是对象，不能直接和字符串拼——用 / 运算符：Path('a') / 'b.txt' 2. 读写文本必须 encoding='utf-8'，否则中文乱码 3. .mkdir() 不加 parents=True 时，父目录不存在会报错 4. glob 只找当前层，rglob 才会递归 5. 属性（.name/.parent）没有括号；方法（.exists()）有括号 6. 想兼容不同系统路径分隔符，就全程用 Path，别手写 \\\\ 或 /  ## 🔗 关联  - 文件读写基础（open / with）→ 待建专题 - 异常处理（FileNotFoundError）→ 22-异常处理 - 原始截图 → source/2026-10-21/A.md（图 image60~image63）", "blocks": [{"type": "h", "level": 1, "text": "pathlib 路径与文件操作", "html": "pathlib 路径与文件操作"}, {"type": "quote", "html": "<p>一句话：<strong>路径在 pathlib 里不是字符串，而是一个有属性、有方法的&quot;对象&quot;<\/strong>——用 <code>Path<\/code> 代替 <code>os.path<\/code> 的字符串拼接。<\/p>"}, {"type": "h", "level": 2, "text": "1. 综合演示：路径拆解", "html": "1. 综合演示：路径拆解"}, {"type": "code", "lang": "python", "text": "from pathlib import Path\n\np = Path('/Users/walter/projects/demo/main.py')\n\nprint('name  :', p.name)      # main.py\nprint('stem  :', p.stem)      # main\nprint('suffix:', p.suffix)    # .py\nprint('parent:', p.parent)    # /Users/walter/projects/demo\nprint('parts :', p.parts)     # ('/', 'Users', 'walter', 'projects', 'demo', 'main.py')"}, {"type": "p", "html": "<code>.parts<\/code> 把整个路径切成元组，逐段处理特别方便。"}, {"type": "h", "level": 2, "text": "2. 判断状态（防报错必用）", "html": "2. 判断状态（防报错必用）"}, {"type": "code", "lang": "python", "text": "p = Path('/tmp')\nprint(p.exists())     # 路径是否存在\nprint(p.is_dir())     # 是不是目录\nprint(p.is_file())    # 是不是文件"}, {"type": "table", "rows": [["方法", "作用", "白话"], ["<code>.exists()<\/code>", "判断路径是否存在", "到底有没有这个东西（不管文件还是文件夹）"], ["<code>.is_file()<\/code>", "判断是不是文件", "这是一个文件吗（<code>.txt<\/code>、<code>.py<\/code>）"], ["<code>.is_dir()<\/code>", "判断是不是目录", "这是一个文件夹吗"]]}, {"type": "h", "level": 2, "text": "3. 读写文件（极简版）", "html": "3. 读写文件（极简版）"}, {"type": "code", "lang": "python", "text": "p = Path('demo.txt')\n\np.write_text('你好', encoding='utf-8')    # 一行写完；不存在会自动创建，存在会覆盖\ncontent = p.read_text(encoding='utf-8')   # 一行读完全部，返回字符串"}, {"type": "quote", "html": "<p>⚠️ <strong>千万记得写 <code>encoding=&#x27;utf-8&#x27;<\/code><\/strong>，否则中文在 Windows 上容易乱码。<\/p>"}, {"type": "h", "level": 2, "text": "4. 找文件（遍历目录）", "html": "4. 找文件（遍历目录）"}, {"type": "table", "rows": [["方法", "作用", "白话"], ["<code>.iterdir()<\/code>", "列出下一层", "看看这个文件夹里都有啥（只找第一层，不往子文件夹钻）"], ["<code>.glob(&#x27;*.py&#x27;)<\/code>", "找匹配的文件", "在当前文件夹里找所有 <code>.py<\/code> 文件"], ["<code>.rglob(&#x27;*.py&#x27;)<\/code>", "递归找匹配的文件", "在当前及所有子文件夹里，掘地三尺找 <code>.py<\/code>"]]}, {"type": "code", "lang": "python", "text": "for f in Path('.').glob('*.py'):\n    print(f.name)\n\nfor f in Path('.').rglob('*.py'):    # r = recursive 递归\n    print(f)"}, {"type": "h", "level": 2, "text": "5. 创建与删除", "html": "5. 创建与删除"}, {"type": "table", "rows": [["方法", "作用", "口语解释"], ["<code>.mkdir(parents=True, exist_ok=True)<\/code>", "建文件  DEEPSEEK_BASE_URL=https://api.deepseek.com DEEPSEEK_MODEL=deepseek-chat   代码里用 python-dotenv 读取，避免把 key 写进代码（也避免提交到 Git）：  python from dotenv import load_dotenv load_dotenv(Path(__file__).parent / \".env\")   > .env 必须写进 .gitignore，密钥永远不进版本库。  ## 4. 模型名怎么选  | 模型名 | 用途 | | --- | --- | | deepseek-chat | 通用对话（V3 系列），日常用这个 | | deepseek-reasoner | 推理模型（R1 系列），复杂推理用，更慢更贵 |  ## 5. Langflow 里怎么接（两条路）  ### 路线 A：原生 DeepSeek 组件（更简单）  Langflow 1.12 自带 DeepSeek 组件，字段：  | 字段 | 填什么 | | --- | --- | | DeepSeek API 密钥 | 你的 key | | DeepSeek API 基础 | 默认 https://api.deepseek.com，不用改 | | 型号名称 | deepseek-chat |  ### 路线 B：OpenAI Compatible 提供者  Langflow 1.12 内置官方提供者 OpenAI Compatible（来自官方包 lfx-openai-compatible）：  | 字段 | 填什么 | | --- | --- | | Base URL | https://api.deepseek.com（不要加 /v1，组件会自动补） | | API Key | 你的 key | | Model | 从下拉里选 deepseek-chat（它会请求 /v1/models 实时拉取） |  > 两条路都不需要任何第三方插件。  ## 6. ⚠️ 一个必须先知道的限制：DeepSeek 没有 embedding 接口  做 RAG（检索增强生成）时，\"把文档变成向量\"这一步需要 embedding 模型，而 DeepSeek 官方不提供。 三种替代方案：  | 方案 | 说明 | | --- | --- | | 本地 sentence-transformers | 如 BAAI/bge-small-zh-v1.5，免费、离线、推荐 | | Ollama 本地 embedding 模型 | 便于统一管理 | | 其他厂商的 embedding API | 如硅基流动 |  > 所以 RAG 依赖暂时没装，等学到那一步再按需装。  ## 7. Agent 开发全流程（7 阶段）   ① 调用模型        invoke / stream                 ← 当前进度 ② 提示词工程      PromptTemplate / few-shot ③ 结构化输出      Pydantic + with_structured_output ④ 工具调用        @tool + bind_tools ⑤ Agent 循环      LangGraph 状态图   ★核心 ⑥ RAG            切分 → 向量化 → 检索 → 拼提示词 ⑦ 工程化          日志 / trace / 评估 / 部署   ### 关键 API 速查  python llm.invoke(\"文本\")                  # 同步调用 llm.stream(\"文本\")                  # 流式（同步，for 循环取） llm.with_structured_output(Model)   # 结构化输出 llm.bind_tools([t1, t2])            # 绑定工具  prompt = ChatPromptTemplate.from_messages([(\"system\", \"...\"), (\"human\", \"{q}\")]) chain = prompt | llm | StrOutputParser()  @tool def my_tool(x: int) -> int:     \"\"\"工具说明（docstring 会被模型看到，必须写清楚）\"\"\"     return x   > 不需要 async：LangChain 的同步 API（invoke/stream）完全够用。  ## 8. ⚠️ DeepSeek 的「兼容性边界」（实测踩过的坑）  DeepSeek 说\"OpenAI 兼容\"，但是部分兼容。实测结果：  | 能力 | 支持 | | --- | --- | | 普通对话 /chat/completions | ✅ | | 函数调用（function calling） | ✅ | | response_format: json_object | ✅ | | response_format: json_schema | ❌ 不支持 | | embedding 接口 | ❌ 没有 |  踩坑现场：llm.with_structured_output(Movie) 报 This response_format type is unavailable now。  原因：新版 langchain 的 with_structured_output 默认发 json_schema。  修复：  python structured = llm.with_structured_output(Movie, method=\"function_calling\")   | method | 原理 | DeepSeek | | --- | --- | --- | | json_schema | 直接要求按 schema 返回 | ❌ | | json_mode | 返回 JSON 文本自行解析 | ✅（需额外提示） | | function_calling | 把结构伪装成\"调用函数\" | ✅ 推荐", "blocks": [{"type": "h", "level": 1, "text": "Agent 开发环境与 DeepSeek 接入", "html": "Agent 开发环境与 DeepSeek 接入"}, {"type": "quote", "html": "<p>一句话：<strong>DeepSeek 的 API 是 OpenAI 完全兼容的<\/strong>，所以用官方 <code>langchain-openai<\/code> 改个 <code>base_url<\/code> 就能连——<strong>一个第三方插件都不需要装<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "1. 核心认知：为什么不需要\"DeepSeek 插件\"", "html": "1. 核心认知：为什么不需要&quot;DeepSeek 插件&quot;"}, {"type": "p", "html": "DeepSeek 的接口格式和 OpenAI 一模一样（都是 <code>/chat/completions<\/code>），所以："}, {"type": "code", "lang": "python", "text": "from langchain_openai import ChatOpenAI\n\nllm = ChatOpenAI(\n    model=\"deepseek-chat\",\n    api_key=\"sk-xxx\",\n    base_url=\"https://api.deepseek.com\",   # ← 只改这一个参数\n)\nresp = llm.invoke(\"你好\")"}, {"type": "quote", "html": "<p>⚠️ <strong>安全提醒<\/strong>：网上那些&quot;DeepSeek 插件/扩展&quot;，很多是木马重灾区。<\/p><p><strong>官方组件 + 自定义 base_url<\/strong> 才是正确做法，全程零第三方代码。<\/p>"}, {"type": "h", "level": 2, "text": "2. 本机环境（agent-lab）", "html": "2. 本机环境（agent-lab）"}, {"type": "table", "rows": [["项", "值"], ["位置", "<code>桌面\\agent-lab\\<\/code>"], ["Python", "3.13.7（独立 venv，不影响 Anaconda）"], ["langchain", "1.4.7"], ["langchain-core", "1.6.13"], ["langchain-openai", "1.7.2"], ["langgraph", "1.2.16"], ["pydantic", "2.14.1"]]}, {"type": "p", "html": "<strong>为什么用独立 venv<\/strong>：不污染系统 Python / Anaconda，删掉文件夹就等于完全卸载。"}, {"type": "h", "level": 3, "text": "项目结构", "html": "项目结构"}, {"type": "code", "lang": "", "text": "agent-lab/\n├── .env              ← 唯一要改的地方（填 API Key）\n├── config.py         ← 统一配置：读 .env、返回 DeepSeek 客户端\n├── 00_check.py       ← 环境自检（依赖 + Key + 真实调用）\n├── 01_hello_llm.py   ← 第一次调用模型\n├── 02_chain.py       ← LCEL 管道：提示词 | 模型 | 解析器\n├── 03_tool_agent.py  ← 工具调用 Agent（ReAct 循环）\n├── requirements.txt\n├── run.bat           ← 一键运行（自动用 venv）\n└── README.md         ← 完整学习路线"}, {"type": "h", "level": 2, "text": "3. 配置方式：只改一个文件", "html": "3. 配置方式：只改一个文件"}, {"type": "p", "html": "<code>.env<\/code>："}, {"type": "code", "lang": "ini", "text": "DEEPSEEK_API_KEY=sk-你的key\nDEEPSEEK_BASE_URL=https://api.deepseek.com\nDEEPSEEK_MODEL=deepseek-chat"}, {"type": "p", "html": "代码里用 <code>python-dotenv<\/code> 读取，避免把 key 写进代码（也避免提交到 Git）："}, {"type": "code", "lang": "python", "text": "from dotenv import load_dotenv\nload_dotenv(Path(__file__).parent / \".env\")"}, {"type": "quote", "html": "<p><code>.env<\/code> 必须写进 <code>.gitignore<\/code>，<strong>密钥永远不进版本库<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "4. 模型名怎么选", "html": "4. 模型名怎么选"}, {"type": "table", "rows": [["模型名", "用途"], ["<code>deepseek-chat<\/code>", "通用对话（V3 系列），日常用这个"], ["<code>deepseek-reasoner<\/code>", "推理模型（R1 系列），复杂推理用，更慢更贵"]]}, {"type": "h", "level": 2, "text": "5. Langflow 里怎么接（两条路）", "html": "5. Langflow 里怎么接（两条路）"}, {"type": "h", "level": 3, "text": "路线 A：原生 DeepSeek 组件（更简单）", "html": "路线 A：原生 DeepSeek 组件（更简单）"}, {"type": "p", "html": "Langflow 1.12 自带 <strong><code>DeepSeek<\/code><\/strong> 组件，字段："}, {"type": "table", "rows": [["字段", "填什么"], ["<strong>DeepSeek API 密钥<\/strong>", "你的 key"], ["<strong>DeepSeek API 基础<\/strong>", "默认 <code>https://api.deepseek.com<\/code>，不用改"], ["<strong>型号名称<\/strong>", "<code>deepseek-chat<\/code>"]]}, {"type": "h", "level": 3, "text": "路线 B：OpenAI Compatible 提供者", "html": "路线 B：OpenAI Compatible 提供者"}, {"type": "p", "html": "Langflow 1.12 内置官方提供者 <strong><code>OpenAI Compatible<\/code><\/strong>（来自官方包 <code>lfx-openai-compatible<\/code>）："}, {"type": "table", "rows": [["字段", "填什么"], ["<strong>Base URL<\/strong>", "<code>https://api.deepseek.com<\/code>（<strong>不要<\/strong>加 <code>/v1<\/code>，组件会自动补）"], ["<strong>API Key<\/strong>", "你的 key"], ["<strong>Model<\/strong>", "从下拉里选 <code>deepseek-chat<\/code>（它会请求 <code>/v1/models<\/code> 实时拉取）"]]}, {"type": "quote", "html": "<p>两条路都<strong>不需要任何第三方插件<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "6. ⚠️ 一个必须先知道的限制：DeepSeek 没有 embedding 接口", "html": "6. ⚠️ 一个必须先知道的限制：DeepSeek 没有 embedding 接口"}, {"type": "p", "html": "做 <strong>RAG<\/strong>（检索增强生成）时，&quot;把文档变成向量&quot;这一步需要 <strong>embedding 模型<\/strong>，而 DeepSeek 官方<strong>不提供<\/strong>。 三种替代方案："}, {"type": "table", "rows": [["方案", "说明"], ["本地 <code>sentence-transformers<\/code>", "如 <code>BAAI/bge-small-zh-v1.5<\/code>，免费、离线、推荐"], ["Ollama 本地 embedding 模型", "便于统一管理"], ["其他厂商的 embedding API", "如硅基流动"]]}, {"type": "quote", "html": "<p>所以 RAG 依赖<strong>暂时没装<\/strong>，等学到那一步再按需装。<\/p>"}, {"type": "h", "level": 2, "text": "7. Agent 开发全流程（7 阶段）", "html": "7. Agent 开发全流程（7 阶段）"}, {"type": "code", "lang": "", "text": "① 调用模型        invoke / stream                 ← 当前进度\n② 提示词工程      PromptTemplate / few-shot\n③ 结构化输出      Pydantic + with_structured_output\n④ 工具调用        @tool + bind_tools\n⑤ Agent 循环      LangGraph 状态图   ★核心\n⑥ RAG            切分 → 向量化 → 检索 → 拼提示词\n⑦ 工程化          日志 / trace / 评估 / 部署"}, {"type": "h", "level": 3, "text": "关键 API 速查", "html": "关键 API 速查"}, {"type": "code", "lang": "python", "text": "llm.invoke(\"文本\")                  # 同步调用\nllm.stream(\"文本\")                  # 流式（同步，for 循环取）\nllm.with_structured_output(Model)   # 结构化输出\nllm.bind_tools([t1, t2])            # 绑定工具\n\nprompt = ChatPromptTemplate.from_messages([(\"system\", \"...\"), (\"human\", \"{q}\")])\nchain = prompt | llm | StrOutputParser()\n\n@tool\ndef my_tool(x: int) -> int:\n    \"\"\"工具说明（docstring 会被模型看到，必须写清楚）\"\"\"\n    return x"}, {"type": "quote", "html": "<p><strong>不需要 async<\/strong>：LangChain 的同步 API（<code>invoke<\/code>/<code>stream<\/code>）完全够用。<\/p>"}, {"type": "h", "level": 2, "text": "8. ⚠️ DeepSeek 的「兼容性边界」（实测踩过的坑）", "html": "8. ⚠️ DeepSeek 的「兼容性边界」（实测踩过的坑）"}, {"type": "p", "html": "DeepSeek 说&quot;OpenAI 兼容&quot;，但<strong>是部分兼容<\/strong>。实测结果："}, {"type": "table", "rows": [["能力", "支持"], ["普通对话 <code>/chat/completions<\/code>", "✅"], ["函数调用（function calling）", "✅"], ["<code>response_format: json_object<\/code>", "✅"], ["<strong><code>response_format: json_schema<\/code><\/strong>", "❌ <strong>不支持<\/strong>"], ["embedding 接口", "❌ 没有"]]}, {"type": "p", "html": "<strong>踩坑现场<\/strong>：<code>llm.with_structured_output(Movie)<\/code> 报 <code>This response_format type is unavailable now<\/code>。"}, {"type": "p", "html": "<strong>原因<\/strong>：新版 langchain 的 <code>with_structured_output<\/code> <strong>默认发 <code>json_schema<\/code><\/strong>。"}, {"type": "p", "html": "<strong>修复<\/strong>："}, {"type": "code", "lang": "python", "text": "structured = llm.with_structured_output(Movie, method=\"function_calling\")"}, {"type": "table", "rows": [["method", "原理", "DeepSeek"], ["<code>json_schema<\/code>", "直接要求按 schema 返回", "❌"], ["<code>json_mode<\/code>", "返回 JSON 文本自行解析", "✅（需额外提示）"], ["<strong><code>function_calling<\/code><\/strong>", "把结构伪装成&quot;调用函数&quot;", "✅ <strong>推荐<\/strong>"]]}, {"type": "quote", "html": "<p><strong>经验总结<\/strong>：「OpenAI 兼容」≠「100% 兼容」。遇到报错先看它<strong>具体<\/strong>说哪项不支持，再换等价实现。<\/p><p>通义、Kimi、智谱等国产模型也有类似差异。<\/p>"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<code>base_url<\/code> 写成 <code>https://api.deepseek.com/v1<\/code> 再让组件补 <code>/v1<\/code> → 变成 <code>/v1/v1<\/code>，报错", "模型名写错（DeepSeek 只有 <code>deepseek-chat<\/code> / <code>deepseek-reasoner<\/code>）", "key 前后有空格 → 401", "<code>.env<\/code> 提交进 Git → 密钥泄露（务必 <code>.gitignore<\/code>）", "以为要装&quot;DeepSeek 插件&quot; → 恰恰是最危险的做法", "想用 DeepSeek 做 embedding → 它没有，得另找方案", "<code>with_structured_output<\/code> 忘了 <code>method=&quot;function_calling&quot;<\/code> → DeepSeek 报 <code>json_schema<\/code> 不支持"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["Langflow 操作 → <a href=\"#topic-25\" data-go=\"topic-25\">25-Langflow基础操作<\/a>", "类型注解（Pydantic/dataclass 基础）→ <a href=\"#topic-20\" data-go=\"topic-20\">20-类型注解<\/a>", "装饰器（<code>@tool<\/code> 的本质）→ <a href=\"#topic-18\" data-go=\"topic-18\">18-闭包<\/a>", "异常处理（API 报错处理）→ <a href=\"#topic-22\" data-go=\"topic-22\">22-异常处理<\/a>"]}]}, {"id": "topic-25", "title": "Langflow 基础操作", "chapter": "第 6 章 工程", "keywords": ["Langflow", "可视化", "组件", "连线", "Playground", "代理程序", "提示模板", "报错排查"], "search": "--- title: Langflow 基础操作 category: 工程 keywords: [Langflow, 可视化, 组件, 连线, Playground, 代理程序, 提示模板, 报错排查] dates: [2026-10-22] ---  # Langflow 基础操作  > 一句话：Langflow 是拖拽式搭 AI 工作流的工具——组件 = 积木，连线 = 数据流。  ## 1. 组件中文名速查（中文版界面）  | 用途 | 中文组件名 | 备注 | | --- | --- | --- | | 输入 | 聊天输入 | 输出端口叫「聊天消息」 | | 输出 | 聊天记录 | ⚠️ 不是\"聊天输出\" | | 大模型 | 语言模型 / DeepSeek | 二选一 | | 提示词 | 提示模板 | | | 智能体 | 代理程序 | 自带计算器、日期工具 | | 计算器 | 计算器 | 在代理里是开关，不用单独拖 | | 调试运行 | Playground | 这个词没翻译 |  ## 2. 连线规则（记住就不会接错）  > 数据从左往右流 > - 右侧圆点 = 输出（数据出去） > - 左侧圆点 = 输入（数据进来）   聊天输入 ──聊天消息──► 语言模型「输入」 语言模型 ──语言模型──► 聊天记录「输入」   ## 3. 三个入门练习  ### 练习 1：最小对话回路   聊天输入 ──► 语言模型 ──► 聊天记录   配置：语言模型 里选 provider + model（红色星号是必填）。  ### 练习 2：给它一个人设（提示模板）   聊天输入 ──► 提示模板 ──► 语言模型 ──► 聊天记录   - 提示模板 里写人设，例如：      你是一位耐心的 Python 老师。回答控制在三句话内，必须附一段代码示例。    - 提示模板的「提示」输出 → 语言模型的「系统消息」输入  效果：同一句话，回答风格完全变了 → 这就是提示词工程。  ### 练习 3：让它会用工具（代理程序）   聊天输入 ──► 代理程序 ──► 聊天记录   代理程序 的关键字段：  | 字段 | 说明 | | --- | --- | | 语言模型（红*） | 选 provider + model | | 代理说明 | 系统提示，决定它怎么工作；支持 {current_date}、{model_name} 等占位符 | | 工具 | 外部工具接入点 | | 计算器 | 内置开关（安全：只支持 + - * / **） | | 当前日期 | 内置开关 | | 处理解析错误 | 工具调用失败时自动重试（最多 2 次） |  代理说明示例：   你是一个严谨的数学助手。 遇到任何算术问题，必须调用计算器工具，绝对不要自己心算。 回答时先说明你用了什么工具，再给出结果。   效果：能看到它先调工具 → 再组织答案，这就是 Agent 的「思考→行动→观察」循环。  ## 4. 记忆：默认就有，不用加组件  > Langflow 的 语言模型 和 代理程序 组件内置了当前会话的聊天记忆，默认开启。  | 需求 | 用什么 | | --- | --- | | 同一次对话里记得前文 | 不用加，内置自带 | | 关掉 Playground 后再开还能记得 | 加 记忆库（长期记忆） |  ## 5. 常见报错与排查  ### ① Input data cannot be None  含义：某个组件的必填输入是空的 → 连线没接上或接错端口。  | 检查点 | 常见错误 | | --- | --- | | 聊天输入 → 模型 | 连到了「系统消息」而不是「输入」 | | 模型 → 聊天记录 | 聊天记录的「输入」空着 | | DeepSeek 组件的「输入」 | 必填，没连就报这个 | | 「型号名称」 | 空着 |  定位方法：点每个组件标题栏的 ▶ 试运行，报错组件的上游就是问题点。  ### ② 模型下拉是空的 / 红色星号还在  - 没选模型（红色星号 = 必填） - 或 provider 配置没保存成功  ### ③ Playground 里同一条消息显示两遍  这是显示层面的问题，AI 实际只回答一次。三个可能：  1. 画布上有两个「聊天记录」组件（每个都会显示一遍） 2. 「聊天输入」被直接连到了「聊天记录」（回显） 3. 会话历史累积（之前发过同样的话）  验证：点 Playground 右上角「新会话/New Chat」清空后只发一次。  ### ④ Connector URL must be an http(s) URL...  Base URL 框里填的是变量名（如 OPENAI_COMPATIBLE_BASE_URL）而不是真网址。 → 改成 https://api.deepseek.com。  > 报错里提到的 LANGFLOW_SSRF_ALLOWED_HOSTS 只对内网地址（如本地 Ollama）需要，公网域名不用管。  ## 6. Langflow（拖拽）vs 写代码，怎么选  | | Langflow | 写代码 | | --- | --- | --- | | 上手 | 快，可视化 | 慢一点 | | 复杂逻辑 | 难受 | 灵活 | | 调试 | 看清每一步数据流 | 要自己打日志 | | 面试价值 | 加分 | 核心 |  建议：用 Langflow 建立\"直觉\"，用代码（LangChain/LangGraph）建立\"能力\"。两者都学。  > ⚠️ 注意：Langflow 里做不了复杂的分支、循环、自定义状态机——那些必须回到代码。 > 所以 Langflow 适合\"验证想法/演示\"，真正的产品要写代码。  ## ⚠️ 易错点速记  1. 右侧圆点是输出，左侧是输入，别接反 2. 「系统消息」是写人设的，不是对话输入端口 3. 「聊天记录」是输出组件的名字（不是\"聊天输出\"） 4. 红色星号 = 必填，没填就报错 5. Base URL 里不要手写变量名，也不要重复加 /v1 6. Playground 重复显示多为显示问题，不影响结果  ## 🔗 关联  - DeepSeek 接入与 Agent 环境 → 24-Agent开发环境与DeepSeek - Agent 开发全流程 → 24-Agent开发环境与DeepSeek", "blocks": [{"type": "h", "level": 1, "text": "Langflow 基础操作", "html": "Langflow 基础操作"}, {"type": "quote", "html": "<p>一句话：Langflow 是<strong>拖拽式<\/strong>搭 AI 工作流的工具——<strong>组件 = 积木，连线 = 数据流<\/strong>。<\/p>"}, {"type": "h", "level": 2, "text": "1. 组件中文名速查（中文版界面）", "html": "1. 组件中文名速查（中文版界面）"}, {"type": "table", "rows": [["用途", "中文组件名", "备注"], ["输入", "<strong>聊天输入<\/strong>", "输出端口叫「聊天消息」"], ["输出", "<strong>聊天记录<\/strong>", "⚠️ 不是&quot;聊天输出&quot;"], ["大模型", "<strong>语言模型<\/strong> / <strong>DeepSeek<\/strong>", "二选一"], ["提示词", "<strong>提示模板<\/strong>", ""], ["智能体
