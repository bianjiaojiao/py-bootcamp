（如本地 Ollama）需要，公网域名不用管。<\/p>"}, {"type": "h", "level": 2, "text": "6. Langflow（拖拽）vs 写代码，怎么选", "html": "6. Langflow（拖拽）vs 写代码，怎么选"}, {"type": "table", "rows": [["", "Langflow", "写代码"], ["上手", "快，可视化", "慢一点"], ["复杂逻辑", "难受", "灵活"], ["调试", "看清每一步数据流", "要自己打日志"], ["面试价值", "加分", "<strong>核心<\/strong>"]]}, {"type": "p", "html": "<strong>建议<\/strong>：用 Langflow 建立&quot;直觉&quot;，用代码（LangChain/LangGraph）建立&quot;能力&quot;。两者都学。"}, {"type": "quote", "html": "<p>⚠️ 注意：Langflow 里<strong>做不了<\/strong>复杂的分支、循环、自定义状态机——那些必须回到代码。<\/p><p>所以 Langflow 适合&quot;验证想法/演示&quot;，真正的产品要写代码。<\/p>"}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["右侧圆点是<strong>输出<\/strong>，左侧是<strong>输入<\/strong>，别接反", "「系统消息」是写人设的，<strong>不是<\/strong>对话输入端口", "「聊天记录」是输出组件的名字（不是&quot;聊天输出&quot;）", "红色星号 = 必填，没填就报错", "Base URL 里<strong>不要<\/strong>手写变量名，也不要重复加 <code>/v1<\/code>", "Playground 重复显示多为显示问题，不影响结果"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["DeepSeek 接入与 Agent 环境 → <a href=\"#topic-24\" data-go=\"topic-24\">24-Agent开发环境与DeepSeek<\/a>", "Agent 开发全流程 → <a href=\"#topic-24\" data-go=\"topic-24\">24-Agent开发环境与DeepSeek<\/a>"]}]}, {"id": "topic-26", "title": "LangGraph 基础", "chapter": "第 6 章 工程", "keywords": ["LangGraph", "State", "Node", "Edge", "条件边", "循环", "StateGraph", "checkpointer", "Agent 循环"], "search": "--- title: LangGraph 基础 category: 工程 keywords: [LangGraph, State, Node, Edge, 条件边, 循环, StateGraph, checkpointer, Agent 循环] dates: [2026-10-23] ---  # LangGraph 基础  > 一句话：LangGraph = 把 Agent 的循环画成一张图——State 是流动的数据，Node 是做事，Edge 是走向。  ## 1. 为什么需要 LangGraph  create_react_agent(llm, tools) 一行就能得到 Agent，但它是个黑盒。 当你想让 Agent：  - 走分支（不同类型问题走不同流程） - 中途停下来等人确认 - 记住多轮历史 - 多个 agent 分工协作  就需要自己搭图——这就是 LangGraph。  ## 2. 四个核心概念  | 概念 | 是什么 | 类比 | | --- | --- | --- | | State | 图里流动的数据（通常是消息列表） | 传送带上的货物 | | Node | 一个函数，读 State、返回更新 | 工位（加工一下） | | Edge | 固定连线：A 之后一定走 B | 传送带 | | Conditional Edge | 按条件决定走哪条 | 岔路口的调度员 |  ## 3. 最小可用模板  python from typing import Annotated, TypedDict  from langchain_core.messages import AnyMessage from langchain_core.tools import tool from langgraph.graph import END, START, StateGraph from langgraph.graph.message import add_messages from langgraph.prebuilt import ToolNode   # ① State：流动的数据 class AgentState(TypedDict):     # Annotated + add_messages = \"新消息追加到列表\"，而不是覆盖     messages: Annotated[list[AnyMessage], add_messages]   # ② 工具 @tool def add(a: int, b: int) -> int:     \"\"\"计算两个整数之和。\"\"\"     return a + b   TOOLS = [add] llm = get_llm(temperature=0).bind_tools(TOOLS)   # 绑定工具   # ③ Node：调用模型 def agent_node(state: AgentState) -> dict:     return {\"messages\": [llm.invoke(state[\"messages\"])]}   # ④ 条件边：继续还是结束 def should_continue(state: AgentState) -> str:     last = state[\"messages\"][-1]     if getattr(last, \"tool_calls\", None):         return \"tools\"     # 要调工具     return END             # 答完了   # ⑤ 建图 g = StateGraph(AgentState) g.add_node(\"agent\", agent_node) g.add_node(\"tools\", ToolNode(TOOLS)) g.add_edge(START, \"agent\") g.add_conditional_edges(\"agent\", should_continue, {\"tools\": \"tools\", END: END}) g.add_edge(\"tools\", \"agent\")      # ← 这一条形成循环 app = g.compile()   ## 4. 图长什么样   START → agent ─┬─(有 tool_calls)→ tools ─┐                │                        │                └─(没有)→ END            │                         ↑               │                         └───────────────┘                      （tools 执行完回到 agent）   ## 5. 最关键的一行：Annotated[list, add_messages]  python class State(TypedDict):     messages: Annotated[list[AnyMessage], add_messages]   # ✅ 追加   这就是 reducer（归约器） 的概念：  | 写法 | 节点返回新消息时 | | --- | --- | | messages: list | 覆盖（历史全丢） | | messages: Annotated[list, add_messages] | 追加（保留历史） |  > Agent 之所以能\"记得上一步的工具结果\"，靠的就是这个累加。 > 这是新手最常踩的坑。  ## 6. 加了 checkpointer 才有\"记忆\"  python from langgraph.checkpoint.memory import MemorySaver  app = g.compile(checkpointer=MemorySaver())  # 调用时传 thread_id，同一个 id 就是同一个会话 config = {\"configurable\": {\"thread_id\": \"user-1\"}} app.invoke({\"messages\": [(\"user\", \"我叫小明\")]}, config) app.invoke({\"messages\": [(\"user\", \"我叫什么？\")]}, config)   # 它会记得   | 概念 | 作用 | | --- | --- | | checkpointer | 把每一步状态存下来 | | thread_id | 区分不同会话（同一 id = 同一段记忆） | | MemorySaver | 存内存（重启就没了） | | SqliteSaver | 存文件（可持久化） |  ## 7. 人工介入（Human-in-the-loop）  在关键步骤（花钱、删数据、发消息）前暂停，等人确认：  python from langgraph.types import interrupt, Command  def risky_node(state):     answer = interrupt(\"要执行删除操作，确认吗？\")   # 暂停，把问题抛给调用方     if answer != \"yes\":         return {\"messages\": [(\"ai\", \"已取消\")]}     ...   ## 8. 高级控制流（学到后期再看）  | 能力 | 用途 | | --- | --- | | Subgraph | 把复杂流程拆成子图，像函数一样复用 | | Send API | 动态并行分支（map-reduce） | | stream_mode | 流式看每一步的输出（调试神器） | | recursion_limit | 防止死循环的上限 |  ## ⚠️ 易错点速记  1. State 字段忘了 Annotated[..., add_messages] → 历史消息被覆盖，Agent 失忆 2. 条件边没有返回 END → 死循环，报递归超限 3. 节点返回值必须是 dict（要合并进 State 的键） 4. compile() 别忘，图不编译不能用 5. 没有 checkpointer + thread_id → 多轮对话记不住 6. ToolNode 要传工具列表，不是单个工具 7. 模型不绑定工具（bind_tools）就不会产生 tool_calls，循环永远走得通但没用  ## 🔗 关联  - Agent 环境与 DeepSeek → 24-Agent开发环境与DeepSeek - Langflow 对照 → 25-Langflow基础操作 - 工具定义（装饰器）→ 18-闭包 - 长篇规划 → LangChain + LangGraph 完全掌握路线 - 实践脚本 → agent-lab/05_langgraph_agent.py", "blocks": [{"type": "h", "level": 1, "text": "LangGraph 基础", "html": "LangGraph 基础"}, {"type": "quote", "html": "<p>一句话：<strong>LangGraph = 把 Agent 的循环画成一张图<\/strong>——State 是流动的数据，Node 是做事，Edge 是走向。<\/p>"}, {"type": "h", "level": 2, "text": "1. 为什么需要 LangGraph", "html": "1. 为什么需要 LangGraph"}, {"type": "p", "html": "<code>create_react_agent(llm, tools)<\/code> 一行就能得到 Agent，但它是个<strong>黑盒<\/strong>。 当你想让 Agent："}, {"type": "ul", "items": ["走<strong>分支<\/strong>（不同类型问题走不同流程）", "中途<strong>停下来等人确认<\/strong>", "记住<strong>多轮历史<\/strong>", "多个 agent <strong>分工协作<\/strong>"]}, {"type": "p", "html": "就需要自己搭图——这就是 LangGraph。"}, {"type": "h", "level": 2, "text": "2. 四个核心概念", "html": "2. 四个核心概念"}, {"type": "table", "rows": [["概念", "是什么", "类比"], ["<stron 最关键的一行：Annotated[list, add_messages]", "html": "5. 最关键的一行：<code>Annotated[list, add_messages]<\/code>"}, {"type": "code", "lang": "python", "text": "class State(TypedDict):\n    messages: Annotated[list[AnyMessage], add_messages]   # ✅ 追加"}, {"type": "p", "html": "这就是 <strong>reducer（归约器）<\/strong> 的概念："}, {"type": "table", "rows": [["写法", "节点返回新消息时"], ["<code>messages: list<\/code>", "<strong>覆盖<\/strong>（历史全丢）"], ["<code>messages: Annotated[list, add_messages]<\/code>", "<strong>追加<\/strong>（保留历史）"]]}, {"type": "quote", "html": "<p>Agent 之所以能&quot;记得上一步的工具结果&quot;，靠的就是这个累加。<\/p><p>这是新手最常踩的坑。<\/p>"}, {"type": "h", "level": 2, "text": "6. 加了 checkpointer 才有\"记忆\"", "html": "6. 加了 checkpointer 才有&quot;记忆&quot;"}, {"type": "code", "lang": "python", "text": "from langgraph.checkpoint.memory import MemorySaver\n\napp = g.compile(checkpointer=MemorySaver())\n\n# 调用时传 thread_id，同一个 id 就是同一个会话\nconfig = {\"configurable\": {\"thread_id\": \"user-1\"}}\napp.invoke({\"messages\": [(\"user\", \"我叫小明\")]}, config)\napp.invoke({\"messages\": [(\"user\", \"我叫什么？\")]}, config)   # 它会记得"}, {"type": "table", "rows": [["概念", "作用"], ["<code>checkpointer<\/code>", "把每一步状态存下来"], ["<code>thread_id<\/code>", "区分不同会话（同一 id = 同一段记忆）"], ["<code>MemorySaver<\/code>", "存内存（重启就没了）"], ["<code>SqliteSaver<\/code>", "存文件（可持久化）"]]}, {"type": "h", "level": 2, "text": "7. 人工介入（Human-in-the-loop）", "html": "7. 人工介入（Human-in-the-loop）"}, {"type": "p", "html": "在关键步骤（花钱、删数据、发消息）前暂停，等人确认："}, {"type": "code", "lang": "python", "text": "from langgraph.types import interrupt, Command\n\ndef risky_node(state):\n    answer = interrupt(\"要执行删除操作，确认吗？\")   # 暂停，把问题抛给调用方\n    if answer != \"yes\":\n        return {\"messages\": [(\"ai\", \"已取消\")]}\n    ..."}, {"type": "h", "level": 2, "text": "8. 高级控制流（学到后期再看）", "html": "8. 高级控制流（学到后期再看）"}, {"type": "table", "rows": [["能力", "用途"], ["<strong>Subgraph<\/strong>", "把复杂流程拆成子图，像函数一样复用"], ["<strong>Send API<\/strong>", "动态并行分支（map-reduce）"], ["<strong>stream_mode<\/strong>", "流式看每一步的输出（调试神器）"], ["<strong>recursion_limit<\/strong>", "防止死循环的上限"]]}, {"type": "h", "level": 2, "text": "⚠️ 易错点速记", "html": "⚠️ 易错点速记"}, {"type": "ol", "items": ["<strong>State 字段忘了 <code>Annotated[..., add_messages]<\/code><\/strong> → 历史消息被覆盖，Agent 失忆", "<strong>条件边没有返回 <code>END<\/code><\/strong> → 死循环，报递归超限", "<strong>节点返回值必须是 dict<\/strong>（要合并进 State 的键）", "<strong><code>compile()<\/code> 别忘<\/strong>，图不编译不能用", "<strong>没有 <code>checkpointer<\/code> + <code>thread_id<\/code><\/strong> → 多轮对话记不住", "<strong><code>ToolNode<\/code> 要传工具列表<\/strong>，不是单个工具", "模型不绑定工具（<code>bind_tools<\/code>）就不会产生 <code>tool_calls<\/code>，循环永远走得通但没用"]}, {"type": "h", "level": 2, "text": "🔗 关联", "html": "🔗 关联"}, {"type": "ul", "items": ["Agent 环境与 DeepSeek → <a href=\"#topic-24\" data-go=\"topic-24\">24-Agent开发环境与DeepSeek<\/a>", "Langflow 对照 → <a href=\"#topic-25\" data-go=\"topic-25\">25-Langflow基础操作<\/a>", "工具定义（装饰器）→ <a href=\"#topic-18\" data-go=\"topic-18\">18-闭包<\/a>", "长篇规划 → <a href=\"#plan-02\" data-go=\"plan-02\">LangChain + LangGraph 完全掌握路线<\/a>", "实践脚本 → <code>agent-lab/05_langgraph_agent.py<\/code>"]}]}, {"id": "daily-01", "title": "2026-10-28 学习记录", "chapter": "第 7 章 每日记录", "keywords": [], "search": "--- title: 2026-10-28 学习记录 date: 2026-10-28 topics: [RAG 项目化, course-rag, 工程结构] summary: 把 RAG 从脚本升级成项目 course-rag（模块化 + 索引缓存 + 阈值拒答），建索引 501 片段、问答验证通过、git 初始化完成 ---  # 2026-10-28（周二）学习记录  > 今日主题：RAG 项目化 —— course-rag 第一个作品诞生 > 笔记来源：今日实践记录（无新截图）  ## ✅ 今日完成  ### 一、course-rag 项目从零搭起来  位置：C:\\Users\\边角\\Desktop\\course-rag\\（独立项目，与 agent-lab 分开）   course-rag/ ├── config.py            # 读 .env、创建 DeepSeek 模型 ├── build_index.py       # 建索引（读 → 切 → 向量化 → 存盘） ├── ask.py               # 提问（交互模式 / 单次提问） ├── rag/ │   ├── loader.py        # 读 Markdown，去掉 YAML 元信息（dataclass Doc） │   ├── splitter.py      # 按段落切分 + 重叠 │   ├── store.py         # 向量库（Chunk / Hit / VectorStore） │   └── qa.py            # RAG 问答（Answer / RAG 类） ├── data/index.npz       # 索引缓存（gitignore） ├── .env / .env.example  # 密钥（.env 被忽略，模板提交） ├── requirements.txt └── README.md   比脚本版的三个进步：  | 改进 | 好处 | | --- | --- | | 拆成 5 个模块 | 每块职责单一，看得懂、改得动 | | 索引缓存到 data/index.npz | 建一次（2.7 秒）用多次，提问不用重新向量化 | | 交互式提问 | python ask.py 可以连续问，q 退出 |  ### 二、实测数据  | 指标 | 数值 | | --- | --- | | 笔记数 | 27 篇 | | 切分片段 | 501 个（200 字/段） | | 向量维度 | 512 | | 索引体积 | 1.0 MB | | 建库耗时 | 2.7 秒 |  问答验证：  | 提问 | 结果 | | --- | --- | | 线程和进程有什么区别？ | ✅ 输出对比表格（是什么/内存/开销/通信/GIL），出处 17-线程与进程.md | | 明天天气怎么样 | ✅ 拒答（最高相似度 0.316 < 阈值 0.45） |  ### 三、四个关键设计决策（写进 README 了）  1. 阈值拒答（0.45）：相关 0.65~0.72 / 无关 0.28~0.36，能干净分开 → 宁愿说不知道 2. top-k = 6：第一名的片段不一定是真答案（实测 frozen 那次真正的答案排第 4~6） 3. 片段加《标题》前缀：加之前 frozen 片段排 24/39/96 名，加之后进 top-3 4. 切分 200 字 + 40 重叠：400 字时细节被\"平均\"掉  ### 四、Git 初始化  - 提交 e43545c：12 个文件，646 行 - .env 和 data/ 已被 .gitignore 排除（用 git check-ignore 验证过） - 修了一个坑：.env.* 会把 .env.example 也排除 → 加 !.env.example 白名单  ## 📚 今日知识点  | 主题 | 一句话要点 | | --- | --- | | 工程化第一步 | 把脚本拆成模块：一个文件只干一件事，主流程只做编排 | | 索引缓存 | 向量化很贵，结果存磁盘（.npz），下次直接 load | | .gitignore 白名单 | .env.* 会连 .env.example 一起忽略，要用 !.env.example 反选回来 | | 项目 vs 脚本 | 脚本求\"跑通\"; 项目求\"别人能装、能跑、能改\"（README + requirements + .env.example） |  ## ⚠️ 今日易错点  1. .gitignore 写 .env.* 会误伤模板文件，必须加 !.env.example 2. 索引缓存文件不要提交（体积 + 每个人的笔记不同）→ data/ 进 gitignore 3. pip install sentence-transformers 会拖 2.5GB torch → 用 fastembed（ONNX） 4. 国内下模型记得设 HF_ENDPOINT=https://hf-mirror.com  ## 📌 明日计划  - [ ] 把 course-rag 推到 GitHub（需要先在网页上建仓库，不要初始化 README） - [ ] 加几个\"评估问题\"，手测命中率（比如 10 个问题，看几个命中正确笔记） - [ ] 进阶：混合检索（向量 + 关键词），看能否改善 top-1 - [ ] 顺路还债：阶段测验 7~18 题  ## 🔗 相关  - 项目：course-rag/README.md - 全流程总览：2026-10-27-学习全流程总览 - 昨日：2026-10-27 学习记录 - 索引：INDEX.md", "blocks": [{"type": "h", "level": 1, "text": "2026-10-28（周二）学习记录", "html": "2026-10-28（周二）学习记录"}, {"type": "quote", "html": "<p><strong>今日主题<\/strong>：RAG 项目化 —— <code>course-rag<\/code> 第一个作品诞生<\/p><p><strong>笔记来源<\/strong>：今日实践记录（无新截图）<\/p>"}, {"type": "h", "level": 2, "text": "✅ 今日完成", "html": "✅ 今日完成"}, {"type": "h", "level": 3, "text": "一、cours  + bge-small-zh），RAG 第一步检索验证成功 ---  # 2026-10-27（周一）学习记录  > 今日主题：LangGraph 三大能力收尾（记忆 / 人工确认 / 流式）+ 进 RAG > 笔记来源：今日实践记录（无新截图）  ## ✅ 今日完成  ### 一、LangGraph 三个填空，全部通过  | 填空 | 学到什么 | 结果 | | --- | --- | --- | | 06b_memory_填空.py | 记忆三件套：Annotated[..., add_messages] + checkpointer + thread_id | ✅ 会话 A 记得\"小明 20 岁\"，会话 B 失忆 | | 07b_interrupt_填空.py | 人工确认两次调用：interrupt() 暂停 → Command(resume=...) 恢复 | ✅ 第一次返回 __interrupt__，第二次执行成功 | | 08_stream_填空.py | 流式：llm.stream() 逐字吐；app.stream(stream_mode=...) 看每步 | ✅ updates / values 两种模式都正确 |  > C 阶段（LangChain 核心）正式 100% 完成 🎉 > 循环 → 记忆 → 人工确认 → 流式，四件套集齐。  ### 二、两份总览文档  | 文档 | 内容 | | --- | --- | | 学习全流程总览 | 九个阶段 A~I + 进度条 + 时间估算 + 6 个里程碑 | | 必背速记卡 | 要背的精华：4 个 Python 语法 + 5 模板 + 27 关键词 + 6 骨架 + 10 条真理 + 自测题 |  ### 三、RAG 环境搭好（关键突破）  问题：DeepSeek 没有 embedding 接口，RAG 的\"向量化\"这一步缺工具。  解决：  | 项 | 方案 | 结果 | | --- | --- | --- | | 向量化库 | fastembed 0.9.1（ONNX，不用装 torch，省 2.5GB） | ✅ 安装成功 | | 中文模型 | BAAI/bge-small-zh-v1.5（512 维 / 90MB） | ✅ 走 hf-mirror 5 秒下完 | | 语义验证 | 「进程线程区别」vs「线程共享内存」= 0.6907；vs「天气很好」= 0.2786 | ✅ 语义区分正确 |  ### 四、RAG 第一步：用自己笔记做检索 ✅  09_rag_step1.py：27 篇笔记 → 223 个片段 → 每段 512 维向量 → 余弦相似度检索  | 提问 | Top-1 命中 | 分数 | | --- | --- | --- | | 线程和进程有什么区别？ | 17-线程与进程.md | 0.678 ✅ | | 闭包是什么？ | 18-闭包.md | 0.668 ✅ | | 怎么用 dataclass 让对象不可变？ | 15-类属性(0.678) → 23-dataclass(0.662) | ⚠️ 第 2 名才对 | | 今天中午吃什么 | 最高 0.360 | ✅ 正确表示\"无相关资料\" |  从数字里学到的 3 件事：  1. 相似度阈值：0.6+ 相关 / 0.3 左右无关 → 生产系统设阈值，低于就答\"没有相关资料\" 2. 必须取 top-k 而不是 top-1：dataclass 那题第 1 名错了，第 2 名才对，取前 3 条一起喂模型就能兜住 3. RAG 的全部秘密：问题 → 向量 → 和所有片段比相似度 → 取最像的几段 → 拼进提示词  ### 五、RAG 第二步：完整问答 ✅（含一次真实排错）  10_rag_step2.py = 检索 + 生成。四道测试题全对：  | 提问 | 回答质量 | | --- | --- | | 线程和进程有什么区别？ | ✅ 完整对比（内存/开销/通信/GIL），出处 17-线程与进程.md | | 闭包是什么？ | ✅ 三条件 + nonlocal 要点，出处 18-闭包.md | | 怎么用 dataclass 让对象不可变？ | ✅ 答出 frozen=True，出处 23-dataclass.md（修复后） | | 今天中午吃什么 | ✅ 主动拒答「我的笔记里没有相关内容」 |  排错实录（今天最值钱的经验）  | 步骤 | 现象 | 诊断 | | --- | --- | --- | | ① 初版 | 第 3 题答\"没有相关内容\"，但其实笔记里有 | 检索没命中真正讲 frozen 的片段 | | ② 查排名 | 含 frozen 的 5 个片段排在第 24 / 39 / 96 名 | 向量检索是粗排，不保证精确命中细节 | | ③ 调小 chunk（400→200） | 没有改善，分数全挤在 0.65~0.70 | 小模型分辨不出\"概览\"和\"细节\"，相邻主题互相打架 | | ④ 给片段加标题（《23-dataclass》 前缀） | frozen 片段冲进 top-3 | 片段自带主题标签后，主题归属清楚了 | | ⑤ 定稿：chunk 200 + 标题前缀 + k=6 | 四题全对 | ✅ |  学到的规律：  1. RAG 出问题，先怀疑检索，别怀疑模型 2. 向量检索只能\"粗排\"，真正精确命中要靠：加标题前缀 / 混合检索（关键词+向量）/ rerank 模型 3. top-k 要够大（3 太小，6 才稳），因为好片段经常排在第 3~6 名 4. 必须设相似度阈值（0.45）：低于就答\"没有资料\"，这才是诚实，也避免幻觉    ### 六、语法体能训练上线（踩坑实录）  发现问题：\"看得懂解析，但自己写不出来\" —— 识别能力有了，产出能力没练过。  解决办法：新增 agent-lab/drills/ 训练场，不看资料直接写 + 脚本自动判分（12 个 assert）。  drills/01_语法体能.py 第一次做：12 关里 7 关有错，修完后 12/12 全绿。  错误归纳（详见 错题本）：  | 类型 | 典型错误 | | --- | --- | | 语法 | 缺冒号 ×5、TypeDict 拼错、Tab 与空格混用、IDE 自动导入垃圾（from curses import wrapper） | | 概念 | for i in nums 里 i 是元素不是下标、TypedDict 不能 () 实例化、装饰器 return wrapper() 多加括号、self 用错 |  高频错误 Top 3：缺冒号 / 参数个数对不上 / self 用错。    ## 📚 今日知识点  | 主题 | 一句话要点 | | --- | --- | | 记忆三件套 | 累加（Annotated）+ 存档（checkpointer）+ 会话（thread_id），缺一不可 | | interrupt 机制 | 两次调用：第一次跑到 interrupt() 暂停返回 __interrupt__；第二次 Command(resume=值) 从暂停处继续。必须靠 checkpointer 存中间状态 | | 流式两种 | llm.stream() 逐字吐（体验）；app.stream(stream_mode=\"updates\"/\"values\") 看每步（调试） | | embedding | 把文字变成一串数字（向量），语义相近的向量\"距离\"近 | | 余弦相似度 | 算两个向量\"像不像\"，范围 -1~1，越大越像 | | chunk（切分） | 模型一次看不了太长，所以要切成小段，每段单独向量化 |  ## ⚠️ 今日易错点  1. interrupt 少了 checkpointer → 暂停后无法恢复（中间状态没地方存） 2. Command(resume=...) 是第二次调用用的，不是第一次 3. app.get_state(config).next 可以看\"图停在哪一步\" 4. 只取 top-1 做 RAG → 检索错一次就全错，必须 top-k（3~5） 5. 忘记设相似度阈值 → 无关问题也会硬凑一段资料给模型  ## 📌 明日计划  - [ ] 跑 09_rag_step1.py / 10_rag_step2.py，换成自己关心的问题看效果 - [ ] 把 RAG 整理成 course-rag 项目（独立文件夹 + README + 引用出处 + 演示截图） - [ ] 进阶尝试：混合检索（关键词 + 向量）或 rerank，看能否把 top-1 命中率提上去 - [ ] 顺路还债：阶段测验 7~18 题  ## 🔗 相关  - 学习全流程总览（当前进度 40%，C 阶段已 100%） - 必背速记卡 - LangChain 完全参考手册 - 前一天：2026-10-26 学习记录 - 知识点索引：INDEX.md", "blocks": [{"type": "h", "level": 1, "text": "2026-10-27（周一）学习记录", "html": "2026-10-27（周一）学习记录"}, {"type": "quote", "html": "<p><strong>今日主题<\/strong>：LangGraph 三大能力收尾（记忆 / 人工确认 / 流式）+ 进 RAG<\/p><p><strong>笔记 大<\/strong>（3 太小，6 才稳），因为好片段经常排在第 3~6 名", "<strong>必须设相似度阈值<\/strong>（0.45）：低于就答&quot;没有资料&quot;，这才是诚实，也避免幻觉"]}, {"type": "h", "level": 3, "text": "六、语法体能训练上线（踩坑实录）", "html": "六、语法体能训练上线（踩坑实录）"}, {"type": "p", "html": "发现问题：<strong>&quot;看得懂解析，但自己写不出来&quot;<\/strong> —— 识别能力有了，产出能力没练过。"}, {"type": "p", "html": "解决办法：新增 <code>agent-lab/drills/<\/code> 训练场，<strong>不看资料直接写 + 脚本自动判分<\/strong>（12 个 assert）。"}, {"type": "p", "html": "<code>drills/01_语法体能.py<\/code> 第一次做：<strong>12 关里 7 关有错<\/strong>，修完后 12/12 全绿。"}, {"type": "p", "html": "错误归纳（详见 <span class=\"deadlink\" title=\"源文件：langchain/06-错题本.md\">错题本<\/span>）："}, {"type": "table", "rows": [["类型", "典型错误"], ["语法", "缺冒号 ×5、<code>TypeDict<\/code> 拼错、Tab 与空格混用、IDE 自动导入垃圾（<code>from curses import wrapper<\/code>）"], ["概念", "<code>for i in nums<\/code> 里 i 是<strong>元素<\/strong>不是下标、TypedDict 不能 <code>()<\/code> 实例化、装饰器 <code>return wrapper()<\/code> 多加括号、<code>self<\/code> 用错"]]}, {"type": "p", "html": "<strong>高频错误 Top 3<\/strong>：缺冒号 / 参数个数对不上 / <code>self<\/code> 用错。"}, {"type": "h", "level": 2, "text": "📚 今日知识点", "html": "📚 今日知识点"}, {"type": "table", "rows": [["主题", "一句话要点"], ["记忆三件套", "累加（<code>Annotated<\/code>）+ 存档（<code>checkpointer<\/code>）+ 会话（<code>thread_id<\/code>），缺一不可"], ["interrupt 机制", "<strong>两次调用<\/strong>：第一次跑到 <code>interrupt()<\/code> 暂停返回 <code>__interrupt__<\/code>；第二次 <code>Command(resume=值)<\/code> 从暂停处继续。<strong>必须靠 checkpointer 存中间状态<\/strong>"], ["流式两种", "<code>llm.stream()<\/code> 逐字吐（体验）；<code>app.stream(stream_mode=&quot;updates&quot;/&quot;values&quot;)<\/code> 看每步（调试）"], ["embedding", "把文字变成一串数字（向量），语义相近的向量&quot;距离&quot;近"], ["余弦相似度", "算两个向量&quot;像不像&quot;，范围 -1~1，越大越像"], ["chunk（切分）", "模型一次看不了太长，所以要切成小段，每段单独向量化"]]}, {"type": "h", "level": 2, "text": "⚠️ 今日易错点", "html": "⚠️ 今日易错点"}, {"type": "ol", "items": ["<code>interrupt<\/code> 少了 <code>checkpointer<\/code> → 暂停后无法恢复（中间状态没地方存）", "<code>Command(resume=...)<\/code> 是<strong>第二次调用<\/strong>用的，不是第一次", "<code>app.get_state(config).next<\/code> 可以看&quot;图停在哪一步&quot;", "只取 top-1 做 RAG → 检索错一次就全错，必须 top-k（3~5）", "忘记设相似度阈值 → 无关问题也会硬凑一段资料给模型"]}, {"type": "h", "level": 2, "text": "📌 明日计划", "html": "📌 明日计划"}, {"type": "ul", "items": ["☐ 跑 <code>09_rag_step1.py<\/code> / <code>10_rag_step2.py<\/code>，换成自己关心的问题看效果", "☐ 把 RAG 整理成 <code>course-rag<\/code> 项目（独立文件夹 + README + 引用出处 + 演示截图）", "☐ 进阶尝试：混合检索（关键词 + 向量）或 rerank，看能否把 top-1 命中率提上去", "☐ 顺路还债：阶段测验 7~18 题"]}, {"type": "h", "level": 2, "text": "🔗 相关", "html": "🔗 相关"}, {"type": "ul", "items": ["<a href=\"#plan-01\" data-go=\"plan-01\">学习全流程总览<\/a>（当前进度 40%，C 阶段已 100%）", "<span class=\"deadlink\" title=\"源文件：langchain/05-必背速记卡.md\">必背速记卡<\/span>", "<span class=\"deadlink\" title=\"源文件：langchain/01-LangChain完全参考手册.md\">LangChain 完全参考手册<\/span>", "前一天：<a href=\"#daily-03\" data-go=\"daily-03\">2026-10-26 学习记录<\/a>", "知识点索引：<a href=\"#index\" data-go=\"index\">INDEX.md<\/a>"]}]}, {"id": "daily-03", "title": "2026-10-26 学习记录", "chapter": "第 7 章 每日记录", "keywords": [], "search": "--- title: 2026-10-26 学习记录 date: 2026-10-26 topics: [Annotated, LangChain 语法, 读代码方法] summary: 线 B 全部 7 题跑通（20 题全部完成）；发现\"能填空但不认识关键词\"的缺口，补交付关键词表 + 逐行拆解；新增 Annotated 专题 ---  # 2026-10-26（周日）学习记录  > 今日主题：LangChain 7 题收尾 + 补\"关键词/语法理解\"这一课 > 笔记来源：今日实践记录（无新截图）  ## ✅ 今日完成  ### 一、线 B（LangChain 7 题）全部跑通  | 文件 | 对应 | 运行结果 | | --- | --- | --- | | 01.py | L1 invoke + L2 提示词模板 | ✅ 两次调用成功，人设生效 | | 03.py | L3 LCEL 管道 | ✅ 打印 TextAccessor + 纯文本 | | 04.py | L4 工具 | ✅ tool_calls 正确输出 | | 05.py | L5 结构化输出 | ✅ 流浪地球 2019 | | 06.py | L6 最小图 | ✅ 正常回答 | | 07.py | L7 工具循环 | ✅ 123 + 456 = 579 |  > 20 道练习（线 A 13 + 线 B 7）全部写完。  ### 二、发现并补上\"理解缺口\"（今日重点）  问题：题能填对，但 import、函数调用、类/常量分不清 —— 只会\"放关键词\"，不懂\"关键词是什么\"。  交付两份材料：  | 材料 | 内容 | | --- | --- | | 01-LangChain完全参考手册 | 两张全景图 + 40 个词的人话解释 + 读代码三遍法 | | 02-逐行拆解-07 | 6 行 import 逐个拆（类/函数/常量）+ 5 个代码模板 + 逐行讲解 + 注释点评 |  核心认知（今日最大收获）：  > LangChain 代码 90% 的行逃不出 5 种模板： > ① 名字 = 类(参数) 创建对象 > ② 对象.方法(参数) 让对象做事 > ③ 链式调用 a().b() > ④ 对象 | 对象 管道 > ⑤ @装饰器 加工函数  另一个关键：Python 代码的执行入口在最后几行，所以要\"从下往上读\"，而不是从头念。  ### 三、自评：07.py 注释 2.5 / 5  | 注释 | 判定 | | --- | --- | | #工具列表 | ✅ | | #bind_tools 告诉大模型这是我的工具…温度0 | ✅ 很准 | | #画图 | ✅ | | #继承字典类，TypeDict; Annotated,调用add_messages函数 | ⚠️ 半对：TypedDict 是声明键不是继承；add_messages 没被调用，只是标签 | | #调用sg函数 | ⚠️ StateGraph 是类，StateGraph(State) 是创建空图 |  ## 📚 今日知识点  | 主题 | 一句话要点 | | --- | --- | | Annotated（类型标签） | Annotated[类型, 标签] 给类型挂元数据，运行时不改变行为；Annotated[list, add_messages] 里的 add_messages 是标签不是调用 | | import 的本质 | from 包.模块 import 名字 = 把名字搬进来，不执行业务逻辑 | | 类 / 函数 / 常量的区别 | 类可 X() 创建；函数可 f() 调用；常量直接使用不能加括号 | | 节点函数的约定 | 节点不直接改 state，而是 return {\"键\": 新值}，由 LangGraph 合并 |  ## ⚠️ 今日易错点  1. Annotated[list, add_messages] 里 add_messages 没有括号——不是调用，是贴标签 2. g.add_node(\"agent\", agent) 的两个 agent：前一个是字符串名字，后一个是函数对象 3. TypedDict 不是\"继承字典类\"，是声明这个字典有哪些键，运行时仍是普通 dict 4. StateGraph 是类（要 StateGraph(State) 创建），不是函数 5. 读陌生代码要从下往上（执行入口在最后）  ## 📌 明日计划  - [ ] 用\"逐行拆解-07.md\"重读 07.py，确认每个 import 都知道是什么类型 - [ ] 把 01.py~07.py 逐个用\"5 个代码模板\"标注一遍 - [ ] 回归阶段 3：给 LangGraph 加 checkpointer 实现跨轮记忆（06_memory_agent.py） - [ ] 修线 A 遗留的 6 处 bug - [ ] 更新本日志 + python notes/tools/build_index.py  ## 🔗 相关  - LangChain 独立专区：notes/langchain/README.md - 关键词表：01-LangChain完全参考手册 - 逐行拆解：02-逐行拆解-07 - 前一天：2026-10-25 学习记录 - 知识点总索引：INDEX.md", "blocks": [{"type": "h", "level": 1, "text": "2026-10-26（周日）学习记录", "html": "2026-10-26（周日）学习记录"}, {"type": "quote", "html": "<p><strong>今日主题<\/strong>：LangChain 7 题收尾 + 补&quot;关键词/语法理解&quot;这一课<\/p><p><strong>笔记来源<\/strong>：今日实践记录（无新截图）<\/p>"}, {"type": "h", "level": 2, "text": "✅ 今日完成", "html": "✅ 今日完成"}, {"type": "h", "level": 3, "text": "一、线 B（LangChain 7 题）全部跑通", "html": "一、线 B（LangChain 7 题）全部跑通"}, {"type": "table", "rows": [["文件", "对应", "运行结果"], ["<code>01.py<\/code>", "L1 invoke + L2 提示词模板", "✅ 两次调用成功，人设生效"], ["<code>03.py<\/code>", "L3 LCEL 管道", "✅ 打印 <code>TextAccessor<\/code> + 纯文本"], ["<code>04.py<\/code>", "L4 工具", "✅ <code>tool_calls<\/code> 正确输出"], ["<code>05.py<\/code>", "L5 结构化输出", "✅ <code>流浪地球 2019<\/code>"], ["< de>return result<\/code>，否则被装饰函数&quot;返回值消失&quot;"], ["TypedDict 的本质", "运行时<strong>完全不校验<\/strong>，只是给编辑器看的类型提示 → <strong>能跑通 ≠ 写对了<\/strong>"], ["Annotated 的本质", "<code>Annotated[list, add_messages]<\/code> = 给 list 贴一个&quot;累加函数&quot;标签"]]}, {"type": "h", "level": 2, "text": "⚠️ 今日易错点", "html": "⚠️ 今日易错点"}, {"type": "ol", "items": ["<code>apply(func, values)<\/code> 要<strong>遍历<\/strong>，不是把整个列表传进去", "装饰器忘了 <code>return result<\/code> → 原函数返回值丢失", "IDE 自动导入的垃圾 import（如 <code>from pygame import key<\/code>）要删掉", "<code>field(default_factory=...)<\/code> 必须先 <code>from dataclasses import field<\/code>", "TypedDict 写错键<strong>不报错<\/strong>，只有编辑器画红线", "括号不加（<code>read(text:UserText)-&gt;str:<\/code> 缺 <code>def<\/code>）→ SyntaxError"]}, {"type": "h", "level": 2, "text": "📌 明日计划", "html": "📌 明日计划"}, {"type": "ul", "items": ["☐ 线 B：L1~L3（读 B1/B2/B3 → 做 L1/L2/L3）", "☐ 线 B：L4~L5（工具、结构化输出）", "☐ 线 B：L6~L7（建图、工具循环）", "☐ 统一修线 A 的 6 处 bug", "☐ 重做 <code>05b_填空练习.py<\/code>（检验语法关是否通过）"]}, {"type": "h", "level": 2, "text": "🔗 相关", "html": "🔗 相关"}, {"type": "ul", "items": ["⭐ LangChain 专区（独立）：<span class=\"deadlink\" title=\"源文件：langchain/README.md\">notes/langchain/README.md<\/span>", "练习材料：<a href=\"../../../agent-lab/basics/\" target=\"_blank\" rel=\"noopener\">agent-lab/basics/<\/a>", "长篇规划：<a href=\"#plan-02\" data-go=\"plan-02\">LangChain + LangGraph 完全掌握路线<\/a>", "前一天：<a href=\"#daily-05\" data-go=\"daily-05\">2026-10-23 学习记录<\/a>", "知识点总索引：<a href=\"#index\" data-go=\"index\">INDEX.md<\/a>"]}]}, {"id": "daily-05", "title": "2026-10-23 学习记录", "chapter": "第 7 章 每日记录", "keywords": [], "search": "--- title: 2026-10-23 学习记录 date: 2026-10-23 topics: [Agent 开发环境与 DeepSeek, LangGraph 基础] summary: 代码路线全打通（01~04 全部跑通），结构化输出踩到 DeepSeek 不支持 json_schema 的坑并修复；LangGraph 首图脚本已给出但未跑通（待排查） ---  # 2026-10-23（周五）学习记录  > 今日主题：代码路线跑通（调用模型 / 提示词 / 结构化输出 / 工具 Agent）+ LangGraph 首个状态图 > 笔记来源：今日实践记录（无新截图，新建 DOC 文档.doc 未更新）  ## ✅ 今日完成  ### 一、代码路线（agent-lab）全部跑通  - [x] 环境自检 00_check.py：5 个依赖 + API Key + 真实调用 DeepSeek，三项全绿 - [x] 01_hello_llm.py：第一次调用模型，看到 usage_metadata 的 token 用量 - [x] 02_chain.py：LCEL 管道 prompt | model | parser，同一条链复用问两个问题 - [x] 03_tool_agent.py：工具 Agent，看到「调用工具 → 工具结果 → 最终回答」的轨迹 - [x] 动手实验：把 question 改成只问字数，验证模型自动从 add 换成 word_count       → 亲眼确认「Agent 自己判断该用哪个工具」 - [x] 04_structured.py：结构化输出，让模型返回真正的 Movie 对象（能直接 .title 取值）  ### 二、踩坑并修复（重要）  - [x] 04_structured.py 报错：This response_format type is unavailable now   - 原因：新版 with_structured_output() 默认发 response_format: json_schema，而 DeepSeek 只支持 json_object   - 修复：加 method=\"function_calling\"，走函数调用   - 修复后实测通过：返回 Movie(title=星际穿越, year=2014, genre=科幻, rating=9.4)  - [x] cmd / PowerShell 的差异：PowerShell 里运行当前目录程序必须加 .\\，cmd 不用  ### 三、LangGraph 首个状态图（⚠️ 未跑通）  - [x] 理解了 LangGraph 的 4 个核心概念：State / Node / Edge / Conditional Edge - [x] 写出了 05_langgraph_agent.py（手动搭出 agent → tools → agent 的循环） - [ ] 尚未跑通 → 明日第一件事  ### 四、Langflow（可视化路线）  - [x] 练习 1 最小对话回路 ✅ - [x] 练习 2 提示模板设人设 ✅ - [x] 练习 3 代理程序 + 计算器 ✅（此前已完成，今天为复习确认） - [x] 搞懂了「左进右出」的连线规则，以及 Input data cannot be None 的排查方法  ## 📚 今日知识点  | 主题 | 一句话要点 | | --- | --- | | LangGraph 基础 | State（流动的数据）+ Node（做事的函数）+ Edge（连线）+ 条件边（决定走哪） | | Agent 开发环境与 DeepSeek | DeepSeek 是部分 OpenAI 兼容：支持 function calling，不支持 json_schema | | Langflow 基础操作 | 组件=积木，连线=数据流，左进右出 |  ## 🔍 今日作业体检  - 阶段测验 exercises/作业111/：仍为 1~6 题（未新增）  ## ⚠️ 今日易错点（快查）  1. DeepSeek 不支持 json_schema → 结构化输出必须 method=\"function_calling\" 2. PowerShell 要加 .\\ 才能运行当前目录的程序；cmd 不需要 3. LangGraph 的 State 里，消息字段要写 Annotated[list, add_messages]，否则新消息会覆盖旧消息 4. 条件边必须明确返回 END，否则死循环（递归超限） 5. 05_langgraph_agent.py 还没跑通，明天要先定位报错  ## 📌 明日计划  - [ ] 定位并跑通 05_langgraph_agent.py（把报错发我） - [ ] 给 LangGraph 图加 checkpointer，实现跨轮记忆 - [ ] 开始阶段 1：消息体系 + LCEL 深入（RunnableParallel / RunnablePassthrough） - [ ] 更新本日志 + 运行 python notes/tools/build_index.py  ## 🔗 相关  - ⭐ 长远规划：LangChain + LangGraph 完全掌握路线 - 前一天：2026-10-22 学习记录 - Agent 项目：agent-lab 说明 - 知识点总索引：INDEX.md", "blocks": [{"type": "h", "level": 1, "text": "2026-10-23（周五）学习记录", "html" =\"plan-02\">LangChain + LangGraph 完全掌握路线<\/a>", "前一天：<a href=\"#daily-06\" data-go=\"daily-06\">2026-10-22 学习记录<\/a>", "Agent 项目：<span class=\"deadlink\" title=\"源文件：../../../agent-lab/README.md\">agent-lab 说明<\/span>", "知识点总索引：<a href=\"#index\" data-go=\"index\">INDEX.md<\/a>"]}]}, {"id": "daily-06", "title": "2026-10-22 学习记录", "chapter": "第 7 章 每日记录", "keywords": [], "search": "--- title: 2026-10-22 学习记录 date: 2026-10-22 topics: [dataclass, Agent 开发环境与 DeepSeek, Langflow 基础操作] summary: dataclass 深入（类型注解必须、frozen、field(init=False)、__post_init__ 校验）+ 搭好 Agent 开发环境（LangChain 1.4.7 / LangGraph 1.2.16）+ Langflow 完成 DeepSeek 接入并跑通前三个流程 ---  # 2026-10-22（周四）学习记录  > 今日主题：① dataclass 深入 ② Agent 开发环境搭建（LangChain / LangGraph）③ Langflow 接入 DeepSeek + 三个入门流程 > 笔记来源：新建 DOC 文档.doc（累积文档，共 70 张截图；前 66 张已转写，本次新增 4 张）+ 今日实践记录 → 原始转写归档于 source/2026-10-22/  ## ✅ 今日完成  ### 一、dataclass 深入（4 张截图）  - [x] 类型注解是必须的：name: str 是字段声明（进 __init__），name = '默认值' 是类属性（不进） - [x] frozen=True：创建后不可变，赋值抛 FrozenInstanceError（坐标点/配置项这种该只读的用它） - [x] field(init=False)：派生字段不出现在 __init__ 参数里 - [x] __post_init__：自动调用的钩子，可做派生计算和字段校验；但校验只是权宜之计，外部数据推荐 Pydantic  ### 二、Agent 开发环境（实践）  - [x] 认清核心事实：DeepSeek 的 API 是 OpenAI 完全兼容的 → 不需要任何第三方插件 - [x] 建好独立环境 桌面\\agent-lab\\（venv + Python 3.13.7，不污染 Anaconda） - [x] 装好 langchain 1.4.7 / langchain-core 1.6.13 / langchain-openai 1.7.2 / langgraph 1.2.16 - [x] 写好脚手架：config.py（统一配置）、00_check.py（自检）、01_hello_llm.py、02_chain.py、03_tool_agent.py、run.bat - [x] 跑通环境自检（依赖全绿，只差填 API Key）  ### 三、Langflow 入门（实践）  - [x] 确认 Langflow 1.12 自带原生 DeepSeek 组件 + 官方 OpenAI Compatible 提供者 - [x] 完成 DeepSeek 接入配置（踩了「Base URL 填成变量名」的坑并解决） - [x] 练习 1：最小对话回路（聊天输入 → 语言模型 → 聊天记录）✅ - [x] 练习 2：提示模板设人设（\"三句话内 + 必须给代码\" 生效）✅ - [x] 搞懂连线规则：左进右出，数据从左往右流 - [x] 学会排查 Input data cannot be None（连线接反 / 接错端口） - [x] 解决 Playground 同一条消息显示两遍的疑问（显示层问题）  ## 📚 今日知识点  | 主题 | 一句话要点 | | --- | --- | | dataclass | @dataclass 自动生成 __init__/__repr__/__eq__；没类型注解的字段不进 __init__；frozen=True 不可变且可哈希 | | Agent 开发环境与 DeepSeek | DeepSeek = OpenAI 兼容 → 官方 langchain-openai 改 base_url 即可，零第三方插件 | | Langflow 基础操作 | 组件=积木，连线=数据流；左进右出；代理程序自带计算器/日期/记忆 |  ## 🔍 今日作业体检  - exercises/作业111/ 6 个文件已完成（阶段测验 1~6 章），未新增 - 阶段测验剩余章节（7~18）待继续  > ⏳ 仍待确认（沿自 10-17 计划）： > - 第 10 题「文件读写」（学了 pathlib，可以顺手补完） > - 修复 10-17 体检出的 5 个 bug  ## ⚠️ 今日易错点（快查）  dataclass 相关 1. 没有类型注解的字段不会进 __init__（会变成普通类属性）——最容易踩 2. 可变默认值必须用 field(default_factory=...) 3. frozen=True 是运行时保护 4. __post_init__ 前后各两个下划线，写错静默不执行  Agent / Langflow 相关 5. Base URL 里填了变量名而不是网址 → 报 Connector URL must be an http(s) URL 6. https://api.deepseek.com 后面别再手动加 /v1 7. Langflow 连线左侧是输入、右侧是输出，接反就 Input data cannot be None 8. 「系统消息」是写人设的，不是对话输入端口 9. 以为要装\"DeepSeek 插件\" → 恰恰是最危险的做法（木马重灾区） 10. DeepSeek 没有 embedding 接口，RAG 要另找向量化方案  ## 📌 明日计划  - [ ] 在 agent-lab\\.env 填 API Key，跑通 00_check.py（代码路线） - [ ] Langflow 练习 3：代理程序 + 计算器（看它调工具） - [ ] 继续阶段测验 7~18 章 - [ ] 补第 10 题（文件读写） - [ ] 修掉 10-17 遗留的 5 个 bug - [ ] 更新本日志 + 运行 python notes/tools/build_index.py  ## 🔗 相关  - 学习计划：后续学习与并行计划 - 原始截图转写：source/2026-10-22/ - 前一天：2026-10-21 学习记录 - Agent 项目：agent-lab 说明 - 阶段测验：阶段测验-18章 - 知识点总索引：INDEX.md", "blocks": [{"type": "h", "level": 1, "text": "2026-10-22（周四）学习记录", "html": "2026-10-22（周四）学习记录"}, {"type": "quote", "html": "<p><strong>今日主题<\/strong>：① <code>dataclass<\/code> 深入 ② Agent 开发环境搭建（LangChain / LangGraph）③ Langflow 接入 DeepSeek + 三个入门流程<\/p><p><strong>笔记来源<\/strong>：<code>新建 DOC 文档.doc<\/code>（累积文档，共 70 张截图；前 66 张已转写，本次新增 <strong>4 张<\/strong>）+ 今日实践记录 → 原始转写归档于 <a href=\"../source/2026-10-22/\" target=\"_blank\" rel=\"noopener\">`source/2026-10-22/`<\/a><\/p>"}, {"type": "h", "level": 2, "text": "✅ 今日完成", "html": "✅ 今日完成"}, {"type": "h", "level": 3, "text": "一、dataclass 深入（4 张截图）", "html": "一、<code>dataclass<\/code> 深入（4 张截图）"}, {"type": "ul", "items": ["☑ <strong>类型注解是必须的<\/strong>：<code>name: str<\/code> 是字段声明（进 <code>__init__<\/code>），<code>name = &#x27;默认值&#x27;<\/code> 是类属性（不进）", "☑ <strong><code>frozen=True<\/code><\/strong>：创建后不可变，赋值抛 <code>FrozenInstanceError<\/code>（坐 18章.md\">阶段测验-18章<\/span>", "知识点总索引：<a href=\"#index\" data-go=\"index\">INDEX.md<\/a>"]}]}, {"id": "daily-07", "title": "2026-10-21 学习记录", "chapter": "第 7 章 每日记录", "keywords": [], "search": "--- title: 2026-10-21 学习记录 date: 2026-10-21 topics: [推导式, 类型注解, pathlib路径与文件操作, 异常处理] summary: 学习推导式（列表/字典/集合/生成器表达式）、类型注解（参数加冒号返回加箭头）、pathlib（路径即对象、读写/查找/创建/删除）、异常处理（四件套、raise、自定义异常） ---  # 2026-10-21（周三）学习记录  > 今日主题：推导式 · 类型注解 · pathlib 路径与文件操作 · 异常处理 > 笔记来源：新建 DOC 文档.doc（累积文档，共 66 张截图；前 55 张已转写，本次新增 11 张，无手写正文）→ 原始转写归档于 source/2026-10-21/  ## ✅ 今日完成  - [x] 推导式：通用结构 [表达式 for 变量 in 可迭代对象 if 条件]、字典推导式 {键: 值 …}、集合推导式、生成器表达式 - [x] .items() 与解包：直接 for 只拿键，.items() 才能同时拿键和值（k, w 解包） - [x] 类型注解：口诀「参数加冒号，返回加箭头」；-> None 表示无返回；注解不强制检查 - [x] pathlib：路径是对象（.name/.stem/.suffix/.parent/.parts）、判断存在、读写、遍历、创建删除、老手口诀 - [x] 异常处理：四件套 try → except → else → finally、raise、异常链、自定义异常（必须继承 Exception）、必背报错名、三个致命坑 - [x] 阶段测验作业 exercises/作业111/ 完成第 6 题（6.py 用 pathlib，正好对上今天的主题） - [x] 新增 4 篇主题笔记（19 ~ 22）  ## 📚 今日知识点（点击进入主题笔记）  | 主题 | 一句话要点 | | --- | --- | | 推导式 | [表达式 for 变量 in 可迭代对象 if 条件]；字典用 {键: 值 for …}；() 是生成器表达式 | | 类型注解 | 「参数加冒号，返回加箭头」；注解只是标签，运行时不强制 | | pathlib 路径与文件操作 | 路径是对象不是字符串；读写带 utf-8、建目录带 parents/exist_ok、删文件带 missing_ok | | 异常处理 | try→except→else→finally；except 子类在前父类在后；自定义异常必须继承 Exception |  ## 🔍 今日作业体检  exercises/作业111/6.py（阶段测验第 6 题，10-21 完成）  - 内容：Path.home()、Path.cwd() 探索，和今天的 pathlib 主题正好衔接 ✅ - 待你补充：可以把筛选/读写也练一下（glob('*.py')、read_text(encoding='utf-8')）  > ⏳ 仍待确认（沿自 10-17 计划）： > - 第 10 题「文件读写」（现在学了 pathlib，可以顺手补完了） > - 修复 10-17 体检出的 5 个 bug  ## ⚠️ 今日易错点（快查）  1. 推导式里的 if 是过滤，不是 if/else 分支 2. 字典推导式漏写 键: → 就变成集合推导式了 3. 类型注解不强制：add(\"a\",\"b\") 照样跑，别以为写了 int 就安全 4. pathlib 读写必须 encoding='utf-8'，否则中文乱码 5. .mkdir() 不加 parents=True，父目录不存在直接报错 6. 属性没括号（.name），方法有括号（.exists()） 7. except 顺序：子类在前、父类在后，写反了后面那个永远不执行 8. 裸 except: 会连 Ctrl+C 一起吞；except: pass 是\"掩耳盗铃\" 9. 自定义异常必须继承 Exception，否则 raise 直接报错  ## 📌 明日计划  - [ ] 面向对象收尾：继承、super()、@property、多态 - [ ] 装饰器（承接闭包） - [ ] 补第 10 题（用 pathlib 做文件读写三 （LangChain API 7 题）✅ - 参考手册：LangChain 完全参考手册  ---  ## 四、剩余部分（详细）  ### E · RAG（⬜ 下一个）  要学：   读文档 → 切分 → 向量化(embedding) → 存向量库 → 检索 → 拼提示词 → 生成   | 知识点 | 说明 | | --- | --- | | 文档加载 | TextLoader / Docx2txtLoader / PyPDFLoader | | 切分 | RecursiveCharacterTextSplitter（chunk_size / chunk_overlap） | | Embedding | ⚠️ DeepSeek 没有 embedding 接口 → 用本地 BAAI/bge-small-zh-v1.5 | | 向量库 | Chroma（本地、省事） | | 检索 | 相似度检索、MMR、多查询 | | 引用溯源 | 回答里标注\"出自哪篇笔记\" |  产出：course-rag —— 用你自己的 notes/topics/ 做知识库，问\"线程和进程怎么选\"能答出来并给出处。  门槛提示：需要装 sentence-transformers + 下载模型（约 100MB），第一次会慢。  ### F · 工程化与部署（⬜）  | 内容 | 关键点 | | --- | --- | | 配置管理 | pydantic-settings | | 可观测 | LangSmith / Langfuse 看 trace | | 服务化 | FastAPI（用 def 不用 async） | | 部署 | Docker + 环境变量注入 | | 测试 | pytest（mock 掉 LLM，别每次都真调） |  产出：agent-service（RAG 封装成 API，能 Docker 起服务）  ### G · 高级模式（⬜）  - 多智能体（Supervisor 模式） - 反思（Reflection / Critic） - 规划（Plan-and-Execute） - 长期记忆（跨会话） - 护栏（权限、输入过滤）  产出：双 Agent 协作小系统（写手 + 审稿人）  ### H · 项目集（⬜）  | # | 项目 | 技术点 | 状态 | | --- | --- | --- | --- | | 1 | course-rag | RAG + 向量库 + 引用 | ⬜ 依赖 E | | 2 | ai-study-agent | LangGraph + 工具 + 记忆 | ⬜ 依赖 C | | 3 | neurocards-ai | Agent 自动生成记忆卡片 | ⬜ 骨架已有 | | 4 | agent-service | FastAPI + Docker + 测试 | ⬜ 依赖 F |  ### I · 求职准备（⬜）  - 面试题库（LeetCode 式刷 AI 应用题） - 每个项目准备 15 分钟讲述（STAR） - 简历：量化结果（准确率、响应时间、覆盖文档数）  ---  ## 五、时间估算（每天 1.5~2 小时）  | 阶段 | 预计 | 说明 | | --- | --- | --- | | C 剩余（流式） | 0.5 天 | 今天就完成 | | E RAG | 2~3 周 | 含装环境 | | F 工程化 | 2 周 | | | G 高级模式 | 2 周 | 可与 H 并行 | | H 项目集 | 2~3 周 | 边学边做 | | I 求职 | 1~2 周 | | | 合计 | 约 10~12 周 | 到 2027 年 1 月中旬 |  ---  ## 六、每周固定节奏（建议）  | 时间 | 做什么 | | --- | --- | | 平日 1.5h | 学新知识点 + 当天练习 | | 周末半天 | 做项目（项目是唯一能写进简历的东西） | | 每周日 15 分钟 | 更新本文件的", "blocks": [{"type": "h", "level": 1, "text": "学习全流程总览（从零基础 → 能就业）", "html": "学习全流程总览（从零基础 → 能就业）"}, {"type": "quote", "html": "<p>建立：2026-10-27<\/p><p>用途：<strong>一张图看清自己在哪、还剩多少、下一步是什么<\/strong>。每周更新一次进度。<\/p><p>详细展开见：<a href=\"#plan-02\" data-go=\"plan-02\">LangChain + LangGraph 完全掌握路线<\/a><\/p>"}, {"type" （每天 1.5~2 小时）", "html": "五、时间估算（每天 1.5~2 小时）"}, {"type": "table", "rows": [["阶段", "预计", "说明"], ["C 剩余（流式）", "0.5 天", "今天就完成"], ["E RAG", "2~3 周", "含装环境"], ["F 工程化", "2 周", ""], ["G 高级模式", "2 周", "可与 H 并行"], ["H 项目集", "2~3 周", "边学边做"], ["I 求职", "1~2 周", ""], ["<strong>合计<\/strong>", "<strong>约 10~12 周<\/strong>", "到 2027 年 1 月中旬"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "六、每周固定节奏（建议）", "html": "六、每周固定节奏（建议）"}, {"type": "table", "rows": [["时间", "做什么"], ["平日 1.5h", "学新知识点 + 当天练习"], ["周末半天", "<strong>做项目<\/strong>（项目是唯一能写进简历的东西）"], ["每周日 15 分钟", "更新本文件的进度条 + 日记"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "七、里程碑（达成即\"上了一个台阶\"）", "html": "七、里程碑（达成即&quot;上了一个台阶&quot;）"}, {"type": "table", "rows": [["里程碑", "标志"], ["🎯 M1", "能独立写完整的 Agent 图（循环 + 工具）—— <strong>已达成<\/strong>"], ["🎯 M2", "能独立给图加记忆和人工确认 —— <strong>已达成<\/strong>"], ["🎯 M3", "<code>course-rag<\/code> 能准确回答自己的笔记并给出处"], ["🎯 M4", "服务能用 Docker 一条命令跑起来"], ["🎯 M5", "4 个作品全部上 GitHub + README 齐全"], ["🎯 M6", "能对着白板讲清一个项目的架构与取舍"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "八、当前方向（2026-10-28 调整）", "html": "八、当前方向（2026-10-28 调整）"}, {"type": "quote", "html": "<p>⚠️ <strong>项目暂缓，进入语法攻关期<\/strong>。<\/p><p>原因：<code>course-rag<\/code> 已跑通并推上 GitHub（可交付），但语法仍是短板——drills 第一套 12 关错 7 关。<\/p><p><strong>回归项目的条件<\/strong>：drills 连续两套 ≥90% 独立通过（不看笔记）。<\/p>"}, {"type": "p", "html": "<strong>语法攻关期（1~2 周，每天 20~30 分钟）<\/strong>"}, {"type": "table", "rows": [["内容", "频率", "目的"], ["<code>agent-lab/drills/01_语法体能.py<\/code>（12 关）", "每天 1 遍；3 天后不看笔记重做", "打底：函数 / 闭包 / 装饰器 / dataclass / TypedDict"], ["<code>agent-lab/drills/02_语法体能2.py<\/code>（10 关）", "01 干净通过后开始", "专攻薄弱：<code>enumerate<\/code> / <code>self<\/code> / 装饰器 / TypedDict / 异常"], ["<span class=\"deadlink\" title=\"源文件：../../阶段测验-18章.md\">阶段测验-18章<\/span> 第 7~18 题", "每天 1 题", "综合应用"], ["<span class=\"deadlink\" title=\"源文件：langchain/06-错题本.md\">错题本<\/span> 复习", "每天 2 分钟", "高频错误 Top 3"]]}, {"type": "p", "html": "<strong>长期主线（语法过关后回归）<\/strong>"}, {"type": "ol", "items": ["~~补流式输出~~ ✅ 已完成", "<code>course-rag<\/code> 已上 GitHub（&lt;https://github.com/bianjiaojiao/course-rag&gt;），完善留到语法过关后", "之后：RAG 进阶 → 工程化 → 项目集"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "九、关联文档", "html": "九、关联文档"}, {"type": "table", "rows": [["文档", "内容"], ["<a href=\"#plan-02\" data-go=\"plan-02\">LangChain + LangGraph 完全掌握路线<\/a>", "7 阶段详细知识点"], ["<span class=\"deadlink\" title=\"源文件：langchain/01-LangChain完全参考手册.md\">LangChain 完全参考手册<\/span>", "词典 + 语法 + 11 模板"], ["<span class=\"deadlink\" title=\"源文件：langchain/README.md\">LangChain 专区 README<\/span>", "进度 / 踩坑 / 资源评估"], ["<a href=\"#plan-03\" data-go=\"plan-03\">后续学习与并行计划<\/a>", "Python 侧遗留任务"], ["<a href=\"#index\" data-go=\"index\">INDEX.md<\/a>", "27 篇知识点索引"], ["<a href=\"#timeline\" data-go=\"timeline\">TIMELINE.md<\/a>", "按时间看学习轨迹"]]}]}, {"id": "plan-02", "title": "LangChain + LangGraph 完全掌握路线（项目集导向）", "chapter": "第 8 章 学习计划", "keywords": [], "search": "# LangChain + LangGraph 完全掌握路线（项目集导向）  > 建立日期：2026-10-23 > 目标：完全掌握 LangChain + LangGraph，并沉淀出一套能写进简历的 Agent 项目集。 > 节奏：每天 2~3 小时，总计约 12~14 周。 > 环境：桌面\\agent-lab\\（独立 venv，Python 3.13.7）  ---  ## 一、总览：7 个阶段   阶段 0  基础打通        ✅ 已完成（调用模型 / 提示词 / 结构化输出 / 工具 / LangGraph 首图） 阶段 1  LangChain 核心      1.5 周 阶段 2  工具与 Agent        1 周 阶段 3  LangGraph 深入 ★    2.5 周 阶段 4  RAG                 2.5 周 阶段 5  工程化与部署        2 周 阶段 6  高级模式            2 周 阶段 7  项目集整合          2.5 周   主线逻辑：先会用（0→2）→ 会搭循环（3）→ 会接知识（4）→ 会交付（5）→ 会复杂系统（6）→ 会包装成作品（7）。  ---  ## 二、阶段 0：基础打通（已完成 ✅）  | 已掌握 | 对应文件 | |---|---| | 调用大模型（invoke） | 01_hello_llm.py | | LCEL 管道（提示词 \\| 模型 \\| 解析器） | 02_chain.py | | 工具调用 Agent（@tool + ReAct 循环） | 03_tool_agent.py | | 结构化输出（Pydantic + with_structured_output） | 04_structured.py | | LangGraph 手动建图（State/Node/Edge/条件边） | 05_langgraph_agent.py（待跑通） | | Langflow 可视化（三个入门流程） | Langflow 桌面版 |  遗留问题：05_langgraph_agent.py 尚未跑通 → 阶段 3 开头第一件事就是解决它。  ---  ## 三、阶段 1：LangChain 核心（约 1.5 周）  ### 要掌握的知识  1. 消息体系（Messages） - SystemMessage / HumanMessage / AIMessage / ToolMessage 四种角色 - AIMessage.tool_calls、tool_call_id 的作用（工具结果要与调用配对的机制） - 消息列表如何构成一次对话  2. 提示词进阶 - ChatPromptTemplate、MessagesPlaceholder（插入历史） - f-string 变量、部分变量（.partial()） - few-shot 示例的正确写法  3. 输出解析 - StrOutputParser / JsonOutputParser / PydanticOutputParser - with_structured_output 的三种 method（json_schema / json_mode / function_calling）  4. LCEL 深入 - invoke / batch / stream 三种调用 - RunnablePassthrough（原样传递）、RunnableLambda（包装普通函数） - RunnableParallel（并行分支）、| 的组合语义 - RunnableConfig（传 config、回调、标签）  5. 回调与日志 - callbacks 抓取 token 用量、耗时 - 何时用 LangSmith（后面阶段 5 再深入）  ### 产出（验收）  - [ ] 写一个多步骤文本处理流水线：输入一段文章 → 提取要点 → 生成摘要 → 输出 markdown - [ ] 全程用 LCEL 拼接，至少用到 RunnableParallel 和 RunnablePassthrough - [ ] 能打印每次调用的 token 用量  ### 检验标准  能不看文档回答：\"| 到底做了什么？RunnableParallel 什么时候用？ToolMessage 和 AIMessage 有什么区别？\"  ---  ## 四、阶段 2：工具与 Agent 基础（约 1 周）  ### 要掌握的知识  1. @tool 进阶 - args_schema（用 Pydantic 定义参数结构，比类型注解更可控） - 工具内部抛异常 vs 返回错误字符串（哪种对模型更友好） - 工具的 docstring 为什么决定模型选不选它  2. 工具绑定的机制 - bind_tools([...]) 之后模型返回的 tool_calls 结构 - tool_choice（强制/禁止调用工具） - 并行工具调用（模型一次规划多个动作）  3. Agent 的两种写法 - create_react_agent（封装版，快速原型） - 手写循环（LangGraph，阶段 3） - ToolNode（LangGraph 提供的工具执行节点）  4. Agent 的错误处理 - handle_parsing_errors（工具调用失败自动重试） - max_iterations（防死循环） - 工具执行超时  ### 产出  - [ ] 一个多功能助手：能查资料（网络搜索/URL 读取）+ 计算 + 读写本地文件 - [ ] 至少一个工具用 args_schema 定义 - [ ] 故意让一个工具抛错，验证 Agent 能优雅恢复  ---  ## 五、阶段 3：LangGraph 深入（约 2.5 周）★最核心  ### 要掌握的知识  1. State 设计（最重要） - TypedDict 定义 State - Annotated[list, add_messages] —— reducer 的概念（为什么消息要累加，而普通字段是覆盖） - 自定义 reducer（比如计数器、去重）  2. 图的构造 - StateGraph / add_node / add_edge / add_conditional_edges / compile - START / END - 节点返回值如何合并进 State  3. 循环与终止 - 条件边构成 Agent 循环 - 递归限制（recursion_limit）与死循环排查 - 多节点串行、并行节点  4. 持久化与记忆 - checkpointer（MemorySaver / SqliteSaver） - thread_id：如何让同一会话记住历史 - get_state / update_state（查看、修改状态） - 时间旅行（回放某个历史点）  5. 人工介入（Human-in-the-loop） - interrupt()：在关键步骤暂停等确认 - 恢复执行（Command(resume=...)） - 适用场景：花钱操作、删数据、发消息前的确认  6. 高级控制流 - 子图（Subgraph）：把复杂流程拆成模块 - Send API：动态并行（map-reduce 模式） - 流式输出（stream / stream_mode=\"updates\"）  ### 产出  - [ ] 把 05_langgraph_agent.py 跑通并改成 3 轮以上循环（多工具串行） - [ ] 加 checkpointer，实现跨轮记忆（第二次对话记得第一次说的名字） - [ ] 加 interrupt()，在\"调用某个危险工具\"前暂停等确认 - [ ] 做一个带分支的工作流：根据问题类型走不同节点分支  ### 检验标准  能在白板上画出\"Agent 循环图\"，并说清：State 里有什么、谁改它、什么条件下走哪条边。  ---  ## 六、阶段 4：RAG（约 2.5 周）  ### 要掌握的知识  1. 文档加载 - TextLoader / PyPDFLoader / Docx2txtLoader / Unstructured - 注意编码（utf-8）、大文件流式读取  2. 切分（Chunking） - RecursiveCharacterTextSplitter（chunk_size / chunk_overlap 怎么选） - 中文切分的特殊考虑（按句号/换行切） - 语义切分（进阶）  3. Embedding（关键限制） - ⚠️ DeepSeek 没有 embedding 接口，必须另找方案：   - 本地 sentence-transformers（BAAI/bge-small-zh-v1.5）推荐   - Ollama 本地 embedding 模型   - 其他厂商 API - 向量维度的概念、相似度计算（cosine）  4. 向量库 - Chroma（本地持久化，最省事）/ FAISS - 建库、增量添加、持久化目录  5. 检索策略 - 相似度检索（similarity_search） - MMR（避免检索结果重复） - 多查询（MultiQuery）、混合检索（关键词+向量） - 重排（Rerank，进阶）  6. RAG 链 - 基础版：检索 → 拼进提示词 → 生成 - 引用溯源：让回答带上\"出自第几段\" - 处理\"检索不到\"的情况（不要让", "blocks": [{"type": "h", "level": 1, "text": "LangChain + LangGraph 完全掌握路线（项目集导向）", "html": "LangChain + LangGraph 完全掌握路线（项目集导向）"}, {"type": "quote", "html": "<p>建立日期：2026-10-23<\/p><p>目标：<strong>完全掌握 LangChain + LangGraph<\/strong>，并沉淀出一套能写进简历的 <strong>Agent 项目集<\/strong>。<\/p><p>节奏：每天 2~3 小时，总计约 <strong>12~14 周<\/strong>。<\/p><p>环境：<code>桌面\\agent-lab\\<\/code>（独立 venv，Python 3.13.7）<\/p>"}, {"type": "hr"}, {"type": "h", "level": 2, "text": "一、总览：7 个阶段", "html": "一、总览：7 个阶段"}, {"type": "code", "lang": "", "text": "阶段 0  基础打通        ✅ 已完成（调用模型 / 提示词 / 结构化输出 / 工具 / LangGraph 首图）\n阶段 1  LangChain 核心      1.5 周\n阶段 2  工具与 Agent        1 周\n阶段 3  LangGraph 深入 ★    2.5 周\n阶段 4  RAG                 2.5 周\n阶段 5  工程化与部署        2 周\n阶段 6  高级模式            2 周\n阶段 7  项目集整合          2.5 周"}, {"type": "p", "html": "<strong>主线逻辑<\/strong>：先会用（0→2）→ 会搭循环（3）→ 会接知识（4）→ 会交付（5）→ 会复杂系统（6）→ 会包装成作品（7）。"}, {"type": "hr"}, {"type": "h", "level": 2, "text": "二、阶段 0：基础打通（已完成 ✅）", "html": "二、阶段 0：基础打通（已完成 ✅）"}, {"type": "table", "rows": [["已掌 , {"type": "hr"}, {"type": "h", "level": 2, "text": "六、阶段 4：RAG（约 2.5 周）", "html": "六、阶段 4：RAG（约 2.5 周）"}, {"type": "h", "level": 3, "text": "要掌握的知识", "html": "要掌握的知识"}, {"type": "p", "html": "<strong>1. 文档加载<\/strong>"}, {"type": "ul", "items": ["<code>TextLoader<\/code> / <code>PyPDFLoader<\/code> / <code>Docx2txtLoader<\/code> / <code>Unstructured<\/code>", "注意编码（<code>utf-8<\/code>）、大文件流式读取"]}, {"type": "p", "html": "<strong>2. 切分（Chunking）<\/strong>"}, {"type": "ul", "items": ["<code>RecursiveCharacterTextSplitter<\/code>（<code>chunk_size<\/code> / <code>chunk_overlap<\/code> 怎么选）", "中文切分的特殊考虑（按句号/换行切）", "语义切分（进阶）"]}, {"type": "p", "html": "<strong>3. Embedding（关键限制）<\/strong>"}, {"type": "ul", "items": ["⚠️ <strong>DeepSeek 没有 embedding 接口<\/strong>，必须另找方案：", "本地 <code>sentence-transformers<\/code>（<code>BAAI/bge-small-zh-v1.5<\/code>）<strong>推荐<\/strong>", "Ollama 本地 embedding 模型", "其他厂商 API", "向量维度的概念、相似度计算（cosine）"]}, {"type": "p", "html": "<strong>4. 向量库<\/strong>"}, {"type": "ul", "items": ["<code>Chroma<\/code>（本地持久化，最省事）/ <code>FAISS<\/code>", "建库、增量添加、持久化目录"]}, {"type": "p", "html": "<strong>5. 检索策略<\/strong>"}, {"type": "ul", "items": ["相似度检索（<code>similarity_search<\/code>）", "<strong>MMR<\/strong>（避免检索结果重复）", "多查询（MultiQuery）、混合检索（关键词+向量）", "重排（Rerank，进阶）"]}, {"type": "p", "html": "<strong>6. RAG 链<\/strong>"}, {"type": "ul", "items": ["基础版：检索 → 拼进提示词 → 生成", "<strong>引用溯源<\/strong>：让回答带上&quot;出自第几段&quot;", "处理&quot;检索不到&quot;的情况（不要让模型硬编）"]}, {"type": "p", "html": "<strong>7. RAG 评估<\/strong>"}, {"type": "ul", "items": ["准备测试集（问题 + 期望答案）", "指标：召回率、答案准确性", "RAGAS（进阶）"]}, {"type": "h", "level": 3, "text": "产出", "html": "产出"}, {"type": "ul", "items": ["☐ <strong><code>course-rag<\/code><\/strong>：把 <code>notes/topics/<\/code> 里的 Python 笔记做成知识库", "☐ 能回答&quot;线程和进程怎么选&quot;这类问题，并<strong>给出出处<\/strong>", "☐ 至少对比两套切分参数，看效果差异"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "七、阶段 5：工程化与部署（约 2 周）", "html": "七、阶段 5：工程化与部署（约 2 周）"}, {"type": "h", "level": 3, "text": "要掌握的知识", "html": "要掌握的知识"}, {"type": "p", "html": "<strong>1. 配置管理<\/strong>"}, {"type": "ul", "items": ["<code>pydantic-settings<\/code> 读取 <code>.env<\/code>（类型校验 + 默认值）", "环境变量分层（开发/生产）"]}, {"type": "p", "html": "<strong>2. 可观测性<\/strong>"}, {"type": "ul", "items": ["<code>LangSmith<\/code>（官方 trace，免费额度够用）：看每次调用的输入输出、耗时、token", "或 <code>Langfuse<\/code>（开源替代）", "关键：<strong>能定位&quot;是哪一步变慢了/错了&quot;<\/strong>"]}, {"type": "p", "html": "<strong>3. 健壮性<\/strong>"}, {"type": "ul", "items": ["重试（<code>tenacity<\/code> / 自己写）", "超时控制", "降级策略（模型挂了怎么办）", "成本控制（token 上限、缓存）"]}, {"type": "p", "html": "<strong>4. 服务化<\/strong>"}, {"type": "ul", "items": ["FastAPI <strong>同步<\/strong>接口（<code>def<\/code> 而不是 <code>async def<\/code>，够用且简单）", "请求/响应模型（Pydantic）", "流式响应（SSE，进阶）"]}, {"type": "p", "html": "<strong>5. 部署<\/strong>"}, {"type": "ul", "items": ["Docker 容器化", "环境变量注入（密钥不进镜像）", "GitHub Actions 自动测试"]}, {"type": "p", "html": "<strong>6. 测试<\/strong>"}, {"type": "ul", "items": ["<code>pytest<\/code> 单测（<strong>mock 掉 LLM 调用<\/strong>，不要每次都真调）", "集成测试（少量真实调用）"]}, {"type": "h", "level": 3, "text": "产出", "html": "产出"}, {"type": "ul", "items": ["☐ <code>agent-service<\/code>：把阶段 4 的 RAG 封装成 FastAPI 服务", "☐ 有 Dockerfile，一条命令起服务", "☐ 有 3~5 个 pytest 测试（含 mock）", "☐ 接上 LangSmith，能看到完整 trace"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "八、阶段 6：高级模式（约 2 周）", "html": "八、阶段 6：高级模式（约 2 周）"}, {"type": "h", "level": 3, "text": "要掌握的知识", "html": "要掌握的知识"}, {"type": "p", "html": "<strong>1. 多智能体<\/strong>"}, {"type": "ul", "items": ["Supervisor 模式（一个主管分派任务给子 agent）", "层级团队（team of teams）", "何时该用多 agent（<strong>大多数时候不该<\/strong>——先单 agent 做不好再拆）"]}, {"type": "p", "html": "<strong>2. 反思与自我改进<\/strong>"}, {"type": "ul", "items": ["Reflection（自己检查答案再重写）", "Critic agent（评审 agent）", "适用：写作、代码生成"]}, {"type": "p", "html": "<strong>3. 规划模式<\/strong>"}, {"type": "ul", "items": ["Plan-and-Execute（先列计划再执行）", "ReWOO（减少 token）"]}, {"type": "p", "html": "<strong>4. 记忆体系<\/strong>"}, {"type": "ul", "items": ["短期（当前会话）", "长期（跨会话，向量库存记忆）", "语义记忆 / 情景记忆"]}, {"type": "p", "html": "<strong>5. 安全与护栏<\/strong>"}, {"type": "ul", "items": ["输入过滤（prompt injection 防护）", "输出校验", "权限控制（哪些工具允许自动执行）"]}, {"type": "h", "level": 3, "text": "产出", "html": "产出"}, {"type": "ul", "items": ["☐ 一个<strong>双 agent 协作<\/strong>的小系统（比如&quot;写手 + 审稿人&quot;）", "☐ 一个带<strong>长期记忆<\/strong>的助手（跨会话记住用户偏好）"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "九、阶段 7：项目集整合（约 2.5 周）", "html": "九、阶段 7：项目集整合（约 2.5 周）"}, {"type": "h", "level": 3, "text": "作品集（4 个，从易到难）", "html": "作品集（4 个，从易到难）"}, {"type": "table", "rows": [["#", "项目", "技术点", "面试价值"], ["1", "<strong><code>course-rag<\/code><\/strong>", "RAG + 向量库 + 引用溯源", "证明你会 RAG"], ["2", "<strong><code>ai-study-agent<\/code><\/strong>", "LangGraph 多轮 + 工具 + 记忆", "证明你会 Agent"], ["3", "<strong><code>neurocards-ai<\/code><\/strong>", "Agent 自动生成记忆卡片（<strong>呼应 P1 的 neurocards<\/strong>）", "证明你有系统思维"], ["4", "<strong><code>agent-service<\/code><\/strong>", "FastAPI + Docker + 测试 + trace", "证明你能交付"]]}, {"type": "h", "level": 3, "text": "简历包装（STAR）", "html": "简历包装（STAR）"}, {"type": "p", "html": "每个项目写清楚："}, {"type": "ul", "items": ["<strong>情境<\/strong>：解决什么问题", "<strong>任务<\/strong>：你负责什么", "<strong>行动<\/strong>：用了什么技术、为什么这么选", "<strong>结果<\/strong>：<strong>量化<\/strong>（准确率、响应时间、覆盖多少文档）"]}, {"type": "h", "level": 3, "text": "收尾", "html": "收尾"}, {"type": "ul", "items": ["☐ 每个项目都有：README + 演示截图/录屏 + 测试", "☐ GitHub 仓库整理（pin 到主页）", "☐ 挑 2 个能<strong>深入讲 15 分钟<\/strong>的"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "十、每个阶段都要做的三件事", "html": "十、每个阶段都要做的三件事"}, {"type": "ol", "items": ["<strong>动手改<\/strong>：跑通后至少改一处（换模型、加工具、改条件），看行为变化", "<strong>写笔记<\/strong>：新增/更新 <code>notes/topics/<\/code>，跑 <code>build_index.py<\/code>", "<strong>提交<\/strong>：<code>git add . &amp;&amp; git commit -m &quot;阶段X: xxx&quot; &amp;&amp; git push<\/code>"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "十一、常见坑速查（会反复遇到）", "html": "十一、常见坑速查（会反复遇到）"}, {"type": "table", "rows": [["坑", "现象", "解法"], ["DeepSeek 不支持 <code>json_schema<\/code>", "<code>This response_format type is unavailable now<\/code>", "<code>with_structured_output(..., method=&quot;function_calling&quot;)<\/code>"], ["DeepSeek 没有 embedding", "RAG 无法向量化", "本地 <code>bge-small-zh<\/code> / Ollama"], ["<code>ToolMessage<\/code> 缺 <code>tool_call_id<\/code>", "报错或工具结果丢失", "用 <code>ToolNode<\/code> 自动处理"], ["忘记 <code>checkpointer<\/code>", "多轮对话记不住", "建图时传 <code>checkpointer<\/code> + 调用时传 <code>thread_id<\/code>"], ["条件边不返回 <code>END<\/code>", "死循环/递归超限", "明确返回 <code>END<\/code>，设 <code>recursion_limit<\/code>"], ["状态被覆盖而非累加", "历史消息消失", "字段加 <code>Annotated[list, add_messages]<\/code>"], ["<code>bind_tools<\/code> 后模型乱调工具", "工具描述不清", "把 docstring 写具体，用 <code>args_schema<\/code>"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "十二、学习资源", "html": "十二、学习资源"}, {"type": "table", "rows": [["内容", "资源"], ["LangChain 官方", "&lt;https://python.langchain.com&gt;"], ["LangGraph 官方", "&lt;https://langchain-ai.github.io/langgraph/&gt;"], ["官方教程（最该看）", "LangGraph 的 &quot;Learn&quot; 部分，有交互式 notebook"], ["DeepSeek 文档", "&lt;https://platform.deepseek.com/api-docs&gt;"], ["本地 embedding", "<code>BAAI/bge-small-zh-v1.5<\/code>（HuggingFace）"], ["可观测", "&lt;https://smith.langchain.com&gt;"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "十三、一句话总结", "html": "十三、一句话总结"}, {"type": "quote", "html": "<p><strong>阶段 0~2 是&quot;会用&quot;，阶段 3 是&quot;会搭&quot;，阶段 4 是&quot;会接数据&quot;，阶段 5 是&quot;会交付&quot;，阶段 6 是&quot;会做复杂系统&quot;，阶段 7 是&quot;会包装&quot;。<\/strong><\/p><p>走完这 7 个阶段，你就不是&quot;学过 LangChain 的人&quot;，而是&quot;能用它做产品的人&quot;。<\/p>"}]}, {"id": "plan-03", "title": "🗓️ 后续学习任务与并行学习计划", "chapter": "第 8 章 学习计划", "keywords": [], "search": "# 🗓️ 后续学习任务与并行学习计划  > 制定日期：2026-10-17 · 依据：AI专业Python从零到精通学习路线（P0→P1）+ 今日作业体检 > 当前状态：P0 完成 9/10（01~09 手写完成，10 未开始）· 文件 I/O 完全空白 · P1 刚起步  ---  ## 一、当前位置诊断  | 能力 | 状态 | | --- | --- | | 变量、类型、条件、循环、range | ✅ 基本熟练（01~06 手写无大障碍） | | 函数定义 / 参数 / main() 入口 | ✅ 会用，但参数设计有误区（今日已纠） | | f-string 格式化 | ✅ 会用；细节格式（对齐/千分位）刚学 | | list / tuple / dict / set | 🟡 概念清晰，方法没记牢，性能意识刚建立 | | 排序 / 去重 / 词频统计 | 🟡 会写（8.py、9.py 已通过），但需要脱稿复现 | | 异常处理 | 🟡 只在 4.py 有 bug 时暴露，未系统学 | | 文件读取与管理（I/O） | ❌ 完全空白（10.py 未开始） | | 推导式 / 生成器 / 装饰器 | 🟡 见过示例（fib_gen），未系统学 | | 面向对象 / 模块与包 | ❌ 未开始 | | 算法（LeetCode） | ❌ 未开始 |  P1 结束目标（约 5 周）：neurocards 终端间隔重复背题系统（SM-2 算法、argparse、json/sqlite、面向对象、pytest） 本周目标：补完 10 题 + 打通文件 I/O 前 7 天 + 开始算法副线  ---  ## 二、接下来 3 周任务清单（按优先级）  ### 第 1 周（10/18 – 10/24）· 收尾 P0 + 文件 I/O 入门 - [ ] 完成第 10 题（文件读写 4 步）——最高优先级 - [ ] 修掉今日体检出的 5 个 bug（2.py 除法 / 3.py 格式 / 4.py 异常 / 6.py 斐波那契 / 7.py 第二种方法） - [ ] 文件 I/O 路线 D1–D7（见第三节） - [ ] 数据结构复习：list/dict/set 方法脱稿默写一遍 - [ ] 算法副线启动：LeetCode Easy 累计 5 题（数组/字符串） - [ ] 每天在 daily-log.md 记一行  ### 第 2 周（10/25 – 10/31）· 文件 I/O 进阶 + 语法主线 - [ ] 文件 I/O 路线 D8–D14（目录遍历、CSV/JSON、大文件流式、sqlite 预热） - [ ] 语法主线：列表/字典推导式（练到能随手写）+ 异常处理 try/except/finally - [ ] 项目热身：词频统计 v2（文件版）→ v3（多文件版） - [ ] LeetCode Easy 累计 15 题 - [ ] 周日复盘：把本周代码重读一遍，记录 3 个坑  ### 第 3 周（11/1 – 11/7）· P1 核心语法推进 - [ ] 面向对象：类、__init__、实例/类属性、继承、@property、dataclass - [ ] 开始 neurocards 骨架：卡片类 Card、牌组类 Deck、JSON 存取 - [ ] 文件 I/O 综合项目：日志分析器（读日志 → 统计 → CSV/JSON 报告） - [ ] LeetCode Easy 累计 25 题  ### 里程碑验收（每周日自测） - [ ] 能不看答案写出 10 题 → 才算 P0 真正完成 - [ ] 能默写 with open(...) 的读写/追加模式表 - [ ] 能说出 pathlib.Path 5 个常用方法和用途 - [ ] 能手写\"读文件→词频→排序→写文件\"的完整 40 行代码  ---  ## 三、并行学习计划：文件管理（I/O）× 数据结构 / 算法  ### 每天 3 小时时间分配（推荐 19:00 开始）  | 时段 | 内容 | 时长 | 说明 | | --- | --- | --- | --- | | A 段 | 文件 I/O 主线（新知识，最优先） | 60 min | 看教程/文档 20 min + 敲代码 40 min | | B 段 | 数据结构 / 算法副线 | 60 min | 一三五学数据结构；二四做算法题；周末复盘 | | C 段 | 实战串联（词频统计升级 / 小工具） | 30 min | 把当天 I/O 知识用到词频项目上 | | D 段 | 日志 + 复盘 | 15 min | 写 daily-log：学了 / 卡住 / 解决 |  > 若有整块白天时间：A ×2 连上（上午 I/O、下午数据结构+算法），C 段放在中午或晚上。  ### 文件 I/O 十四天路线（从零到实战）  | 天 | 核心概念 / API | 动手产出（建议新建 exercises/10_file_io_*.py） | | --- | --- | --- | | D1 | 文件是什么、文本 vs 二进制、UTF-8 编码、open() 与 with、四种模式 r/w/a/r+ | 写一个 txt → 读出来 → 追加一行（第 10 题本体） | | D2 | 读取三法：read() / readline() / readlines() / 直接 for line in f；splitlines() | 统计文件行数、字符数、最长行 | | D3 | pathlib.Path：cwd()、exists()、mkdir()、iterdir()、glob()、suffix、stem、read_text/write_text | 列出目录中所有 .py 文件并按大小排序 | | D4 | 写入细节：encoding=\"utf-8\"、覆盖 vs 追加、newline、errors=\"ignore\" | 读写中英混合文件，做编码实验（故意用错编码看报错） | | D5 | 异常处理配套：try/except/else/finally、FileNotFoundError、PermissionError、with 自动关闭 | 写\"安全读取\"函数：文件不存在时给出友好提示而不崩溃 | | D6 | CSV：csv.reader / csv.writer / DictReader / DictWriter | 把词频结果导出 word_freq.csv | | D7 | JSON：json.dump/load、ensure_ascii=False、indent=2、字典列表互转 | 把词频结果保存 word_freq.json 并读回 | | D8 | 目录遍历：os.walk / Path.rglob()；批量处理 | 批量读取目录下所有 .txt 并汇总词频 | | D9 | 大文件流式处理：逐行迭代、生成器、yield（衔接 P1 生成器） | 处理 10 万行文件不爆内存；计时对比 | | D10 | 综合 1：词频统计 v2（文件版） | 读入 txt → 清洗 → 统计 → Top10 | | D11 | 综合 2：词频统计 v3（多文件版）+ 报告输出 | 输出 Markdown/CSV 报告各一份 | | D12 | sqlite3 入门：connect、execute、commit、fetchall、建表 | 卡片表 cards(id, question, answer) 增删查改（neurocards 预热） | | D13 | 综合 3：日志分析器（读日志 → 统计访问量 → 写报告） | 30 行左右的小工具 | | D14 | 复盘：把 D1–D13 零散代码重构成函数/类 | 整理一个 tools.py，写 docstring |  > 每天 A 段建议节奏：读 15–20 分钟文档 → 关掉文档自己写 30 分钟 → 最后对照检查。 > 文档来源：Python 官方教程「7. 输入与输出」、廖雪峰「IO 编程」章节、CS50P Week 6 (File I/O)。  ### 数据结构 / 算法副线安排（与 I/O 并行，每天 60 分钟）  | 星期 | 内容 | 目标 | | --- | --- | --- | | 周一 | 数据结构：list / tuple 方法与复杂度 | 能说出 append/pop/insert 的 O(1)/O(n) | | 周二 | 算法题：数组 + 双指针（Easy 2 题） | 会写 two_sum、remove_duplicates | | 周三 | 数据结构：dict / set、collections.Counter/defaultdict | 用 Counter 重写词频统计，对比手写版 | | 周四 | 算法题：字符串 + 哈希表（Easy 2 题） | 会写 valid_anagram、first_unique_char | | 周五 | 数据结构：推导式（列表/字典/集合） | 把 08、09 题里\"手写循环\"改写成推导式 | | 周六 | 算法题：栈/队列入门（Easy 1–2 题） | 会写 valid_parentheses | | 周日 | 复盘：本周错题 + 把数据结构知识用到词频项目 | 写笔记、更新 daily-log |  > 交叉点（重要）：数据结构 + 文件 I/O 在词频统计项目汇合 —— 文件读入 → 字典统计 → 排序输出 → 落盘保存，正好", "blocks": [{"type": "h", "level": 1, "text": "🗓️ 后续学习任务与并行学习计划", "html": "🗓️ 后续学习任务与并行学习计划"}, {"type": "quote", "html": "<p>制定日期：2026-10-17 · 依据：<code>AI专业Python从零到精通学习路线<\/code>（P0→P1）+ 今日作业体检<\/p><p>当前状态：<strong>P0 完成 9/10< f-8&quot;<\/code>、覆盖 vs 追加、<code>newline<\/code>、<code>errors=&quot;ignore&quot;<\/code>", "读写中英混合文件，做编码实验（故意用错编码看报错）"], ["D5", "异常处理配套：<code>try/except/else/finally<\/code>、<code>FileNotFoundError<\/code>、<code>PermissionError<\/code>、<code>with<\/code> 自动关闭", "写&quot;安全读取&quot;函数：文件不存在时给出友好提示而不崩溃"], ["D6", "CSV：<code>csv.reader<\/code> / <code>csv.writer<\/code> / <code>DictReader<\/code> / <code>DictWriter<\/code>", "把词频结果导出 <code>word_freq.csv<\/code>"], ["D7", "JSON：<code>json.dump/load<\/code>、<code>ensure_ascii=False<\/code>、<code>indent=2<\/code>、字典列表互转", "把词频结果保存 <code>word_freq.json<\/code> 并读回"], ["D8", "目录遍历：<code>os.walk<\/code> / <code>Path.rglob()<\/code>；批量处理", "批量读取目录下所有 <code>.txt<\/code> 并汇总词频"], ["D9", "大文件流式处理：逐行迭代、生成器、<code>yield<\/code>（衔接 P1 生成器）", "处理 10 万行文件不爆内存；计时对比"], ["D10", "<strong>综合 1<\/strong>：词频统计 v2（文件版）", "读入 txt → 清洗 → 统计 → Top10"], ["D11", "<strong>综合 2<\/strong>：词频统计 v3（多文件版）+ 报告输出", "输出 Markdown/CSV 报告各一份"], ["D12", "<code>sqlite3<\/code> 入门：<code>connect<\/code>、<code>execute<\/code>、<code>commit<\/code>、<code>fetchall<\/code>、建表", "卡片表 <code>cards(id, question, answer)<\/code> 增删查改（neurocards 预热）"], ["D13", "<strong>综合 3<\/strong>：日志分析器（读日志 → 统计访问量 → 写报告）", "30 行左右的小工具"], ["D14", "复盘：把 D1–D13 零散代码重构成函数/类", "整理一个 <code>tools.py<\/code>，写 docstring"]]}, {"type": "quote", "html": "<p>每天 A 段建议节奏：读 15–20 分钟文档 → 关掉文档自己写 30 分钟 → 最后对照检查。<\/p><p>文档来源：Python 官方教程「7. 输入与输出」、廖雪峰「IO 编程」章节、CS50P Week 6 (File I/O)。<\/p>"}, {"type": "h", "level": 3, "text": "数据结构 / 算法副线安排（与 I/O 并行，每天 60 分钟）", "html": "数据结构 / 算法副线安排（与 I/O 并行，每天 60 分钟）"}, {"type": "table", "rows": [["星期", "内容", "目标"], ["周一", "数据结构：list / tuple 方法与复杂度", "能说出 <code>append/pop/insert<\/code> 的 O(1)/O(n)"], ["周二", "算法题：数组 + 双指针（Easy 2 题）", "会写 <code>two_sum<\/code>、<code>remove_duplicates<\/code>"], ["周三", "数据结构：dict / set、<code>collections.Counter/defaultdict<\/code>", "用 Counter 重写词频统计，对比手写版"], ["周四", "算法题：字符串 + 哈希表（Easy 2 题）", "会写 <code>valid_anagram<\/code>、<code>first_unique_char<\/code>"], ["周五", "数据结构：推导式（列表/字典/集合）", "把 08、09 题里&quot;手写循环&quot;改写成推导式"], ["周六", "算法题：栈/队列入门（Easy 1–2 题）", "会写 <code>valid_parentheses<\/code>"], ["周日", "复盘：本周错题 + 把数据结构知识用到词频项目", "写笔记、更新 daily-log"]]}, {"type": "quote", "html": "<p>交叉点（重要）：<strong>数据结构 + 文件 I/O 在词频统计项目汇合<\/strong> —— 文件读入 → 字典统计 → 排序输出 → 落盘保存，正好把两条线串起来。<\/p>"}, {"type": "hr"}, {"type": "h", "level": 2, "text": "四、词频统计实战升级路径（衔接练习 09 → neurocards）", "html": "四、词频统计实战升级路径（衔接练习 09 → neurocards）"}, {"type": "h", "level": 3, "text": "v1 现状：9.py 已通过 ✅", "html": "v1 现状：<code>9.py<\/code> 已通过 ✅"}, {"type": "p", "html": "读输入字符串 → 清洗标点 → 手写字典计数 → <code>sorted(..., key=lambda x: x[1], reverse=True)[:3]<\/code>"}, {"type": "h", "level": 3, "text": "v2 文件版（D10，本周完成）", "html": "v2 文件版（D10，本周完成）"}, {"type": "code", "lang": "python", "text": "from pathlib import Path\n\ndef count_words(text: str) -> dict[str, int]:\n    freq = {}\n    for w in text.lower().replace(\",\", \" \").replace(\".\", \" \").split():\n        freq[w] = freq.get(w, 0) + 1\n    return freq\n\ndef top_words(freq: dict[str, int], n: int = 10):\n    return sorted(freq.items(), key=lambda kv: kv[1], reverse=True)[:n]\n\ndef main():\n    p = Path(\"sample.txt\")\n    if not p.exists():\n        print(f\"文件不存在：{p}\")\n        return\n    text = p.read_text(encoding=\"utf-8\")\n    for word, cnt in top_words(count_words(text)):\n        print(f\"{word:<15}{cnt:>5}\")\n\nif __name__ == \"__main__\":\n    main()"}, {"type": "h", "level": 3, "text": "v3 多文件版（D11）", "html": "v3 多文件版（D11）"}, {"type": "ul", "items": ["用 <code>Path(&quot;data&quot;).rglob(&quot;*.txt&quot;)<\/code> 遍历目录", "多个文件的词频<strong>合并累加<\/strong>", "输出 <code>report.csv<\/code>（<code>word,count<\/code>）与 <code>report.md<\/code>"]}, {"type": "h", "level": 3, "text": "v4 报告版（第 2 周）", "html": "v4 报告版（第 2 周）"}, {"type": "ul", "items": ["输出结构：<code>总词数 / 不同词数 / Top10 表格 / 最长词<\/code>", "用 f-string 对齐输出漂亮的终端表格"]}, {"type": "h", "level": 3, "text": "v5 大文件版（D9 配套）", "html": "v5 大文件版（D9 配套）"}, {"type": "ul", "items": ["逐行读取 + 生成器，内存恒定", "用 <code>time.perf_counter()<\/code> 对比 v2 一次读全 vs 逐行流式"]}, {"type": "h", "level": 3, "text": "v6 命令行版（第 3 周起）", "html": "v6 命令行版（第 3 周起）"}, {"type": "ul", "items": ["用 <code>argparse<\/code> 接收 <code>--file<\/code>、<code>--top n<\/code>、<code>--output<\/code>", "打包成 <code>python wordfreq.py --file sample.txt --top 5<\/code>", "<strong>这一步直接为 <code>neurocards<\/code> 的 argparse 铺路<\/strong>"]}, {"type": "h", "level": 3, "text": "v7 产品化（P1 后期）", "html": "v7 产品化（P1 后期）"}, {"type": "ul", "items": ["把计数、排序、报告生成拆成类 <code>WordCounter<\/code>", "输出 JSON 时用 <code>ensure_ascii=False<\/code> 保留中文", "加 <code>pytest<\/code>：测试 <code>count_words<\/code> 与 <code>top_words<\/code> 的边界（空文件、单行、中文）"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "五、每日自测题（检验当天有没有学进去）", "html": "五、每日自测题（检验当天有没有学进去）"}, {"type": "p", "html": "<strong>文件 I/O 自测<\/strong>"}, {"type": "ol", "items": ["<code>open(&quot;a.txt&quot;, &quot;w&quot;)<\/code> 和 <code>open(&quot;a.txt&quot;, &quot;a&quot;)<\/code> 有什么区别？", "为什么推荐 <code>with open(...) as f:<\/code> 而不是 <code>f = open(...)<\/code>？", "<code>f.read()<\/code> 之后再调用 <code>f.readline()<\/code> 为什么拿到空字符串？", "读中文文件报 <code>UnicodeDecodeError<\/code> 怎么排查？", "<code>Path(__file__).parent<\/code> 和 <code>os.getcwd()<\/code> 有什么区别？谁更可靠？", "怎么判断一个文件/目录是否存在？", "把字典写进 JSON 文件，哪两个参数最重要？"]}, {"type": "p", "html": "<strong>数据结构自测<\/strong>"}, {"type": "ol", "items": ["list 的 <code>x in a<\/code> 为什么慢？set 为什么快？", "<code>dict.fromkeys<\/code> 能用来干什么？值默认是什么？", "怎么按词频倒序排序一个字典？（写出完整表达式）", "<code>sorted<\/code> 的 <code>key<\/code> 返回元组时会发生什么？", "去重且保序，至少写出两种方法。"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "六、文件 I/O 常见坑（先记住，少走弯路）", "html": "六、文件 I/O 常见坑（先记住，少走弯路）"}, {"type": "ol", "items": ["<strong>不写 <code>encoding=&quot;utf-8&quot;<\/code><\/strong> → Windows 默认 GBK，读中文文件容易乱码", "<strong><code>&quot;w&quot;<\/code> 是覆盖不是追加<\/strong> → 想追加用 <code>&quot;a&quot;<\/code>", "<strong>相对路径是相对&quot;运行时的当前目录&quot;<\/strong>，不是脚本所在目录 → 用 <code>Path(__file__).parent / &quot;x.txt&quot;<\/code>", "<strong>Windows 路径反斜杠<\/strong> → 要么用 <code>r&quot;C:\\data\\a.txt&quot;<\/code>，要么用 <code>Path(&quot;C:/data/a.txt&quot;)<\/code>", "<strong><code>read()<\/code> 一把梭大文件会爆内存<\/strong> → 大文件逐行迭代", "<strong>忘记 close<\/strong> → 一律用 <code>with<\/code>", "<strong>JSON 中文默认转义成 <code>\\uXXXX<\/code><\/strong> → <code>ensure_ascii=False<\/code>", "<strong>CSV 用 Excel 打开乱码<\/strong> → 加 <code>encoding=&quot;utf-8-sig&quot;<\/code>", "<strong>文件末尾没有换行<\/strong> → <code>splitlines()<\/code> 比 <code>split(&quot;\\n&quot;)<\/code> 更稳", "<strong>写文件前不懂覆盖逻辑<\/strong> → 重要数据先备份，调试时先写临时文件"]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "七、下周开始的推荐资源", "html": "七、下周开始的推荐资源"}, {"type": "table", "rows": [["类型", "资源", "用法"], ["文件 I/O", "<a href=\"https://docs.python.org/zh-cn/3/tutorial/inputoutput.html\" target=\"_blank\" rel=\"noopener\">Python 官方教程 · 输入与输出<\/a>", "权威，D1–D9 对照看"], ["文件 I/O", "<a href=\"https://liaoxuefeng.com/books/python/io/index.html\" target=\"_blank\" rel=\"noopener\">廖雪峰 · IO 编程<\/a>", "中文，读文件/写文件章节"], ["综合", "CS50P Week 6（File I/O）", "配套练习，B 站有中字"], ["pathlib", "<a href=\"https://docs.python.org/zh-cn/3/library/pathlib.html\" target=\"_blank\" rel=\"noopener\">pathlib 官方文档<\/a>", "D3 当天查表"], ["CSV/JSON", "csv / json 官方文档", "D6、D7 当天查表"], ["算法", "<a href=\"https://programmercarl.com\" target=\"_blank\" rel=\"noopener\">代码随想录<\/a>", "数组/哈希表专题"], ["算法", "LeetCode CN", "每天 1–2 题 Easy"]]}, {"type": "hr"}, {"type": "h", "level": 2, "text": "八、原则（避免坚持不下去）", "html": "八、原则（避免坚持不下去）"}, {"type": "ol", "items": ["<strong>每天必敲代码<\/strong>：看视频不算学习，敲过才算。", "<strong>卡住先自己读报错 20 分钟<\/strong>：读懂 <code>Traceback<\/code> 的每一行，再搜。", "<strong>小步提交<\/strong>：每完成一天 I/O 内容就 <code>git commit<\/code> 一次（例如 <code>feat: file io D1<\/code>）。", "<strong>日志别断<\/strong>：daily-log 每天一行，这是你求职时&quot;持续学习&quot;的证据。", "<strong>项目优先<\/strong>：所有知识点最终都收敛到 <code>neurocards<\/code> 项目里，不要为了学而学。"]}]}, {"id": "appendix", "title": "附录 · 原始素材", "chapter": "附录", "keywords": [], "search": "原始素材 截图 转写 归档", "blocks": [{"type": "h", "level": 1, "text": "附录 · 原始素材", "html": "附录 · 原始素材"}, {"type": "p", "html": "下列文件是原始截图逐字转写归档，内容已归纳进各主题笔记，保留仅为溯源："}, {"type": "table", "rows": [["原始素材文件", "说明"], ["source/2026-10-17/A.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-17/B.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-17/C.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-17/D.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-18/A.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-19/A.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-20/A.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-21/A.md", "截图逐字转写（已整理进上方主题笔记）"], ["source/2026-10-22/A.md", "截图逐字转写（已整理进上方主题笔记）"]]}]}], "chapters": [{"title": "前言", "pages": ["readme", "index", "timeline"]}, {"title": "第 1 章 基础结构", "pages": ["topic-01", "topic-09", "topic-10", "topic-11", "topic-22"]}, {"title": "第 2 章 文本处理", "pages": ["topic-02"]}, {"title": "第 3 章 容器", "pages": ["topic-03", "topic-04", "topic-05"]}, {"title": "第 4 章 数据处理", "pages": ["topic-06", "topic-07"]}, {"title": "第 5 章 进阶", "pages": ["topic-08", "topic-12", "topic-13", "topic-14", "topic-15", "topic-16", "topic-17", "topic-18", "topic-19", "topic-23", "topic-27"]}, {"title": "第 6 章 工程", "pages": ["topic-20", "topic-21", "topic-24", "topic-25", "topic-26"]}, {"title": "第 7 章 每日记录", "pages": ["daily-01", "daily-02", "daily-03", "daily-04", "daily-05", "daily-06", "daily-07", "daily-08", "daily-09", "daily-10", "daily-11"]}, {"title": "第 8 章 学习计划", "pages": ["plan-01", "plan-02", "plan-03"]}, {"title": "附录", "pages": ["appendix"]}]};
const pages = BOOK.pages;
const byId = {}; pages.forEach(p => byId[p.id] = p);
const chapters = BOOK.chapters;

function buildSidebar(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = '';
  chapters.forEach(ch => {
    const div = document.createElement('div'); div.className = 'ch';
    const btn = document.createElement('button');
    btn.innerHTML = '<span class="caret">▼</span>' + esc(ch.title);
    btn.onclick = () => { div.classList.toggle('closed'); };
    div.appendChild(btn);
    const ul = document.createElement('ul');
    ch.pages.forEach(id => {
      const p = byId[id]; if(!p) return;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + id; a.dataset.id = id; a.textContent = p.title;
      a.onclick = (e) => { e.preventDefault(); go(id); };
      li.appendChild(a); ul.appendChild(li);
    });
    div.appendChild(ul); nav.appendChild(div);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderBlock(b){
  if(b.type === 'h'){
    if(b.level === 1) return '';
    const tag = 'h' + Math.min(b.level + 1, 6);
    return '<' + tag + '>' + b.html + '</' + tag + '>';
  }
  if(b.type === 'p') return '<p>' + b.html + '</p>';
  if(b.type === 'code') return '<pre class="code"><code>' + esc(b.text) + '</code></pre>';
  if(b.type === 'quote') return '<blockquote>' + b.html + '</blockquote>';
  if(b.type === 'ul') return '<ul>' + b.items.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if(b.type === 'ol') return '<ol>' + b.items.map(x => '<li>' + x + '</li>').join('') + '</ol>';
  if(b.type === 'table'){
    let h = '<table><thead><tr>' + b.rows[0].map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
    b.rows.slice(1).forEach(r => { h += '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>'; });
    return h + '</tbody></table>';
  }
  if(b.type === 'hr') return '<hr>';
  return '';
}
let currentIndex = -1;
function order(){ return pages.map(p => p.id); }
function go(id, push){
  const idx = pages.findIndex(p => p.id === id);
  if(idx < 0) return;
  const p = pages[idx]; currentIndex = idx;
  const main = document.getElementById('content');
  const bodyHtml = p.blocks.map(renderBlock).join('\n');
  let outlineLinks = p.blocks.filter(b => b.type === 'h' && b.level === 2).map((b, i) =>
    '<a href="#" data-sec="' + i + '">' + b.text + '</a>').join('');
  const outline = outlineLinks ? '<div id="outline"><b>📖 本页目录</b><br>' + outlineLinks + '</div>' : '';
  main.innerHTML =
    '<div class="crumb">' + esc(p.chapter) + ' <span>›</span> <b>' + esc(p.title) + '</b></div>' +
    '<h1>' + esc(p.title) + '</h1>' + outline + bodyHtml +
    '<div class="pager">' +
    '<button id="prev"' + (idx === 0 ? ' disabled' : '') + '>← 上一页</button>' +
    '<button id="next"' + (idx === pages.length - 1 ? ' disabled' : '') + '>下一页 →</button></div>';
  // 页内小节跳转
  main.querySelectorAll('#outline a').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const hs = main.querySelectorAll('h2');
      const target = hs[+a.dataset.sec];
      if(target){ target.scrollIntoView({behavior:'smooth', block:'start'}); }
    };
  });
  // 内部链接（data-go）
  main.querySelectorAll('a[data-go]').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); };
  });
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if(prev) prev.onclick = () => { if(idx > 0) go(pages[idx - 1].id); };
  if(next) next.onclick = () => { if(idx < pages.length - 1) go(pages[idx + 1].id); };
  document.querySelectorAll('#sidebar a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  if(push !== false) history.replaceState(null, '', '#' + id);
  window.scrollTo({top: 0, behavior: 'instant' in window ? 'auto' : 'auto'});
  document.getElementById('sidebar').classList.remove('open');
  hideResults();
}
function bindSearch(){
  const q = document.getElementById('q');
  const box = document.getElementById('results');
  function run(){
    const term = q.value.trim().toLowerCase();
    if(!term){ box.style.display = 'none'; box.innerHTML = ''; return; }
    const hits = [];
    pages.forEach(p => {
      const text = (p.search || '').toLowerCase();
      const title = p.title.toLowerCase();
      let score = 0, pos = -1;
      if(title.includes(term)) score += 100;
      if((p.keywords || []).some(k => k.toLowerCase().includes(term))) score += 60;
      pos = text.indexOf(term);
      if(pos >= 0) score += 10;
      if(score > 0){
        let snippet = '';
        if(pos >= 0) snippet = (p.search || '').slice(Math.max(0, pos - 30), pos + 60);
        hits.push({p, score, snippet});
      }
    });
    hits.sort((a, b) => b.score - a.score);
    if(!hits.length){ box.innerHTML = '<div class="r" style="color:var(--muted)">没有找到「' + esc(q.value) + '」相关笔记</div>'; box.style.display = 'block'; return; }
    box.innerHTML = hits.slice(0, 12).map(h =>
      '<div class="r" data-id="' + h.p.id + '"><b>' + esc(h.p.title) + '</b>' +
      '<small>' + esc(h.p.chapter) + (h.snippet ? ' · …' + esc(h.snippet) + '…' : '') + '</small></div>'
    ).join('');
    box.style.display = 'block';
    box.querySelectorAll('.r[data-id]').forEach(el => { el.onclick = () => { go(el.dataset.id); q.value = ''; run(); }; });
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', (e) => { if(e.key === 'Enter' && box.querySelector('.r[data-id]')) box.querySelector('.r[data-id]').click(); if(e.key === 'Escape'){ q.value = ''; run(); } });
  document.addEventListener('click', (e) => { if(!box.contains(e.target) && e.target !== q) hideResults(); });
}
function hideResults(){ const box = document.getElementById('results'); box.style.display = 'none'; }
document.addEventListener('keydown', (e) => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft' && currentIndex > 0) go(pages[currentIndex - 1].id);
  if(e.key === 'ArrowRight' && currentIndex < pages.length - 1) go(pages[currentIndex + 1].id);
  if(e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
});
function bindTheme(){
  const btn = document.getElementById('theme');
  const saved = localStorage.getItem('book-theme');
  if(saved === 'dark') document.body.classList.add('dark');
  btn.onclick = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('book-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  };
}
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar(); bindSearch(); bindTheme();
  document.getElementById('navtoggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
  const id = location.hash.slice(1);
  go(byId[id] ? id : pages[0].id, false);
});
</script>
